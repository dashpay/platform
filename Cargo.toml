[workspace.dependencies]
# TODO(pin): tracks dashpay/rust-dashcore `dash-evo-tool` branch (18c68d4c),
# a dev-evo-tool integration branch combining PR #909 (out-of-order UTXO
# spend fix, #649) and PR #818 (address reservation on hand-out) — the two
# PRs are sibling forks off `dev` and neither is a superset of the other, so
# neither can be pinned alone without dropping the other's fix. Re-pin to
# `dev` directly once both PRs land there.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
dash-network-seeds = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
key-wallet-ffi = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
dash-network = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "18c68d4c10ed349f11358e0a9f7c8c59eab8e098" }

tokio-metrics = "0.5"

# Size-tuned profile for the iOS `rs-unified-sdk-ffi` staticlib, which
# otherwise ships huge. Inherits `release` and is ONLY used by the iOS
# build (`build_ios.sh --profile release`)
[profile.release-ios]
inherits = "release"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3

# Debug counterpart for smaller iOS dev builds. Inherits the standard `dev`
# profile (and is ONLY used by the iOS build (`build_ios.sh --profile dev`)
[profile.dev-ios]
inherits = "dev"
panic = "abort"
debug = "line-tables-only"

# Android counterparts for the `rs-unified-sdk-jni` cdylib, used ONLY by
# `packages/kotlin-sdk/build_android.sh`. Unlike iOS, panic stays
# `unwind`: a JNI library must never abort the app process — panics are
# caught at the shim boundary and rethrown as Java exceptions.
[profile.release-android]
inherits = "release"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev-android]
inherits = "dev"
strip = "debuginfo"
lto = "thin"

# Optimize heavy crypto crates even in dev/test builds so that
# Halo 2 proof generation and verification run at near-release speed.
# Without this, ZK operations are 10-100x slower (debug field arithmetic).
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.halo2_poseidon]
opt-level = 3
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.grovedb-commitment-tree]
opt-level = 3
# Same reasoning for Argon2id: a debug-built KDF is memory-hard by design, so
# an unoptimized one costs seconds per derivation and dominates any test that
# unlocks a `platform-wallet-storage` vault. `platform-wallet-storage` is the
# only workspace member that compiles argon2, so this override touches nothing
# else here despite the workspace-global syntax.
[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.halo2_poseidon]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.grovedb-commitment-tree]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3

[workspace.package]

version = "4.1.0"
rust-version = "1.92"
