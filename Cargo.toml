[workspace]

resolver = "2"

members = [
    "packages/dapi-grpc",
    "packages/rs-dash-platform-macros",
    "packages/rs-dpp",
    "packages/rs-drive",
    "packages/rs-platform-value",
    "packages/rs-platform-serialization",
    "packages/rs-platform-serialization-derive",
    "packages/rs-platform-version",
    "packages/rs-platform-versioning",
    "packages/rs-platform-value-convertible",
    "packages/rs-drive-abci",
    "packages/dashpay-contract",
    "packages/withdrawals-contract",
    "packages/masternode-reward-shares-contract",
    "packages/feature-flags-contract",
    "packages/dpns-contract",
    "packages/data-contracts",
    "packages/rs-drive-proof-verifier",
    "packages/rs-context-provider",
    "packages/rs-sdk-trusted-context-provider",
    "packages/wasm-dpp",
    "packages/wasm-dpp2",
    "packages/rs-dapi-client",
    "packages/rs-sdk",
    "packages/strategy-tests",
    "packages/simple-signer",
    "packages/rs-json-schema-compatibility-validator",
    "packages/check-features",
    "packages/wallet-utils-contract",
    "packages/token-history-contract",
    "packages/keyword-search-contract",
    "packages/rs-sdk-ffi",
    "packages/wasm-drive-verify",
    "packages/dash-platform-balance-checker",
    "packages/rs-dapi",
    "packages/rs-dash-event-bus",
    "packages/rs-platform-wallet",
    "packages/wasm-sdk",
]

[workspace.dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }
dash-spv-ffi = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "542a617843d1689217e386a678945caf461665c4" }

[workspace.package]

version = "3.1.0-dev.1"
rust-version = "1.92"
