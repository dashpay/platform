[workspace.dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
dash-network-seeds = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
key-wallet-ffi = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
dash-network = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "93260bf39bac5d9d09e89bfb45e9ea3ff7fdcbcd" }
tokio-metrics = "0.5"

# Size-tuned profile for the iOS `rs-unified-sdk-ffi` staticlib, which
# otherwise ships huge. Inherits `release` and is ONLY used by the iOS
# build (`build_ios.sh --profile release`)
[profile.release-ios]
inherits = "release"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3

# Debug counterpart for smaller iOS dev builds. Inherits the standard `dev`
# profile (and is ONLY used by the iOS build (`build_ios.sh --profile dev`)
[profile.dev-ios]
inherits = "dev"
panic = "abort"
debug = "line-tables-only"

# Android counterparts for the `rs-unified-sdk-jni` cdylib, used ONLY by
# `packages/kotlin-sdk/build_android.sh`. Unlike iOS, panic stays
# `unwind`: a JNI library must never abort the app process — panics are
# caught at the shim boundary and rethrown as Java exceptions.
[profile.release-android]
inherits = "release"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev-android]
inherits = "dev"
strip = "debuginfo"
lto = "thin"

# Optimize heavy crypto crates even in dev/test builds so that
# Halo 2 proof generation and verification run at near-release speed.
# Without this, ZK operations are 10-100x slower (debug field arithmetic).
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.halo2_poseidon]
opt-level = 3
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.grovedb-commitment-tree]
opt-level = 3
# Same reasoning for Argon2id: a debug-built KDF is memory-hard by design, so
# an unoptimized one costs seconds per derivation and dominates any test that
# unlocks a `platform-wallet-storage` vault. `platform-wallet-storage` is the
# only workspace member that compiles argon2, so this override touches nothing
# else here despite the workspace-global syntax.
[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.halo2_poseidon]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.grovedb-commitment-tree]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3

[workspace.package]

version = "4.2.0-dev.8"
rust-version = "1.92"

# DashVM engine dependency set (dashpay/platform#4626, section 8). Read by
# .github/scripts/check-engine-advisories.py, which audits every resolved version of these
# crates from outside the workspace configuration: an advisory against one of them fails the
# engine audit regardless of the ignore list in .cargo/audit.toml, because the engine decides
# consensus results. Names only; the release is pinned where the crates are used (the runtime
# and validation crates) and drift of the pinned configuration is checked there. A crate that
# the lockfile does not resolve yet is reported as planned and skipped, so the set can name
# the engine before the runtime crate lands. Membership is provisional until the runtime crate
# pins the release; see book/src/architecture/engine-dependencies-and-hotfixes.md.
[workspace.metadata.dashvm.engine]
crates = [
    "wasmtime",
    "wasmtime-environ",
    "wasmtime-internal-cranelift",
    "cranelift-codegen",
    "cranelift-frontend",
    "cranelift-native",
    "wasmparser",
    "wasm-encoder",
]
# A scoped acknowledgement hides one advisory from the engine audit until it expires. It must
# say why the advisory cannot reach a node under the pinned profile (for example a Winch or a
# component-model bug when neither is compiled in). `expires` is an ISO 8601 date at most
# 90 days out (provisional bound, see the book chapter); renewal is a new entry with a fresh
# reason, and an entry whose advisory is no longer reported must be removed.
# acknowledged = [
#     { id = "RUSTSEC-2026-0000", reason = "...", expires = "2026-12-31" },
# ]
# A temporary patch (Q01: an exception, not a standing engine fork) must be declared here
# with the upstream fix it carries and the date by which an upstream release replaces it.
# Every `[patch.*]` entry for an engine crate without a declaration fails the audit.
# patches = [
#     { crate = "wasmtime", upstream = "https://github.com/bytecodealliance/wasmtime/pull/0", expires = "2026-12-31" },
# ]
