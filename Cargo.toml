members = [
    "packages/dapi-grpc",
    "packages/rs-dash-platform-macros",
    "packages/rs-dpp",
    "packages/rs-drive",
    "packages/rs-platform-value",
    "packages/rs-platform-serialization",
    "packages/rs-platform-serialization-derive",
    "packages/rs-platform-version",
    "packages/rs-platform-versioning",
    "packages/rs-platform-value-convertible",
    "packages/rs-dpp-json-convertible-derive",
    "packages/rs-drive-abci",
    "packages/dashpay-contract",
    "packages/withdrawals-contract",
    "packages/masternode-reward-shares-contract",
    "packages/dpns-contract",
    "packages/data-contracts",
    "packages/rs-drive-proof-verifier",
    "packages/rs-context-provider",
    "packages/rs-sdk-trusted-context-provider",
    "packages/wasm-dpp",
    "packages/wasm-dpp2",
    "packages/rs-dapi-client",
    "packages/rs-dash-async",
    "packages/dash-platform-queries",
    "packages/rs-sdk",
    "packages/strategy-tests",
    "packages/simple-signer",
    "packages/rs-json-schema-compatibility-validator",
    "packages/check-features",
    "packages/wallet-utils-contract",
    "packages/token-history-contract",
    "packages/document-history-contract",
    "packages/keyword-search-contract",
    "packages/rs-sdk-ffi",
    "packages/wasm-drive-verify",
    "packages/dash-platform-balance-checker",
    "packages/rs-dapi",
    "packages/rs-dash-event-bus",
    "packages/rs-platform-wallet",
    "packages/rs-platform-wallet-ffi",
    "packages/rs-platform-wallet-storage",
    "packages/rs-platform-encryption",
    "packages/wasm-sdk",
    "packages/rs-unified-sdk-ffi",
    "packages/rs-unified-sdk-jni",
    "packages/rs-scripts",
]

[workspace.dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
dash-network-seeds = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
key-wallet-ffi = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
dash-network = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "4db5c36701b8f38c4aea704badb81e3103ed701d" }

tokio-metrics = "0.5"

# Size-tuned profile for the iOS `rs-unified-sdk-ffi` staticlib, which
# otherwise ships huge. Inherits `release` and is ONLY used by the iOS
# build (`build_ios.sh --profile release`)
[profile.release-ios]
inherits = "release"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3

# Debug counterpart for smaller iOS dev builds. Inherits the standard `dev`
# profile (and is ONLY used by the iOS build (`build_ios.sh --profile dev`)
[profile.dev-ios]
inherits = "dev"
panic = "abort"
debug = "line-tables-only"

# Android counterparts for the `rs-unified-sdk-jni` cdylib, used ONLY by
# `packages/kotlin-sdk/build_android.sh`. Unlike iOS, panic stays
# `unwind`: a JNI library must never abort the app process — panics are
# caught at the shim boundary and rethrown as Java exceptions.
[profile.release-android]
inherits = "release"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev-android]
inherits = "dev"
strip = "debuginfo"
lto = "thin"

# Optimize heavy crypto crates even in dev/test builds so that
# Halo 2 proof generation and verification run at near-release speed.
# Without this, ZK operations are 10-100x slower (debug field arithmetic).
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.halo2_poseidon]
opt-level = 3
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.grovedb-commitment-tree]
opt-level = 3

[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.halo2_poseidon]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.grovedb-commitment-tree]
opt-level = 3

[workspace.package]

version = "4.2.0-dev.5"
rust-version = "1.92"

# ============================================================================
# TEMPORARY — QA ONLY. DROP THIS AT THE REAL RE-PIN.
#
# Every grovedb crate is pinned in the package manifests to dashpay/grovedb
# rev 6c882c3, which carries a restore defect for sum trees: applying a state
# sync snapshot chunk fails GroveDB verification ("apply_snapshot_chunk grovedb
# verification failed with N incorrect hashes"), so a joining node can never
# complete a state sync. packages/rs-drive-abci/tests/sum_tree_sync_probe.rs
# pins that defect in-tree.
#
# dashpay/grovedb#840 (branch feat/state-sync-v2 on the PastaPastaPasta fork,
# head 10a63e1) fixes it, and its restore wire version is 1, which is inside
# drive-abci's supported set — so no protocol plumbing changes with it.
#
# This section exists so the state sync e2e can be run against the fix before
# the fork is merged and re-pinned by rev. It MUST be removed once the real
# pin lands: a branch reference is not reproducible, and a workspace [patch]
# silently overrides every manifest's rev.
# ============================================================================
[patch."https://github.com/dashpay/grovedb"]
grovedb = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-costs = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-path = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-storage = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-version = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-epoch-based-storage-flags = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-query = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
grovedb-commitment-tree = { git = "https://github.com/PastaPastaPasta/grovedb", branch = "feat/state-sync-v2" }
