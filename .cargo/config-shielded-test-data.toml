[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C",
    "target-feature=-crt-static",
    "-C",
    "target-cpu=x86-64",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "target-feature=-crt-static",
    "-C",
    "target-cpu=x86-64",
]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# Activates BOTH the base SDK test-data gate and the shielded-pool seeding /
# snapshot-bake gate. Selected in the Dockerfile when `SHIELDED_TEST_DATA=true`
# (which implies SDK_TEST_DATA, since shielded fixtures are seeded inside
# `create_sdk_test_data`).
[target.'cfg(all())']
rustflags = [
    "--cfg",
    "tokio_unstable",
    '--cfg',
    'create_sdk_test_data',
    '--cfg',
    'create_shielded_test_data',
]
