[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C",
    "target-feature=-crt-static",
    "-C",
    "target-cpu=x86-64",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "target-feature=-crt-static",
    "-C",
    "target-cpu=x86-64",
    "-C",
    "link-arg=-lstdc++",
]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[target.'cfg(all())']
rustflags = ["--cfg", "tokio_unstable"]

# GroveDB compiles its RocksDB and its LigninDB engine for Drive, and with this it
# puts `GroveDb` on the one that is chosen when a database is opened
# (GROVEDB_STORAGE_ENGINE of drive-abci). The variable is read by GroveDB's build
# script alone.
[env]
GROVEDB_DEFAULT_ENGINE = "either"
