codecov:
  require_ci_to_pass: true

flags:
  rust:
    carryforward: false
  rust-shielded:
    carryforward: true

ignore:
  - "**/test_utils.rs"
  - "**/test_utils/**"
  - "**/tests.rs"
  - "**/tests/**"
  - "**/test/**"
  - "packages/strategy-tests/**"
  - "packages/rs-sdk-ffi/**"
  - "packages/rs-platform-wallet-ffi/**"
  - "packages/wasm-dpp/**"
  - "packages/wasm-dpp2/**"
  - "packages/wasm-sdk/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 50%

comment:
  layout: "condensed_header, diff, components, condensed_files"
  behavior: default
  require_changes: true

component_management:
  individual_components:
    - component_id: dpp
      name: dpp
      paths:
        - packages/rs-dpp/
    - component_id: drive
      name: drive
      paths:
        - packages/rs-drive/
    - component_id: drive-abci
      name: drive-abci
      paths:
        - packages/rs-drive-abci/
    - component_id: sdk
      name: sdk
      paths:
        - packages/rs-sdk/
    - component_id: dapi-client
      name: dapi-client
      paths:
        - packages/rs-dapi-client/
    - component_id: platform-version
      name: platform-version
      paths:
        - packages/rs-platform-version/
    - component_id: platform-value
      name: platform-value
      paths:
        - packages/rs-platform-value/
    - component_id: platform-wallet
      name: platform-wallet
      paths:
        - packages/rs-platform-wallet/
    - component_id: drive-proof-verifier
      name: drive-proof-verifier
      paths:
        - packages/rs-drive-proof-verifier/
