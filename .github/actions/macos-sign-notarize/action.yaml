---
name: "Sign and notarize macOS installers"
description: |
  Signs every .pkg under `path` with the Developer ID Installer certificate,
  has Apple notarize it and staples the ticket. The packages are changed in
  place and nothing is uploaded.

  The release and its rehearsal both call this action, so the rehearsal runs
  the steps a release runs.
inputs:
  path:
    description: Directory that holds the .pkg files
    required: true
  certificate_base64:
    description: Developer ID Installer certificate with its key, as a base64-encoded .p12
    required: true
  certificate_password:
    description: Password of the .p12
    required: true
  keychain_password:
    description: Password for the temporary keychain
    required: true
  notary_api_key_base64:
    description: Team App Store Connect API key, as a base64-encoded .p8
    required: true
  notary_api_key_id:
    description: Key ID of the App Store Connect API key
    required: true
  notary_api_issuer_id:
    description: Issuer ID of the App Store Connect API key
    required: true

runs:
  using: composite
  steps:
    - name: Install the Apple certificate
      shell: bash
      env:
        BUILD_CERTIFICATE_BASE64: ${{ inputs.certificate_base64 }}
        P12_PASSWORD: ${{ inputs.certificate_password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain_password }}
      run: |
        set -euo pipefail
        for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD; do
          [ -n "${!name}" ] || { echo "::error::The MACOS_$name secret is not set."; exit 1; }
        done
        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

    - name: Sign macOS installers
      shell: bash
      env:
        PACKAGES_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        found=false
        while IFS= read -r -d '' pkg; do
          found=true
          productsign --sign 'Developer ID Installer: The Dash Foundation, Inc.' \
            --keychain "$RUNNER_TEMP/app-signing.keychain-db" \
            "$pkg" "$RUNNER_TEMP/signed.pkg"
          mv "$RUNNER_TEMP/signed.pkg" "$pkg"
        done < <(find "$PACKAGES_PATH" -type f -name '*.pkg' -print0)
        "$found" || { echo "::error::No .pkg files found under $PACKAGES_PATH."; exit 1; }

    - name: Notarize MacOS Release Build
      shell: bash
      # A team App Store Connect API key, so notarization does not depend
      # on one person's Apple ID staying a member of the developer team.
      env:
        PACKAGES_PATH: ${{ inputs.path }}
        NOTARY_API_KEY_BASE64: ${{ inputs.notary_api_key_base64 }}
        NOTARY_API_KEY_ID: ${{ inputs.notary_api_key_id }}
        NOTARY_API_ISSUER_ID: ${{ inputs.notary_api_issuer_id }}
      run: |
        set -euo pipefail
        for name in NOTARY_API_KEY_BASE64 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
          [ -n "${!name}" ] || { echo "::error::The MACOS_$name secret is not set."; exit 1; }
        done
        NOTARY_API_KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
        trap 'rm -f "$NOTARY_API_KEY_PATH"' EXIT
        # macOS base64 exits 0 on input that is not base64, so check the result too.
        (umask 077; printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode -o "$NOTARY_API_KEY_PATH") \
          && grep -q 'BEGIN PRIVATE KEY' "$NOTARY_API_KEY_PATH" \
          || { echo '::error::Could not decode MACOS_NOTARY_API_KEY_BASE64 into a .p8 key; it must be the base64 of the key file.'; exit 1; }
        notary_auth=(--key "$NOTARY_API_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")
        submit_log="$RUNNER_TEMP/notarytool_submit.log"
        while IFS= read -r -d '' pkg; do
          # stdin is the package list, so keep it away from the tools.
          if ! xcrun notarytool submit "$pkg" "${notary_auth[@]}" --wait --timeout 1h < /dev/null 2>&1 | tee "$submit_log"; then
            echo "::error::notarytool failed for $pkg."
            exit 1
          fi
          # notarytool exits 0 when Apple rejects the submission.
          if ! grep -q 'status: Accepted' "$submit_log"; then
            submission_id="$(awk '$1 == "id:" { print $2; exit }' "$submit_log")"
            [ -z "$submission_id" ] || xcrun notarytool log "$submission_id" "${notary_auth[@]}" < /dev/null || true
            echo "::error::Apple did not report $pkg as accepted: it was rejected or is still in progress."
            exit 1
          fi
          echo "::notice::Apple accepted $pkg."
          # Attach the ticket so the installer also verifies offline. The
          # ticket can take a moment to become available after acceptance.
          # An accepted package without it still verifies online.
          stapled=false
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$pkg" < /dev/null; then
              stapled=true
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 15
          done
          "$stapled" || echo "::warning::Could not staple the notarization ticket to $pkg."
        done < <(find "$PACKAGES_PATH" -type f -name '*.pkg' -print0)

    - name: Delete the Apple keychain
      if: always()
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/build_certificate.p12"
        # The keychain is missing when the first step failed before creating it.
        if [ -e "$RUNNER_TEMP/app-signing.keychain-db" ]; then
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
        fi
