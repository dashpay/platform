---
# release-kotlin-sdk.yml and release-swift-sdk.yml carry an inline copy of
# this step, because a dispatch from the dev branch for an older tag checks
# out a tree without this action. Keep those copies in sync with it.
name: "Release Cargo target cache"
description: >-
  Point CARGO_TARGET_DIR at a per-workflow directory outside the checkout.
  On disposable release runners this is job-local HOME state, destroyed with
  the container, never a cache shared with PRs. Reset it when it outgrows
  max-gib or available space drops below min-free-gib.
inputs:
  name:
    description: Cache directory name, unique per release workflow
    required: true
  max-gib:
    description: Reset the cache when it grows past this many GiB
    required: false
    default: "60"
  min-free-gib:
    description: Reset the cache when the volume has less than this many GiB free
    required: false
    default: "40"
runs:
  using: composite
  steps:
    - name: Prepare release Cargo target cache
      # Quoted: a self-hosted runner's temp directory can contain spaces.
      shell: bash --noprofile --norc -e -o pipefail "{0}"
      env:
        CACHE_NAME: ${{ inputs.name }}
        MAX_GIB: ${{ inputs.max-gib }}
        MIN_FREE_GIB: ${{ inputs.min-free-gib }}
      run: |
        set -euo pipefail
        case "$CACHE_NAME" in
          ''|*/*|.*)
            echo "::error::Invalid release target cache name '$CACHE_NAME'."
            exit 1
            ;;
        esac
        RELEASE_TARGET_DIR="$HOME/.cache/dash-platform/$CACHE_NAME"
        MAX_CACHE_KIB=$((MAX_GIB * 1024 * 1024))
        MIN_FREE_KIB=$((MIN_FREE_GIB * 1024 * 1024))
        mkdir -p "$RELEASE_TARGET_DIR"
        USED_KIB=$(du -sk "$RELEASE_TARGET_DIR" | cut -f1)
        FREE_KIB=$(df -Pk "$RELEASE_TARGET_DIR" | awk 'NR == 2 { print $4 }')
        if [ "$USED_KIB" -gt "$MAX_CACHE_KIB" ] || [ "$FREE_KIB" -lt "$MIN_FREE_KIB" ]; then
          echo "::notice::Resetting the release target cache (${USED_KIB} KiB used, ${FREE_KIB} KiB free on the volume)."
          rm -rf "${RELEASE_TARGET_DIR:?}"
          mkdir -p "$RELEASE_TARGET_DIR"
        fi
        du -sh "$RELEASE_TARGET_DIR"
        df -h "$RELEASE_TARGET_DIR"
        echo "CARGO_TARGET_DIR=$RELEASE_TARGET_DIR" >> "$GITHUB_ENV"
