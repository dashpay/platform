---
name: "Setup Node.JS"
description: "Setup Node.JS binaries, dependencies and cache"
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - name: Setup Node.JS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org"

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Disable NPM audit
      shell: bash
      run: npm config set audit false

    - name: Cache NPM build artifacts
      uses: actions/cache@v4
      with:
        path: |
          .yarn/unplugged
        key: ${{ runner.os }}/yarn/unplugged/${{ runner.arch }}/${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}/yarn/unplugged/${{ runner.arch }}/

    - name: Install dependencies
      shell: bash
      env:
        # Cap concurrent build-script execution to avoid EBADF races when
        # many native-module postinstall scripts run in parallel on CI.
        # Default is 10; 2 keeps some parallelism for speed.
        YARN_TASK_POOL_CONCURRENCY: '2'
      run: |
        for attempt in 1 2 3; do
          if yarn install --inline-builds; then
            exit 0
          fi
          echo "::warning::yarn install failed on attempt ${attempt}, retrying..."
          sleep $((attempt * 5))
        done
        echo "::error::yarn install failed after 3 attempts"
        exit 1
