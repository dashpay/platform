name: Refresh SwiftData schema freeze PRs

# PR CI tests a branch merged with its base as of that run, and merging does not
# require an up-to-date branch. When the Swift SDK changes on a base, merge it
# into the open schema freeze PRs (swift-sdk-freeze-release.yml) so their CI runs
# again and a stale green build cannot be merged.
on:
  push:
    branches:
      - 'v*-dev'
    paths:
      - 'packages/swift-sdk/**'
      - '.github/workflows/swift-sdk-freeze-pr-refresh.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report freeze PRs that are behind their base
        type: boolean
        default: true

permissions:
  contents: read

# Each run re-reads the base, so a superseded pending run loses nothing. Not the
# freeze worker's group: a queued refresh would cancel a pending freeze dispatch.
concurrency:
  group: swift-sdk-freeze-pr-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'dashpay/platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Merge the base into open freeze PRs
        env:
          # Pushes made with GITHUB_TOKEN would not trigger the PRs' CI.
          GH_TOKEN: ${{ secrets.SCHEMA_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::SCHEMA_RELEASE_TOKEN is not available"
            exit 1
          fi
          # A fork can reuse the branch name; only the worker's branches count.
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=$BASE&per_page=100" --jq '.[]
            | select(.head.repo.full_name == env.REPO
                and (.head.ref | startswith("codex/freeze-swift-schema-v")))
            | .number')
          [[ -n "$prs" ]] || echo "No open freeze PRs target $BASE"
          failed=0
          for pr in $prs; do
            # At most three merges; every pass re-reads the head, so the last one
            # only confirms. update-branch is asynchronous, and a concurrent push
            # (e.g. by the freeze worker) fails expected_head_sha.
            for attempt in 1 2 3 4; do
              sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
              behind=$(gh api "repos/$REPO/compare/$BASE...$sha" --jq .behind_by)
              if [[ "$behind" == 0 ]]; then
                echo "#$pr contains $BASE"
                continue 2
              fi
              if [[ "$DRY_RUN" == true ]]; then
                echo "#$pr is $behind commit(s) behind $BASE (dry run)"
                continue 2
              fi
              [[ "$attempt" -lt 4 ]] || break
              echo "#$pr is $behind commit(s) behind $BASE; merging (attempt $attempt)"
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" \
                -f expected_head_sha="$sha" > /dev/null || true
              sleep 10
            done
            echo "::error::https://github.com/$REPO/pull/$pr is still behind $BASE (merge conflict or token permissions). Merge $BASE into its branch so its CI runs again."
            failed=1
          done
          exit "$failed"
