name: Cache action regression tests

on:
  pull_request:
    paths:
      - '.github/actions/s3-layer-cache-settings/**'
      - '.github/actions/docker/**'
      - '.github/scripts/tests/test_s3_layer_cache.py'
      - '.github/workflows/cache-action-tests.yml'

permissions:
  contents: read

jobs:
  cache-action-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test optional cache export and fatal publication boundaries
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_s3_layer_cache.py' -v
