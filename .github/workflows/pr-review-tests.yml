name: PR review policy tests
on:
  pull_request:
    paths:
      - 'scripts/pr_review/**'
      - '.github/pr-review-*.json'
      - '.github/pr-review-policies/**'
      - '.github/workflows/pr-review-*.yml'
      - '.claude/skills/review-prs/**'
      - 'CODEOWNERS'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/pr_review/tests -v
      - run: python3 -m scripts.pr_review.main validate
      - run: python3 -m scripts.pr_review.main codeowners --check
