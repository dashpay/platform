name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "v*-dev"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - "v*-dev"
      - "ci/*"
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check secret availability
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      has_ecr: ${{ steps.check.outputs.has_ecr }}
    steps:
      - name: Check if ECR credentials are available
        id: check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" && -n "${{ secrets.AWS_ACCOUNT_ID }}" ]]; then
            echo "has_ecr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ecr=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ECR credentials not available — Docker image builds and dependent tests will be skipped (expected for fork PRs)"
          fi

  changes:
    name: Determine changed packages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      js-packages: ${{ steps.override.outputs.js-packages || steps.filter-js.outputs.changes }}
      js-packages-direct: ${{ steps.override.outputs.js-packages-direct || steps.filter-js-direct.outputs.changes }}
      rs-packages: ${{ steps.override.outputs.rs-packages || steps.filter-rs.outputs.changes }}
      rs-packages-direct: ${{ steps.override.outputs.rs-packages-direct || steps.filter-rs-direct.outputs.changes }}
      rs-workflows-changed: ${{ steps.filter-rs-workflows.outputs.rs-workflows }}
      zk-changed: ${{ steps.override.outputs.zk-changed || steps.filter-zk.outputs.zk-changed }}
      doctests-changed: ${{ steps.override.outputs.doctests-changed || steps.filter-doctests.outputs.doctests-changed }}
      test-suite: ${{ steps.override.outputs.run || steps.filter-test-suite.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter-js
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/package-filters/js-packages-no-workflows.yml

      - uses: dorny/paths-filter@v3
        id: filter-js-direct
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/package-filters/js-packages-direct.yml

      - uses: dorny/paths-filter@v3
        id: filter-rs
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/package-filters/rs-packages-no-workflows.yml

      - uses: dorny/paths-filter@v3
        id: filter-rs-direct
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/package-filters/rs-packages-direct.yml

      - uses: dorny/paths-filter@v3
        id: filter-rs-workflows
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            rs-workflows:
              - .github/workflows/tests-rs-workspace.yml
              - .github/workflows/tests-rs-doctests.yml
              - .github/workflows/tests-rs-package.yml
              - .github/workflows/tests.yml

      - name: Check if Test Suite should run
        id: filter-test-suite
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: .github/package-filters/test-suite-triggers.yml

      - name: Check for ZK / shielded code changes
        id: filter-zk
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null || git diff --name-only HEAD~1)

          # Check for direct shielded/ZK code changes
          if echo "$CHANGED" | grep -qE \
            'packages/rs-dpp/src/shielded/|packages/rs-dpp/src/address_funds/orchard|packages/rs-dpp/src/state_transition/state_transitions/shielded/|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/shield|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/shielded_|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/unshield|packages/rs-drive/src/state_transition_action/shielded/|packages/rs-drive/src/verify/shielded/|packages/rs-drive-abci/tests/strategy_tests/test_cases/shielded_tests'; then
            echo "zk-changed=true" >> "$GITHUB_OUTPUT"
            echo "ZK-related files changed — ZK tests will run"
            exit 0
          fi

          # Check for grovedb version changes (commitment-tree underpins shielded code)
          GROVEDB_FILES=$(echo "$CHANGED" | grep -E 'Cargo\.(toml|lock)$' || true)
          if [ -n "$GROVEDB_FILES" ]; then
            if git diff "$BASE_SHA"...HEAD -- $GROVEDB_FILES 2>/dev/null | grep -qE 'grovedb.*rev\s*=|name = "grovedb'; then
              echo "zk-changed=true" >> "$GITHUB_OUTPUT"
              echo "GroveDB version changed — ZK tests will run"
              exit 0
            fi
          fi

          echo "zk-changed=false" >> "$GITHUB_OUTPUT"
          echo "No ZK-related changes — skipping ZK tests"

      - name: Check for doctest changes
        id: filter-doctests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          DIFF=$(git diff "$BASE_SHA"...HEAD -- '*.rs' 2>/dev/null || git diff HEAD~1 -- '*.rs')

          # Look for added/removed lines in doc comments that contain code fences
          if echo "$DIFF" | grep -qE '^[+-].*///.*```|^[+-].*//!.*```'; then
            echo "doctests-changed=true" >> "$GITHUB_OUTPUT"
            echo "Doc comments with code examples changed — doctests will run"
            exit 0
          fi

          echo "doctests-changed=false" >> "$GITHUB_OUTPUT"
          echo "No doctest changes — skipping doctests"

      - name: Override all outputs for workflow_dispatch
        id: override
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eo pipefail
          # Extract top-level keys from filter YAML files to build JSON arrays
          to_json() { yq -o=json '[keys | .[] ]' "$1" | tr -d '\n'; }
          echo "js-packages=$(to_json .github/package-filters/js-packages-no-workflows.yml)" >> "$GITHUB_OUTPUT"
          echo "js-packages-direct=$(to_json .github/package-filters/js-packages-direct.yml)" >> "$GITHUB_OUTPUT"
          echo "rs-packages=$(to_json .github/package-filters/rs-packages-no-workflows.yml)" >> "$GITHUB_OUTPUT"
          echo "rs-packages-direct=$(to_json .github/package-filters/rs-packages-direct.yml)" >> "$GITHUB_OUTPUT"
          echo 'zk-changed=true' >> "$GITHUB_OUTPUT"
          echo 'doctests-changed=true' >> "$GITHUB_OUTPUT"
          echo 'run=true' >> "$GITHUB_OUTPUT"

  build-js:
    name: Build JS packages
    needs:
      - changes
    if: ${{ needs.changes.outputs.js-packages != '[]' || needs.changes.outputs.test-suite == 'true' }}
    secrets: inherit
    uses: ./.github/workflows/tests-build-js.yml

  build-images-gate:
    name: Docker Build Approval
    needs:
      - changes
      - check-secrets
    # Require manual approval only when test-suite-related code hasn't changed and not a scheduled/manual run
    if: ${{ needs.check-secrets.outputs.has_ecr == 'true' && needs.changes.outputs.test-suite != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    environment: test-suite-approval
    steps:
      - run: echo "Docker image build manually approved"

  build-images:
    name: Build Docker images
    needs:
      - check-secrets
      - changes
      - build-images-gate
    # Run when: code changed (gate skipped) OR manual approval granted OR scheduled/manual run
    if: >-
      always() &&
      needs.check-secrets.outputs.has_ecr == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.test-suite == 'true' || needs.build-images-gate.result == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Drive
            image_name: drive
            target: drive-abci
            build_args: |
              SDK_TEST_DATA=true
          - name: RS-DAPI
            image_name: rs-dapi
            target: rs-dapi
          - name: Dashmate helper
            image_name: dashmate-helper
            target: dashmate-helper
    uses: ./.github/workflows/tests-build-image.yml
    with:
      name: ${{ matrix.name }}
      image_name: ${{ matrix.image_name }}
      target: ${{ matrix.target }}
      build_args: ${{ matrix.build_args }}

  rs-workspace-tests:
    name: Rust workspace tests
    needs:
      - changes
    if: ${{ needs.changes.outputs.rs-packages != '[]' || needs.changes.outputs.rs-workflows-changed == 'true' }}
    secrets: inherit
    uses: ./.github/workflows/tests-rs-workspace.yml
    with:
      zk-changed: ${{ needs.changes.outputs.zk-changed == 'true' }}

  rs-doctests:
    name: Rust doctests
    needs:
      - changes
    if: ${{ needs.changes.outputs.doctests-changed == 'true' || needs.changes.outputs.rs-workflows-changed == 'true' }}
    secrets: inherit
    uses: ./.github/workflows/tests-rs-doctests.yml

  rs-packages:
    name: Rust packages
    needs:
      - changes
    if: ${{ needs.changes.outputs.rs-packages != '[]' }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        rs-package: ${{ fromJson(needs.changes.outputs.rs-packages) }}
    uses: ./.github/workflows/tests-rs-package.yml
    with:
      package: ${{ matrix.rs-package }}
      check-each-feature: ${{ contains(fromJSON('["dash-sdk","rs-dapi-client","rs-dapi","dapi-grpc","dpp","drive-abci"]'), matrix.rs-package) }}
      direct-packages: ${{ needs.changes.outputs.rs-packages-direct }}

  js-packages:
    name: JS packages
    needs:
      - changes
      - build-js
    if: ${{ needs.changes.outputs.js-packages != '[]' }}
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        js-package: ${{ fromJson(needs.changes.outputs.js-packages) }}
    uses: ./.github/workflows/tests-js-package.yml
    with:
      package: ${{ matrix.js-package }}
      test-command: ${{ matrix.js-package == 'dashmate' && 'test:unit' || 'test' }}
      skip-tests: ${{ contains(matrix.js-package, 'platform-test-suite') }}
      direct-packages: ${{ needs.changes.outputs.js-packages-direct }}

  js-deps-versions:
    name: JS dependency versions check
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Validate workspaces
        run: yarn constraints

  dashmate-e2e-tests:
    name: Dashmate E2E tests
    secrets: inherit
    needs:
      - changes
      - build-js
      - build-images
      - check-secrets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Local network
            test-pattern: test/e2e/localNetwork.spec.js
            restore_local_network_data: true
          - name: Testnet fullnode
            test-pattern: test/e2e/testnetFullnode.spec.js
            restore_local_network_data: false
          - name: Testnet Evonode
            test-pattern: test/e2e/testnetEvonode.spec.js
            restore_local_network_data: false
    uses: ./.github/workflows/tests-dashmate.yml
    with:
      name: ${{ matrix.name }}
      test-pattern: ${{ matrix.test-pattern }}
      restore_local_network_data: ${{ matrix.restore_local_network_data }}
    if: ${{ needs.check-secrets.outputs.has_ecr == 'true' && contains(needs.changes.outputs.js-packages, 'dashmate') }}

  test-suite-gate:
    name: Test Suite Approval
    needs:
      - changes
      - check-secrets
    # Require manual approval only on PRs when test-suite code hasn't changed
    if: ${{ needs.check-secrets.outputs.has_ecr == 'true' && needs.changes.outputs.test-suite != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    environment: test-suite-approval
    steps:
      - run: echo "Test suite manually approved"

  test-suite:
    name: Test Suite
    needs:
      - build-js
      - build-images
      - changes
      - check-secrets
      - test-suite-gate
    secrets: inherit
    # Run when: code changed (gate skipped) OR manual approval granted OR scheduled/manual run
    # always() is needed so this job evaluates even when test-suite-gate is skipped
    if: >-
      always() &&
      needs.check-secrets.outputs.has_ecr == 'true' &&
      needs.build-js.result == 'success' &&
      needs.build-images.result == 'success' &&
      (needs.changes.outputs.test-suite == 'true' || needs.test-suite-gate.result == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test Suite
            command: test:suite
            batch_index: 0
            batch_total: 0
          - name: Test Suite in browser (1)
            command: test:browsers
            batch_index: 0
            batch_total: 2
          - name: Test Suite in browser (2)
            command: test:browsers
            batch_index: 1
            batch_total: 2
    uses: ./.github/workflows/tests-test-suite.yml
    with:
      name: ${{ matrix.name }}
      command: ${{ matrix.command }}
      batch_total: ${{ matrix.batch_total }}
      batch_index: ${{ matrix.batch_index }}

  test-functional:
    name: Packages functional tests
    needs:
      - build-js
      - build-images
      - changes
      - check-secrets
      - test-suite-gate
    secrets: inherit
    if: >-
      always() &&
      needs.check-secrets.outputs.has_ecr == 'true' &&
      needs.build-js.result == 'success' &&
      needs.build-images.result == 'success' &&
      (needs.changes.outputs.test-suite == 'true' || needs.test-suite-gate.result == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/tests-packges-functional.yml
