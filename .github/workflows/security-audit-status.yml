name: "Security Status"

on:
  workflow_run:
    workflows:
      - "Security: Rust Crates"
      - "Security: DashVM Engine"
      - "Security: JS NPM"
      - "Security: JS CodeQL"
    types:
      - completed

# workflow_run jobs get the repository token; reading run conclusions is all
# this job does, so that is all it may do.
permissions:
  actions: read

jobs:
  check-status:
    name: Aggregate security audit results
    # The engine audit also runs on pull requests, including from forks. The
    # status page aggregates the scheduled and dispatched audits only, and a
    # pull request branch has no runs of the other workflows to aggregate.
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check all security audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never expand event data inside the script: a branch name is
          # attacker-controlled data, passed to gh as a URL-encoded parameter.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          failed=""
          for workflow in "security-audit-rust.yml" "security-audit-engine.yml" "security-audit-js-npm.yml" "security-audit-js-codeql.yml"; do
            conclusion=$(gh api -X GET "repos/${REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f per_page=1 -f branch="${HEAD_BRANCH}" \
              --jq '.workflow_runs[0].conclusion // "none"')
            echo "${workflow}: ${conclusion}"
            if [ "$conclusion" != "success" ]; then
              failed="${failed} ${workflow}"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::Security audit failures:${failed}"
            exit 1
          fi
          echo "All security audits passing"
