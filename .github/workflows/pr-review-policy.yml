name: PR Hygiene policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
jobs:
  policy:
    uses: dashpay/stale_prs_are_bad/.github/workflows/pr-review-reusable.yml@750eec13bc5e5f9c704f1a610aed51d376513fa2
