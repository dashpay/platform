name: Platform PR policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [PR review signal]
    types: [completed]
  push:
    paths: ['.github/pr-review-policy.json', 'scripts/pr_review/**']
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: platform-pr-review-policy
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'dashpay/platform' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile trusted default-branch policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_AUTOMATION_ENABLED: ${{ vars.PR_REVIEW_AUTOMATION_ENABLED }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind = os.environ['GITHUB_EVENT_NAME']
          numbers = []
          if kind == 'pull_request_target':
              numbers = [event['pull_request']['number']]
          elif kind == 'issue_comment':
              numbers = [event['issue']['number']]
          elif kind == 'workflow_run':
              numbers = [pr['number'] for pr in event['workflow_run']['pull_requests']]
              if not numbers:
                  print('No PR associated with review signal; scheduled reconciliation will repair.')
                  raise SystemExit(0)
          selectors = numbers or [None]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for number in selectors:
                  args = ['python3', '-m', 'scripts.pr_review.main', 'sync']
                  if os.environ.get('PR_REVIEW_AUTOMATION_ENABLED') == 'true':
                      args.append('--apply')
                  if number is None:
                      args.extend(['--batch-size', '3'])
                  if number is not None:
                      if type(number) is not int or number <= 0:
                          raise ValueError('Invalid event PR number')
                      args.extend(['--pr', str(number)])
                  subprocess.run(args, check=True, stdout=summary)
          PYTHON
