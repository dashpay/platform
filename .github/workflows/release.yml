name: Release Platform

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Version (i.e. v0.22.3-pre.2); prefix with npm-test: to run only the NPM release dry-run"
        required: true
      only_drive:
        type: boolean
        description: Only build Drive image
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for NPM publish
permissions:
  id-token: write
  contents: read

jobs:
  build-npm:
    name: Build NPM packages
    # Reuse the persistent Linux runner's Cargo registry and a release-only
    # target cache. The publish job stays on a GitHub-hosted runner because npm
    # trusted publishing does not support self-hosted runners.
    runs-on: [self-hosted, kotlin-ci]
    timeout-minutes: 120
    if: github.event_name == 'release' || startsWith(inputs.tag, 'npm-test:')
    # In particular, do not mint an OIDC token for the persistent build host.
    permissions:
      contents: read
    steps:
      - uses: softwareforgood/check-artifact-v4-existence@v0
        id: check-artifact
        with:
          name: js-build-${{ github.sha }}

      # PR jobs run in this same workspace on this persistent runner. Git
      # state they leave behind (.git/hooks, .git/config, .git/info/attributes)
      # would run inside actions/checkout's own `git checkout`, before any
      # later cleanup could remove it. Start from an empty directory and a
      # fresh clone; the release build cache lives outside the workspace.
      - name: Empty the workspace left by earlier jobs
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + \
            || sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Ensure runner dependencies
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        run: |
          set -euo pipefail

          MISSING=()
          for pkg in build-essential cmake curl jq libgmp-dev libssl-dev pkg-config python3 unzip zip; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING+=("$pkg")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Installing: ${MISSING[*]}"
            sudo apt-get update -qq
            sudo apt-get install -qq --yes "${MISSING[@]}"
          fi

          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          docker info >/dev/null
          # Always pull: a local image under this tag may have been replaced
          # by an earlier job, and a pull resets the tag to the registry's.
          docker pull rvolosatovs/protoc:4.0.0

      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          target: wasm32-unknown-unknown
          # The runner persists the Cargo registry between runs.
          cache: 'false'
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      # The Rust action above reuses a protoc left in ~/.local by earlier jobs.
      # Override it with a fresh, checksum-verified copy for the release build;
      # prost-build reads PROTOC first.
      - name: Install protoc v32.0
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        env:
          PROTOC_SHA256: 7ca037bfe5e5cabd4255ccd21dd265f79eb82d3c010117994f5dc81d2140ee88
        run: |
          set -euo pipefail
          PROTOC_DIR="$RUNNER_TEMP/protoc-32.0"
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip
          echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          rm -rf "$PROTOC_DIR"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$PROTOC_DIR"
          echo "PROTOC=$PROTOC_DIR/bin/protoc" >> "$GITHUB_ENV"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version

      - name: Prepare release Cargo target cache
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        uses: ./.github/actions/release-cargo-target-cache
        with:
          name: release-npm-target

      - name: Setup Node.JS
        uses: ./.github/actions/nodejs
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install Cargo binstall
        uses: cargo-bins/cargo-binstall@v1.3.1
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      # Always reinstalled, never trusted from an earlier job: a binary left on
      # this persistent runner can print the pinned version and still be
      # something else.
      - name: Install wasm-bindgen-cli
        run: |
          set -euo pipefail
          cargo binstall wasm-bindgen-cli@0.2.108 --no-confirm --force
          wasm-bindgen --version | grep -Fxq 'wasm-bindgen 0.2.108'
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install wasm-pack
        run: |
          set -euo pipefail
          cargo binstall wasm-pack@0.15.0 --no-confirm --force
          wasm-pack --version | grep -Fxq 'wasm-pack 0.15.0'
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      # Fresh, checksum-verified copy in this job's temp directory rather than
      # one left in ~/.local by an earlier job.
      - name: Install Binaryen
        env:
          BINARYEN_SHA256: c90e0e295e8f8484ba5b47da92f26e5d1d18db6cd2fcc0c5cc265a5a73609f17
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/binaryen-version_121-x86_64-linux.tar.gz"
          curl -fsSL -o "$ARCHIVE" \
            https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz
          echo "$BINARYEN_SHA256  $ARCHIVE" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/binaryen-version_121"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_121/bin" >> "$GITHUB_PATH"
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Build packages
        run: yarn build
        env:
          CARGO_BUILD_PROFILE: release
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Ignore only already cached artifacts
        run: |
          find . -name '.gitignore' -exec rm -f {} +
          {
            echo ".yarn"
            echo "target"
            echo "node_modules"
            echo ".nyc_output"
            echo ".idea"
            echo ".ultra.cache.json"
            echo "db/*"
            echo "npm-packages"
          } >> .gitignore
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      # Pack on the unprivileged builder. The hosted publisher receives only
      # these tarballs and publishes them without running package lifecycle
      # scripts, so persistent-runner output cannot execute with OIDC access.
      - name: Pack NPM packages on the unprivileged builder
        run: |
          set -euo pipefail
          mkdir -p npm-packages
          yarn workspaces foreach --all --no-private --parallel pack \
            --out "$GITHUB_WORKSPACE/npm-packages/%s-%v.tgz"
          test -n "$(find npm-packages -maxdepth 1 -type f -name '*.tgz' -print -quit)"
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Get modified files
        id: diff
        run: |
          {
            echo "files<<EOF"
            git ls-files --others --exclude-standard
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Upload the archive of built files
        uses: actions/upload-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: |
            ${{ steps.diff.outputs.files }}
            npm-packages/*.tgz
          # Keep the handoff alive long enough to re-run only a failed publish.
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

  release-npm:
    name: Publish NPM packages
    needs: build-npm
    # npm trusted publishing currently accepts GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'release' || startsWith(inputs.tag, 'npm-test:')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check package version matches tag
        uses: geritol/match-tag-to-package-version@0.2.0
        if: github.event_name == 'release'
        env:
          TAG_PREFIX: v

      - name: Check package version matches requested test tag
        id: test-tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG#npm-test:}"
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          if [ "$TAG" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Requested tag $TAG does not match package version v${PACKAGE_VERSION}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Only npm itself is needed here. Do not install dependencies or restore
      # executable caches shared with the persistent builder in this OIDC job.
      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          registry-url: https://registry.npmjs.org

      - name: Download built package artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: release-artifacts

      # Verify every tarball against the trusted checkout metadata before the
      # credentialed publish. Tarball contents are treated as data; no package
      # script from the persistent builder is executed on this runner.
      - name: Validate packed package identities
        env:
          ARTIFACT_DIR: release-artifacts/npm-packages
        run: |
          set -euo pipefail
          NPM_CLI_PATH="$(command -v npm)" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          // Match npm publish's own manifest parser, including archive path aliases.
          const npmBin = path.dirname(fs.realpathSync(process.env.NPM_CLI_PATH));
          const pacote = require(path.join(npmBin, '../node_modules/pacote'));
          (async () => {
            const trusted = new Map();
            for (const workspace of JSON.parse(fs.readFileSync('package.json')).workspaces) {
              const manifest = JSON.parse(fs.readFileSync(path.join(workspace, 'package.json')));
              if (!manifest.private) trusted.set(manifest.name, manifest.version);
            }
            const tarballs = fs.readdirSync(process.env.ARTIFACT_DIR).filter(file => file.endsWith('.tgz'));
            if (!tarballs.length) throw new Error('No NPM tarballs were uploaded.');
            const seen = new Set();
            for (const file of tarballs) {
              const tarball = path.resolve(process.env.ARTIFACT_DIR, file);
              if (!fs.lstatSync(tarball).isFile()) throw new Error(`Not a regular tarball: ${file}`);
              const manifest = await pacote.manifest(tarball, {
                fullmetadata: true,
                fullReadJson: true,
                ignoreScripts: true,
                cache: path.join(process.env.RUNNER_TEMP, 'npm-metadata-cache'),
              });
              if (!trusted.has(manifest.name) || trusted.get(manifest.name) !== manifest.version) {
                throw new Error(`Untrusted package identity in ${file}`);
              }
              if (seen.has(manifest.name)) throw new Error(`Duplicate tarball for ${manifest.name}`);
              seen.add(manifest.name);
              // No workspace requires publishConfig. It can override npm's proxy,
              // TLS and registry options even with --ignore-scripts, exposing OIDC.
              if (manifest.publishConfig !== undefined && JSON.stringify(manifest.publishConfig) !== '{}') {
                throw new Error(`Builder-supplied publishConfig is not allowed in ${file}`);
              }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Set suffix
        uses: actions/github-script@v8
        id: suffix
        with:
          result-encoding: string
          script: |
            const fullTag = "${{ steps.test-tag.outputs.tag }}" || context.payload.release.tag_name;
            if (fullTag.includes('-')) {
              const [, fullSuffix] = fullTag.split('-');
              const [suffix] = fullSuffix.split('.');
              return suffix;
            } else {
              return '';
            }

      - name: Set NPM release tag
        uses: actions/github-script@v8
        id: tag
        with:
          result-encoding: string
          script: |
            const tag = "${{ steps.test-tag.outputs.tag }}" || context.payload.release.tag_name;
            const [, major, minor] = tag.match(/^v([0-9]+)\.([0-9]+)/);
            return (tag.includes('-') ? `${major}.${minor}-${{steps.suffix.outputs.result}}` : 'latest');

      - name: Show NPM release tag
        run: |
          echo "NPM suffix: ${{ steps.suffix.outputs.result }}"
          echo "NPM release tag: ${{ steps.tag.outputs.result }}"

      - name: Publish NPM packages
        if: github.event_name == 'release'
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
        run: |
          set -euo pipefail
          REGISTRY="$(npm config get registry)"
          REGISTRY="${REGISTRY%/}"
          for tarball in release-artifacts/npm-packages/*.tgz; do
            metadata=$(tar -xOf "$tarball" package/package.json)
            name=$(jq -r '.name' <<<"$metadata")
            version=$(jq -r '.version' <<<"$metadata")
            # npm addresses scoped packages as @scope%2fname: keep the leading @,
            # percent-encode only the scope separator.
            encoded_name=${name//\//%2f}
            status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/npm-metadata.json" \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
              "$REGISTRY/$encoded_name") || {
              echo "::error::Could not query $REGISTRY for $name@$version."
              exit 1
            }
            case "$status" in
              404)
                ;;
              200)
                jq -e --arg version "$version" '.versions[$version] != null' "$RUNNER_TEMP/npm-metadata.json" >/dev/null || {
                  jq -e . "$RUNNER_TEMP/npm-metadata.json" >/dev/null || { echo "::error::Invalid registry response for $name."; exit 1; }
                  npm publish "$tarball" --ignore-scripts --access public --tag "$NPM_TAG"
                  continue
                }
                echo "::notice::$name@$version already exists on $REGISTRY; skipping."
                continue
                ;;
              *)
                echo "::error::Registry query for $name@$version returned HTTP $status; refusing to publish blindly."
                exit 1
                ;;
            esac
            npm publish "$tarball" --ignore-scripts --access public --tag "$NPM_TAG"
          done

      - name: Dry-run NPM packages
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
        run: |
          set -euo pipefail
          for tarball in release-artifacts/npm-packages/*.tgz; do
            npm publish "$tarball" --ignore-scripts --dry-run --access public --tag "$NPM_TAG"
          done

  release-drive-image:
    name: Release Drive image
    if: ${{ !startsWith(inputs.tag, 'npm-test:') }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Drive
      image_org: dashpay
      image_name: drive
      target: drive-abci
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-drive-image-debug:
    name: Release Drive debug image
    if: ${{ !startsWith(inputs.tag, 'npm-test:') }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Drive
      image_org: dashpay
      image_name: drive
      target: drive-abci
      cargo_profile: dev
      tag: ${{ inputs.tag || github.event.release.tag_name }}-debug
      additional_features: console,grovedbg,replay

  release-rs-dapi-image:
    name: Release RS-DAPI image
    if: ${{ !inputs.only_drive && !startsWith(inputs.tag, 'npm-test:') }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: RS-DAPI
      image_org: dashpay
      image_name: rs-dapi
      target: rs-dapi
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-test-suite-image:
    name: Release Test Suite image
    if: ${{ !inputs.only_drive && !startsWith(inputs.tag, 'npm-test:') }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Test Suite
      image_org: dashpay
      image_name: platform-test-suite
      target: test-suite
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-dashmate-helper-image:
    name: Release Dashmate Helper image
    secrets: inherit
    if: ${{ !inputs.only_drive && !startsWith(inputs.tag, 'npm-test:') }}
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Dashmate Helper
      image_org: dashpay
      image_name: dashmate-helper
      target: dashmate-helper
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  # The SDK jobs run only on a published release, not on this workflow's
  # dispatch path: a dispatch runs at a BRANCH ref, which the maven-central
  # environment's v* tag policy rejects, and a dispatched tag may have no
  # published release to attach assets to. To re-run an SDK release, dispatch
  # release-kotlin-sdk.yml / release-swift-sdk.yml directly AT THE TAG REF.
  release-kotlin-sdk:
    name: Release Kotlin SDK
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write # attach the AAR to the release (workflow default is read)
    uses: ./.github/workflows/release-kotlin-sdk.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  release-swift-sdk:
    name: Release Swift SDK FFI
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write # attach the xcframework to the release (workflow default is read)
    uses: ./.github/workflows/release-swift-sdk.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  build-dashmate-packages:
    name: Build Dashmate packages
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.only_drive && !startsWith(inputs.tag, 'npm-test:') }}
    needs: release-npm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: tarballs
            os: ubuntu-24.04
          - package_type: win
            os: ubuntu-24.04
          - package_type: deb
            os: ubuntu-24.04
          - package_type: macos
            os: macos-14
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download JS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          # The mixed JS/NPM artifact is rooted at the repository, since its
          # paths contain both packages/ and npm-packages/.
          path: .

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install llvm coreutils

      - name: Set up Docker for macOS
        if: runner.os == 'macOS'
        uses: docker-practice/actions-setup-docker@master

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nsis

      - name: Setup Node.JS
        uses: ./.github/actions/nodejs

      - name: Create package
        env:
          # Packaging executes dependency and lifecycle scripts, including
          # output from the persistent builder. Signing happens in a new job.
          DASHMATE_UNSIGNED: 'true'
        run: |
          "${GITHUB_WORKSPACE}/scripts/pack_dashmate.sh" "${{ matrix.package_type }}"

      - name: Upload Dashmate packages
        uses: actions/upload-artifact@v4
        with:
          name: dashmate-${{ matrix.package_type }}-${{ github.sha }}
          path: packages/dashmate/dist/**
          if-no-files-found: error
          retention-days: 7

  release-dashmate-packages:
    name: Release Dashmate packages
    needs: build-dashmate-packages
    # `needs` on a matrix job waits for every leg and reports failure if any
    # one leg failed, which by default would skip all four release legs. Each
    # leg below needs only its own package type's artifact, so run whenever
    # the build matrix ran at all: a leg whose build failed then fails at its
    # own download step, and the other package types still ship.
    if: >-
      !cancelled()
      && github.event_name == 'release'
      && needs.build-dashmate-packages.result != 'skipped'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: tarballs
            os: ubuntu-24.04
          - package_type: win
            os: ubuntu-24.04
          - package_type: deb
            os: ubuntu-24.04
          - package_type: macos
            os: macos-14
    steps:
      # Treat finished installers as data. This job never installs or runs
      # package code and never restores caches from the build jobs.
      - name: Download Dashmate packages
        uses: actions/download-artifact@v4
        with:
          name: dashmate-${{ matrix.package_type }}-${{ github.sha }}
          path: release-artifacts

      - name: Install the Apple certificate
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS installers
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' pkg; do
            found=true
            productsign --sign 'Developer ID Installer: The Dash Foundation, Inc.' \
              --keychain "$RUNNER_TEMP/app-signing.keychain-db" \
              "$pkg" "$RUNNER_TEMP/signed.pkg"
            mv "$RUNNER_TEMP/signed.pkg" "$pkg"
          done < <(find release-artifacts -type f -name '*.pkg' -print0)
          "$found" || { echo '::error::No macOS installers were uploaded.'; exit 1; }

      - name: Notarize MacOS Release Build
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARIZING_PASSWORD: ${{ secrets.MACOS_NOTARIZING_PASSWORD }}
        run: |
          while IFS= read -r -d '' pkg; do
            xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARIZING_PASSWORD" --wait
          done < <(find release-artifacts -type f -name '*.pkg' -print0)

      - name: Delete the Apple keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
          rm -f "$RUNNER_TEMP/build_certificate.p12"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v0.1.15
        if: github.event_name == 'release'
        with:
          files: release-artifacts/**
