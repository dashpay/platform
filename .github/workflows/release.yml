name: Release Platform

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Version (i.e. v0.22.3-pre.2)"
        required: true
      only_drive:
        type: boolean
        description: Only build Drive image
        default: false
      only_npm:
        type: boolean
        description: Build NPM packages and exercise the hosted publish handoff without publishing
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for NPM publish
permissions:
  id-token: write
  contents: read

jobs:
  build-npm:
    name: Build NPM packages
    # Reuse the persistent Linux runner's Cargo target and registry state. The
    # publish job stays on a GitHub-hosted runner because npm trusted publishing
    # does not support self-hosted runners.
    runs-on: [self-hosted, kotlin-ci]
    timeout-minutes: 120
    if: github.event_name == 'release' || inputs.only_npm
    # In particular, do not mint an OIDC token for the persistent build host.
    permissions:
      contents: read
    steps:
      - uses: softwareforgood/check-artifact-v4-existence@v0
        id: check-artifact
        with:
          name: js-build-${{ github.sha }}

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Preserve the expensive Cargo target cache between release builds.
          clean: false
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Ensure runner dependencies
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        run: |
          set -euo pipefail

          MISSING=()
          for pkg in build-essential cmake curl jq libgmp-dev libssl-dev pkg-config python3 unzip zip; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING+=("$pkg")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Installing: ${MISSING[*]}"
            sudo apt-get update -qq
            sudo apt-get install -qq --yes "${MISSING[@]}"
          fi

          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          docker info >/dev/null
          if ! docker image inspect rvolosatovs/protoc:4.0.0 >/dev/null 2>&1; then
            docker pull rvolosatovs/protoc:4.0.0
          fi

      - name: Clean stale build outputs
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}
        run: |
          git reset --hard
          git clean -ffdx -e target/

      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          target: wasm32-unknown-unknown
          # The runner persists the Cargo registry and target directory.
          cache: 'false'
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Setup Node.JS
        uses: ./.github/actions/nodejs
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install Cargo binstall
        uses: cargo-bins/cargo-binstall@v1.3.1
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install wasm-bindgen-cli
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fxq 'wasm-bindgen 0.2.108'; then
            cargo binstall wasm-bindgen-cli@0.2.108 --no-confirm --force
          fi
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install wasm-pack
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -Fxq 'wasm-pack 0.15.0'; then
            cargo binstall wasm-pack@0.15.0 --no-confirm --force
          fi
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Install Binaryen
        run: |
          BINARYEN_DIR="$HOME/.local/binaryen-version_121"
          if [ ! -x "$BINARYEN_DIR/bin/wasm-opt" ]; then
            ARCHIVE="$RUNNER_TEMP/binaryen-version_121-x86_64-linux.tar.gz"
            curl -fsSL -o "$ARCHIVE" \
              https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz
            mkdir -p "$HOME/.local"
            tar -xzf "$ARCHIVE" -C "$HOME/.local"
          fi
          echo "$BINARYEN_DIR/bin" >> "$GITHUB_PATH"
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Build packages
        run: yarn build
        env:
          CARGO_BUILD_PROFILE: release
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Ignore only already cached artifacts
        run: |
          find . -name '.gitignore' -exec rm -f {} +
          {
            echo ".yarn"
            echo "target"
            echo "node_modules"
            echo ".nyc_output"
            echo ".idea"
            echo ".ultra.cache.json"
            echo "db/*"
          } >> .gitignore
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Get modified files
        id: diff
        run: |
          {
            echo "files<<EOF"
            git ls-files --others --exclude-standard
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

      - name: Upload the archive of built files
        uses: actions/upload-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: ${{ steps.diff.outputs.files }}
          # Keep the handoff alive long enough to re-run only a failed publish.
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
        if: ${{ steps.check-artifact.outputs.exists != 'true' }}

  release-npm:
    name: Publish NPM packages
    needs: build-npm
    # npm trusted publishing currently accepts GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'release' || inputs.only_npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check package version matches tag
        uses: geritol/match-tag-to-package-version@0.2.0
        if: github.event_name == 'release'
        env:
          TAG_PREFIX: v

      - name: Check package version matches requested test tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          if [ "$TAG" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Requested tag $TAG does not match package version v${PACKAGE_VERSION}"
            exit 1
          fi

      # Composite action defaults to Node 24+ which ships npm 11.5.1+;
      # required for trusted-publishers OIDC at the publish step below.
      # See https://docs.npmjs.com/trusted-publishers.
      - name: Setup Node.JS
        uses: ./.github/actions/nodejs

      - name: Download JS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: packages

      - name: Set suffix
        uses: actions/github-script@v8
        id: suffix
        with:
          result-encoding: string
          script: |
            const fullTag = "${{ inputs.tag }}" || context.payload.release.tag_name;
            if (fullTag.includes('-')) {
              const [, fullSuffix] = fullTag.split('-');
              const [suffix] = fullSuffix.split('.');
              return suffix;
            } else {
              return '';
            }

      - name: Set NPM release tag
        uses: actions/github-script@v8
        id: tag
        with:
          result-encoding: string
          script: |
            const tag = "${{ inputs.tag }}" || context.payload.release.tag_name;
            const [, major, minor] = tag.match(/^v([0-9]+)\.([0-9]+)/);
            return (tag.includes('-') ? `${major}.${minor}-${{steps.suffix.outputs.result}}` : 'latest');

      - name: Show NPM release tag
        run: |
          echo "NPM suffix: ${{ steps.suffix.outputs.result }}"
          echo "NPM release tag: ${{ steps.tag.outputs.result }}"

      - name: Publish NPM packages
        if: github.event_name == 'release'
        run: yarn workspaces foreach --all --no-private --parallel npm publish --tolerate-republish --access public --tag ${{ steps.tag.outputs.result }}

      - name: Dry-run NPM packages
        if: github.event_name == 'workflow_dispatch'
        run: yarn workspaces foreach --all --no-private --parallel npm publish --dry-run --tolerate-republish --access public --tag ${{ steps.tag.outputs.result }}

  release-drive-image:
    name: Release Drive image
    if: ${{ !inputs.only_npm }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Drive
      image_org: dashpay
      image_name: drive
      target: drive-abci
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-drive-image-debug:
    name: Release Drive debug image
    if: ${{ !inputs.only_npm }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Drive
      image_org: dashpay
      image_name: drive
      target: drive-abci
      cargo_profile: dev
      tag: ${{ inputs.tag || github.event.release.tag_name }}-debug
      additional_features: console,grovedbg,replay

  release-rs-dapi-image:
    name: Release RS-DAPI image
    if: ${{ !inputs.only_drive && !inputs.only_npm }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: RS-DAPI
      image_org: dashpay
      image_name: rs-dapi
      target: rs-dapi
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-test-suite-image:
    name: Release Test Suite image
    if: ${{ !inputs.only_drive && !inputs.only_npm }}
    secrets: inherit
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Test Suite
      image_org: dashpay
      image_name: platform-test-suite
      target: test-suite
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  release-dashmate-helper-image:
    name: Release Dashmate Helper image
    secrets: inherit
    if: ${{ !inputs.only_drive && !inputs.only_npm }}
    uses: ./.github/workflows/release-docker-image.yml
    with:
      name: Dashmate Helper
      image_org: dashpay
      image_name: dashmate-helper
      target: dashmate-helper
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  # The SDK jobs run only on a published release, not on this workflow's
  # dispatch path: a dispatch runs at a BRANCH ref, which the maven-central
  # environment's v* tag policy rejects, and a dispatched tag may have no
  # published release to attach assets to. To re-run an SDK release, dispatch
  # release-kotlin-sdk.yml / release-swift-sdk.yml directly AT THE TAG REF.
  release-kotlin-sdk:
    name: Release Kotlin SDK
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write # attach the AAR to the release (workflow default is read)
    uses: ./.github/workflows/release-kotlin-sdk.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  release-swift-sdk:
    name: Release Swift SDK FFI
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write # attach the xcframework to the release (workflow default is read)
    uses: ./.github/workflows/release-swift-sdk.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  release-dashmate-packages:
    name: Release Dashmate packages
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.only_drive && !inputs.only_npm }}
    needs: release-npm
    permissions:
      id-token: write # s3 cache
      contents: write # update release artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: tarballs
            os: ubuntu-24.04
          - package_type: win
            os: ubuntu-24.04
          - package_type: deb
            os: ubuntu-24.04
          - package_type: macos
            os: macos-14
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: packages

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install llvm coreutils

      - name: Set up Docker for macOS
        if: runner.os == 'macOS'
        uses: docker-practice/actions-setup-docker@master

      - name: Install the Apple certificate
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nsis

      - name: Setup Node.JS
        uses: ./.github/actions/nodejs

      - name: Create package
        env:
          OSX_KEYCHAIN: ${{ runner.temp }}/app-signing.keychain-db
        run: "${GITHUB_WORKSPACE}/scripts/pack_dashmate.sh ${{ matrix.package_type }}"

      - name: Upload artifacts to action summary
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: dashmate
          path: packages/dashmate/dist/**

      - name: Notarize MacOS Release Build
        if: runner.os == 'macOS'
        run: |
          find packages/dashmate/dist/ -name '*.pkg' -exec sh -c 'xcrun notarytool submit "{}" --apple-id "${{ secrets.MACOS_APPLE_ID }}" --team-id "${{ secrets.MACOS_TEAM_ID }}" --password "${{ secrets.MACOS_NOTARIZING_PASSWORD }}" --wait;' \;

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v0.1.15
        if: github.event_name == 'release'
        with:
          files: packages/dashmate/dist/**
