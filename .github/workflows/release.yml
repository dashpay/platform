# Operator-admitted exact-head proof. No release/tag/package publishing.
name: Historical release recovery (build only)
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original Platform release run whose application SHA must be preserved
        type: string
        required: true
      tag:
        description: Existing release tag; must match the source run and its SHA
        type: string
        required: true
      kind:
        description: Build only; no publishing jobs exist
        type: choice
        options:
        - kotlin
        - npm
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-build-${{ inputs.source_run_id }}-${{ inputs.kind }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'dashpay/platform' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/historical-release-recovery-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
    - name: Resolve immutable historical source
      id: resolve
      uses: actions/github-script@v8
      env:
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        RELEASE_TAG: ${{ inputs.tag }}
      with:
        script: |
          const id = process.env.SOURCE_RUN_ID;
          if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Expected a numeric historical run ID');
          const {owner, repo} = context.repo;
          const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: id});
          if (run.event !== 'release' || run.path !== '.github/workflows/release.yml'
              || run.repository.full_name !== 'dashpay/platform'
              || run.head_repository.full_name !== 'dashpay/platform') {
            throw new Error('Source must be a Platform release run');
          }
          const tag = process.env.RELEASE_TAG;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(tag)
              || run.head_branch !== tag) throw new Error('Release tag does not match historical run');
          const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
          if (release.draft) throw new Error('Draft releases are not eligible');
          let {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
          let object = ref.object;
          for (let i=0; object.type === 'tag' && i<5; ++i) {
            const {data: annotated} = await github.rest.git.getTag({owner, repo, tag_sha: object.sha});
            object = annotated.object;
          }
          if (object.type !== 'commit' || object.sha !== run.head_sha
              || !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Source tag moved or is invalid');
          core.setOutput('sha', run.head_sha);
          core.setOutput('version', tag.substring(1));
          core.info(`Recovering ${tag} source ${run.head_sha} from run ${id}; build only`);
  build:
    name: Recover ${{ inputs.kind }} from historical source
    needs: source
    runs-on:
      group: platform-release-builds
      labels:
      - self-hosted
      - Linux
      - X64
      - platform-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.kind }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
    - name: Verify exact disposable recovery worker
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        test "${DASH_RELEASE_RUNNER:-}" = 1
        test "${DASH_RELEASE_RUN_ID:-}" = "$GITHUB_RUN_ID"
        test "${DASH_RELEASE_RUN_ATTEMPT:-}" = "$GITHUB_RUN_ATTEMPT"
        test "${DASH_RELEASE_KIND:-}" = "$KIND"
    - name: Checkout historical application source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.source.outputs.sha }}
        persist-credentials: false
    - name: Checkout reviewed CI definitions
      uses: actions/checkout@v4
      with:
        ref: ad99cc12db3b92530336e4fdb7634488133b40dc
        path: .recovery-ci
        sparse-checkout: .github
        persist-credentials: false
    - name: Apply CI-only overlay and prove source identity
      shell: bash
      env:
        SOURCE_SHA: ${{ needs.source.outputs.sha }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        RELEASE_TAG: ${{ inputs.tag }}
        CI_SHA: ad99cc12db3b92530336e4fdb7634488133b40dc
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git -C .recovery-ci rev-parse HEAD)" = "$CI_SHA"
        rm -rf .github
        cp -a .recovery-ci/.github .github
        rm -rf .recovery-ci
        git diff --exit-code -- . ':!.github'
        test -z "$(git ls-files --others --exclude-standard -- . ':!.github')"
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        keys = ('SOURCE_SHA', 'SOURCE_RUN_ID', 'RELEASE_TAG', 'CI_SHA', 'GITHUB_RUN_ID')
        Path('recovery-provenance.json').write_text(json.dumps({k:os.environ[k] for k in keys}, indent=2)+'\n')
        PY
    - name: Build and pack exact-source NPM packages
      if: inputs.kind == 'npm'
      uses: ./.github/actions/npm-release-build
    - name: Upload exact-source NPM artifacts
      if: inputs.kind == 'npm'
      uses: actions/upload-artifact@v4
      with:
        name: recovered-npm-${{ needs.source.outputs.sha }}
        path: |-
          npm-packages/*.tgz
          recovery-provenance.json
        if-no-files-found: error
        retention-days: 7
    - name: Verify runner dependencies
      run: |
        set -euo pipefail

        for pkg in build-essential cmake curl gh jq libgmp-dev libpulse0 libssl-dev libx11-xcb1 pkg-config python3 unzip zip; do
          dpkg-query -W -f='${Status}' "$pkg" | grep -Fx 'install ok installed'
        done
        test -x "$HOME/.cargo/bin/rustup"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      if: inputs.kind == 'kotlin'
    - name: Verify release image contract
      run: ci-image-contract verify .github/runner-requirements.json
      if: inputs.kind == 'kotlin'
    - name: Verify JDK 17
      run: |
        JAVA_HOME_RESOLVED=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
        JAVA_VERSION_OUTPUT=$("$JAVA_HOME_RESOLVED/bin/java" -version 2>&1)
        printf '%s\n' "$JAVA_VERSION_OUTPUT"
        printf '%s\n' "$JAVA_VERSION_OUTPUT" | grep -Eq 'version "17([.]|\")'
        echo "JAVA_HOME=$JAVA_HOME_RESOLVED" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_RESOLVED/bin" >> "$GITHUB_PATH"
      if: inputs.kind == 'kotlin'
    - name: Verify prebaked Android SDK
      run: |
        test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
        test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
        test -x "$ANDROID_SDK_ROOT/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      if: inputs.kind == 'kotlin'
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,x86_64-linux-android
      if: inputs.kind == 'kotlin'
    - name: Prepare release Cargo target cache
      uses: ./.github/actions/release-cargo-target-cache
      with:
        name: release-kotlin-sdk-target
      if: inputs.kind == 'kotlin'
    - name: Install cargo-ndk v4.1.2
      run: |
        set -euo pipefail
        cargo install cargo-ndk --version 4.1.2 --locked --force
        cargo ndk --version | grep -qx 'cargo-ndk 4.1.2'
      if: inputs.kind == 'kotlin'
    - name: Install protoc v32.0
      env:
        PROTOC_SHA256: 7ca037bfe5e5cabd4255ccd21dd265f79eb82d3c010117994f5dc81d2140ee88
      run: |
        set -euo pipefail
        PROTOC_DIR="$RUNNER_TEMP/protoc-32.0"
        curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
          https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip
        echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
        rm -rf "$PROTOC_DIR"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$PROTOC_DIR"
        echo "PROTOC=$PROTOC_DIR/bin/protoc" >> "$GITHUB_ENV"
        echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
        "$PROTOC_DIR/bin/protoc" --version
      if: inputs.kind == 'kotlin'
    - name: Build native library (both ABIs, release profile)
      working-directory: packages/kotlin-sdk
      run: |
        export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:?}/ndk/28.1.13356709"
        ./build_android.sh --abi all --profile release --verify
      if: inputs.kind == 'kotlin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true
      if: inputs.kind == 'kotlin'
    - name: Build release AAR
      working-directory: packages/kotlin-sdk
      run: ./gradlew :sdk:assembleRelease --stacktrace
      if: inputs.kind == 'kotlin'
    - name: Prepare versioned assets (AAR + build provenance)
      env:
        VERSION: ${{ needs.source.outputs.version }}
        BUILT_SHA: ${{ needs.source.outputs.sha }}
      run: |
        cd packages/kotlin-sdk/sdk/build/outputs/aar
        cp sdk-release.aar "dash-sdk-android-${VERSION}.aar"
        printf '%s\n' "$BUILT_SHA" > "dash-sdk-android-${VERSION}.commit.txt"
      if: inputs.kind == 'kotlin'
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-sdk-release-assets
        path: |
          packages/kotlin-sdk/sdk/build/outputs/aar/dash-sdk-android-${{ needs.source.outputs.version }}.aar
          packages/kotlin-sdk/sdk/build/outputs/aar/dash-sdk-android-${{ needs.source.outputs.version }}.commit.txt
        if-no-files-found: error
        retention-days: 7
      if: inputs.kind == 'kotlin'
    - name: Upload native libraries for the deploy job
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-sdk-jnilibs
        path: packages/kotlin-sdk/sdk/src/main/jniLibs
        if-no-files-found: error
        retention-days: 7
      if: inputs.kind == 'kotlin'
    - name: Upload recovery provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recovery-provenance-${{ inputs.kind }}
        path: recovery-provenance.json
        if-no-files-found: error
        retention-days: 7
