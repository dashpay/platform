on:
  workflow_call:

jobs:
  test-functional:
    name: Run functional tests
    runs-on: ubuntu-24.04
    # Cold helper-image pulls can consume most of 15 minutes before tests start.
    timeout-minutes: 30
    # Pulls the CI images of this commit; only the image build may push them.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        id: registry
        uses: ./.github/actions/ghcr_login

      - name: Start local network
        uses: ./.github/actions/local-network
        with:
          image_org: ${{ steps.registry.outputs.image_org }}

      - name: Run Wallet functional tests
        run: yarn workspace @dashevo/wallet-lib test:functional

      - name: Run SDK functional tests
        run: yarn workspace dash test:functional

      - name: Run WASM SDK functional tests
        run: yarn workspace @dashevo/wasm-sdk test:functional

      - name: Show Docker logs
        if: ${{ failure() }}
        uses: jwalton/gh-docker-logs@v2
