name: Release Swift SDK FFI

# Part of the platform release: called from release.yml with the platform
# release tag (vX.Y.Z[-pre.N]). Builds DashSDKFFI.xcframework at the tag's
# commit and attaches the zip + its SwiftPM checksum to the platform GitHub
# release under versioned asset names.
#
# The workflow_dispatch trigger is a re-run/emergency path only: it
# re-releases the xcframework for an EXISTING platform release without
# rebuilding everything release.yml's own dispatch would.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Platform release tag (vX.Y.Z[-pre.N])'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing platform release tag to (re-)release the xcframework for.
          Plain tag name only (vX.Y.Z[-pre.N]) — ref forms like refs/tags/...
          are rejected so the per-tag concurrency lock and asset guards all
          key on one canonical spelling.
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and release DashSDKFFI
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # attach the xcframework to the platform release
    # Serialize same-tag runs (e.g. an emergency dispatch racing the
    # release-triggered run) so the asset-exists guard cannot be bypassed by
    # two concurrent builds. Never cancel a release build in progress.
    concurrency:
      group: release-swift-sdk-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      # Same guard as release-kotlin-sdk.yml: normalize/validate the tag,
      # refuse anything that is not an existing platform release tag with a
      # published GitHub release, and hand checkout an explicit refs/tags/
      # ref so a dispatch can never build from a branch. The release-exists
      # check also guarantees the attach step below can never CREATE a
      # release (softprops creates one when none exists).
      - name: Resolve and validate release tag
        id: release-ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plain tag names only — no refs/tags/ (or any slashed) form. The
          # job-level concurrency group keys on the raw inputs.tag (GHA
          # expressions cannot normalize strings), so accepting aliases for
          # the same tag would mint separate locks and let two runs race the
          # asset-exists guard.
          TAG="$INPUT_TAG"
          case "$TAG" in
            */*)
              echo "::error::'$INPUT_TAG' is not a plain tag name — pass the bare platform tag (vX.Y.Z[-pre.N]); ref spellings like refs/tags/... are rejected."
              exit 1
              ;;
          esac
          # bash [[ =~ ]] matches the WHOLE string, so a multiline dispatch
          # input can never pass validation and inject extra GITHUB_OUTPUT
          # lines.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a platform release tag (expected vX.Y.Z[-pre.N])."
            exit 1
          fi
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No existing tag 'refs/tags/${TAG}' in ${REPO}."
            exit 1
          fi
          if ! gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No published GitHub release for tag '${TAG}' — the SDK release attaches to the platform release and never creates one."
            exit 1
          fi
          {
            echo "checkout_ref=refs/tags/${TAG}"
            echo "tag_name=${TAG}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing DashSDKFFI ${TAG#v} for platform release ${TAG}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.checkout_ref }}

      - name: Resolve built commit SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Add iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install protoc (Protocol Buffers compiler)
        uses: arduino/setup-protoc@v3
        with:
          version: '32.x'
          # Without a token the action resolves the protoc release
          # unauthenticated, and the shared macOS-runner egress IP burns
          # through the 60 req/h anonymous limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DashSDKFFI.xcframework and install into Swift package
        run: |
          bash packages/swift-sdk/build_ios.sh --target all --profile release

      - name: Zip XCFramework, compute checksum, record build provenance
        id: zip
        env:
          VERSION: ${{ steps.release-ref.outputs.version }}
          BUILT_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: |
          cd packages/swift-sdk
          ditto -c -k --sequesterRsrc --keepParent DashSDKFFI.xcframework "DashSDKFFI-${VERSION}.xcframework.zip"
          swift package compute-checksum "DashSDKFFI-${VERSION}.xcframework.zip" > "DashSDKFFI-${VERSION}.checksum.txt"
          printf '%s\n' "$BUILT_SHA" > "DashSDKFFI-${VERSION}.commit.txt"
          echo "checksum=$(cat "DashSDKFFI-${VERSION}.checksum.txt")" >> "$GITHUB_OUTPUT"

      # Same defenses as the Kotlin job: hard-fail if the tag was force-moved
      # away from the commit this run built, and never overwrite an
      # already-attached versioned zip — SwiftPM consumers pin the zip by
      # checksum, so replacing attached bytes would break them. The zip
      # attaches together with checksum + commit provenance; existing assets
      # are reused only when their recorded commit equals the commit this run
      # built, so a force-moved tag cannot leave a green run whose assets
      # came from a different commit. A deliberate re-release must delete all
      # three assets first.
      - name: Verify tag still resolves to the built commit
        id: tag-guard
        env:
          TAG: ${{ steps.release-ref.outputs.tag_name }}
          ZIP_ASSET: DashSDKFFI-${{ steps.release-ref.outputs.version }}.xcframework.zip
          SUM_ASSET: DashSDKFFI-${{ steps.release-ref.outputs.version }}.checksum.txt
          COMMIT_ASSET: DashSDKFFI-${{ steps.release-ref.outputs.version }}.commit.txt
          BUILT_SHA: ${{ steps.resolve-sha.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the tag's current commit, dereferencing an annotated tag
          # to the commit it points at.
          OBJ_TYPE=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.type')
          OBJ_SHA=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha')
          if [ "$OBJ_TYPE" = "tag" ]; then
            OBJ_SHA=$(gh api "repos/${REPO}/git/tags/${OBJ_SHA}" --jq '.object.sha')
          fi
          if [ "$OBJ_SHA" != "$BUILT_SHA" ]; then
            echo "::error::Tag ${TAG} now points at ${OBJ_SHA} but this run built ${BUILT_SHA} — the tag was force-moved. Refusing to attach."
            exit 1
          fi
          # The three assets are attached as one unit: reuse them only when
          # ALL are present AND the recorded provenance commit matches this
          # run's built commit. A partial set means an earlier run died
          # mid-attach (provenance unverifiable); a mismatched commit means
          # the tag was force-moved after the original attach. Both hard-fail
          # and require deliberate cleanup instead of a silently-green run.
          ASSETS=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].name')
          HAVE_ZIP=$(echo "$ASSETS" | grep -Fxc "$ZIP_ASSET" || true)
          HAVE_SUM=$(echo "$ASSETS" | grep -Fxc "$SUM_ASSET" || true)
          HAVE_COMMIT=$(echo "$ASSETS" | grep -Fxc "$COMMIT_ASSET" || true)
          if [ "$HAVE_ZIP" = "1" ] && [ "$HAVE_SUM" = "1" ] && [ "$HAVE_COMMIT" = "1" ]; then
            RECORDED_SHA=$(gh release download "$TAG" --repo "$REPO" --pattern "$COMMIT_ASSET" --output - | tr -d '[:space:]')
            if [ "$RECORDED_SHA" != "$BUILT_SHA" ]; then
              echo "::error::Release ${TAG} carries ${ZIP_ASSET} built from ${RECORDED_SHA}, but this run built ${BUILT_SHA} — the existing assets came from a different commit. Delete all three assets deliberately to re-release."
              exit 1
            fi
            echo "asset_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} already has ${ZIP_ASSET} (+ checksum/commit) built from this same commit — leaving them untouched."
          elif [ "$HAVE_ZIP" = "1" ] || [ "$HAVE_SUM" = "1" ] || [ "$HAVE_COMMIT" = "1" ]; then
            echo "::error::Release ${TAG} has only some of ${ZIP_ASSET} / ${SUM_ASSET} / ${COMMIT_ASSET} — an earlier attach was interrupted, so the existing assets' provenance cannot be verified. Delete the surviving assets and re-run."
            exit 1
          else
            echo "asset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Attach to the PLATFORM release: only tag_name + files. Passing name/
      # body/prerelease/generate_release_notes here would overwrite the
      # platform release's own notes, title or prerelease flag.
      # overwrite_files: false makes a same-name upload race fail loudly
      # instead of silently replacing an asset the guard above vouched for.
      - name: Attach XCFramework to the platform release
        if: steps.tag-guard.outputs.asset_exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release-ref.outputs.tag_name }}
          overwrite_files: false
          files: |
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.xcframework.zip
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.checksum.txt
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.commit.txt

      # The durable home for the consumer checksum is the checksum.txt release
      # asset; this summary is a convenience copy. Skipped when the attach was
      # skipped: this run's freshly computed checksum would describe THIS
      # build, not the (not byte-reproducible) zip actually attached earlier.
      - name: Write SwiftPM usage to the job summary
        if: steps.tag-guard.outputs.asset_exists != 'true'
        env:
          TAG: ${{ steps.release-ref.outputs.tag_name }}
          VERSION: ${{ steps.release-ref.outputs.version }}
          CHECKSUM: ${{ steps.zip.outputs.checksum }}
          REPO: ${{ github.repository }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## DashSDKFFI ${VERSION}

          SwiftPM usage:

          \`\`\`swift
          .binaryTarget(
            name: "DashSDKFFI",
            url: "https://github.com/${REPO}/releases/download/${TAG}/DashSDKFFI-${VERSION}.xcframework.zip",
            checksum: "${CHECKSUM}"
          )
          \`\`\`
          EOF
