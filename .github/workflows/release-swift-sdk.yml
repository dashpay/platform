name: Release Swift SDK FFI

# Part of the platform release: called from release.yml with the platform
# release tag (vX.Y.Z[-pre.N]). Builds DashSDKFFI.xcframework at the tag's
# commit and attaches the zip + its SwiftPM checksum to the platform GitHub
# release under versioned asset names.
#
# The workflow_dispatch trigger is a re-run/emergency path only: it
# re-releases the xcframework for an EXISTING platform release without
# rebuilding everything release.yml's own dispatch would.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Platform release tag (vX.Y.Z[-pre.N])'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing platform release tag to (re-)release the xcframework for.
          Plain tag name only (vX.Y.Z[-pre.N]) — ref forms like refs/tags/...
          are rejected so the per-tag concurrency lock and asset guards all
          key on one canonical spelling.
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and release DashSDKFFI
    outputs:
      tag_name: ${{ steps.release-ref.outputs.tag_name }}
      version: ${{ steps.release-ref.outputs.version }}
      sha: ${{ steps.resolve-sha.outputs.sha }}
      checksum: ${{ steps.zip.outputs.checksum }}
    # Same persistent runner as swift-sdk-build.yml. Release builds keep their
    # own Cargo target cache on it (see "Prepare release Cargo target cache"),
    # so later releases only rebuild what changed since the previous one. No
    # fork PR guard is needed here: the workflow only triggers on release/
    # workflow_dispatch (via release.yml), never on pull_request.
    runs-on: [self-hosted, macOS, ARM64]
    # Three cold fat-LTO slices took over 45 minutes on a hosted macos-15
    # runner. A cold run here (first release, or after the cache is reset)
    # needs the same headroom; warm runs finish well inside it.
    timeout-minutes: 90
    permissions:
      contents: read # release attachment runs on an ephemeral hosted job
    # Serialize same-tag runs (e.g. an emergency dispatch racing the
    # release-triggered run) so the asset-exists guard cannot be bypassed by
    # two concurrent builds. Never cancel a release build in progress.
    concurrency:
      group: release-swift-sdk-${{ inputs.tag }}
      cancel-in-progress: false
    defaults:
      run:
        # The runner's work/temp directory can be on a volume with spaces.
        shell: bash --noprofile --norc -e -o pipefail "{0}"

    steps:
      # The tag validation below needs gh before checkout; hosted images ship
      # it, the persistent runner may not.
      - name: Ensure gh is installed
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi
          gh --version

      # Same guard as release-kotlin-sdk.yml: normalize/validate the tag,
      # refuse anything that is not an existing platform release tag with a
      # published GitHub release, and hand checkout an explicit refs/tags/
      # ref so a dispatch can never build from a branch. The release-exists
      # check also guarantees the attach step below can never CREATE a
      # release (softprops creates one when none exists).
      - name: Resolve and validate release tag
        id: release-ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plain tag names only — no refs/tags/ (or any slashed) form. The
          # job-level concurrency group keys on the raw inputs.tag (GHA
          # expressions cannot normalize strings), so accepting aliases for
          # the same tag would mint separate locks and let two runs race the
          # asset-exists guard.
          TAG="$INPUT_TAG"
          case "$TAG" in
            */*)
              echo "::error::'$INPUT_TAG' is not a plain tag name — pass the bare platform tag (vX.Y.Z[-pre.N]); ref spellings like refs/tags/... are rejected."
              exit 1
              ;;
          esac
          # bash [[ =~ ]] matches the WHOLE string, so a multiline dispatch
          # input can never pass validation and inject extra GITHUB_OUTPUT
          # lines.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a platform release tag (expected vX.Y.Z[-pre.N])."
            exit 1
          fi
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No existing tag 'refs/tags/${TAG}' in ${REPO}."
            exit 1
          fi
          if ! gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No published GitHub release for tag '${TAG}' — the SDK release attaches to the platform release and never creates one."
            exit 1
          fi
          {
            echo "checkout_ref=refs/tags/${TAG}"
            echo "tag_name=${TAG}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing DashSDKFFI ${TAG#v} for platform release ${TAG}"

      # PR jobs run in this same workspace on this persistent runner. Git
      # state they leave behind (.git/hooks, .git/config, .git/info/attributes)
      # would run inside actions/checkout's own `git checkout`, before any
      # later cleanup could remove it. Start from an empty directory and a
      # fresh clone; the release build cache lives outside the workspace.
      - name: Empty the workspace left by earlier jobs
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + \
            || sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.checkout_ref }}
          persist-credentials: false

      - name: Resolve built commit SHA
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The runner's selected Xcode is the one every other Swift job on this
      # machine builds with (setup-xcode only knows hosted image layouts).
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      # Composite actions choose their own shell and do not inherit the quoted
      # script path above, so rustup is set up inline as in
      # swift-sdk-build.yml. The build uses the rust-toolchain.toml channel.
      - name: Set up Rust toolchain
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          {
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL-0}"
            echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR-always}"
          } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Restore-only, matching swift-sdk-build.yml: the persistent runner
      # keeps ~/.cargo between runs, so saving it back would just re-upload
      # gigabytes on every lockfile change.
      - name: Restore cargo registry cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Add iOS Rust targets
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version --verbose

      # Fresh, checksum-verified copy in this job's temp directory. The runner's
      # tool cache persists between jobs, so a protoc left there by an earlier
      # job is not trusted for a release build.
      - name: Install protoc v32.0 (Protocol Buffers compiler)
        env:
          PROTOC_SHA256: 09a2c729cc821215cc0d4c564b761760961fe338c52f24b302fd7e18e7b675d1
        run: |
          set -euo pipefail
          PROTOC_DIR="$RUNNER_TEMP/protoc-32.0"
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-osx-aarch_64.zip
          echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          rm -rf "$PROTOC_DIR"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$PROTOC_DIR"
          echo "PROTOC=$PROTOC_DIR/bin/protoc" >> "$GITHUB_ENV"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version

      # PR builds on this runner (swift-sdk-build.yml) set PRUNE_CARGO_TARGETS,
      # which deletes every Apple target directory under the workspace
      # target/ before and after each slice, and this job empties the
      # workspace anyway. Releases keep their own release-ios cache outside
      # it instead.
      #
      # Inline copy of .github/actions/release-cargo-target-cache; keep the
      # two in sync. It cannot be a `uses: ./` step: GitHub loads a local
      # action from the checked-out tree, and a dispatch from the dev branch
      # for a tag older than v4.2.0-beta.5 checks out a tree that lacks it.
      # The job's default shell already quotes the script path.
      - name: Prepare release Cargo target cache
        env:
          CACHE_NAME: release-swift-sdk-target
          MAX_GIB: "60"
          MIN_FREE_GIB: "40"
        run: |
          set -euo pipefail
          case "$CACHE_NAME" in
            ''|*/*|.*)
              echo "::error::Invalid release target cache name '$CACHE_NAME'."
              exit 1
              ;;
          esac
          RELEASE_TARGET_DIR="$HOME/.cache/dash-platform/$CACHE_NAME"
          MAX_CACHE_KIB=$((MAX_GIB * 1024 * 1024))
          MIN_FREE_KIB=$((MIN_FREE_GIB * 1024 * 1024))
          mkdir -p "$RELEASE_TARGET_DIR"
          USED_KIB=$(du -sk "$RELEASE_TARGET_DIR" | cut -f1)
          FREE_KIB=$(df -Pk "$RELEASE_TARGET_DIR" | awk 'NR == 2 { print $4 }')
          if [ "$USED_KIB" -gt "$MAX_CACHE_KIB" ] || [ "$FREE_KIB" -lt "$MIN_FREE_KIB" ]; then
            echo "::notice::Resetting the release target cache (${USED_KIB} KiB used, ${FREE_KIB} KiB free on the volume)."
            rm -rf "${RELEASE_TARGET_DIR:?}"
            mkdir -p "$RELEASE_TARGET_DIR"
          fi
          du -sh "$RELEASE_TARGET_DIR"
          df -h "$RELEASE_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$RELEASE_TARGET_DIR" >> "$GITHUB_ENV"

      # build_ios.sh before v4.2.0-beta.5 ignores CARGO_TARGET_DIR and looks
      # for its libraries and headers under the workspace target/. Cargo
      # still builds into CARGO_TARGET_DIR, so point that path at the release
      # cache for such a tag; newer scripts read CARGO_TARGET_DIR and never
      # use the link. target/ is not tracked and the workspace was emptied
      # before checkout, so anything already there is unexpected. A real
      # directory would also make ln place the link inside it.
      - name: Link workspace target/ to the release Cargo target cache
        run: |
          set -euo pipefail
          if [ -e "$GITHUB_WORKSPACE/target" ] && [ ! -L "$GITHUB_WORKSPACE/target" ]; then
            echo "::error::$GITHUB_WORKSPACE/target already exists after a fresh checkout."
            exit 1
          fi
          ln -sfn "$CARGO_TARGET_DIR" "$GITHUB_WORKSPACE/target"
          ls -ld "$GITHUB_WORKSPACE/target"

      - name: Build DashSDKFFI.xcframework and install into Swift package
        env:
          # Keep all three slices' intermediates in the release cache above;
          # pruning them would make every release a cold build.
          PRUNE_CARGO_TARGETS: "0"
        run: |
          bash packages/swift-sdk/build_ios.sh --target all --profile release

      - name: Zip XCFramework, compute checksum, record build provenance
        id: zip
        env:
          VERSION: ${{ steps.release-ref.outputs.version }}
          BUILT_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: |
          cd packages/swift-sdk
          ditto -c -k --sequesterRsrc --keepParent DashSDKFFI.xcframework "DashSDKFFI-${VERSION}.xcframework.zip"
          swift package compute-checksum "DashSDKFFI-${VERSION}.xcframework.zip" > "DashSDKFFI-${VERSION}.checksum.txt"
          printf '%s\n' "$BUILT_SHA" > "DashSDKFFI-${VERSION}.commit.txt"
          echo "checksum=$(cat "DashSDKFFI-${VERSION}.checksum.txt")" >> "$GITHUB_OUTPUT"

      # Release attachment runs on a fresh hosted runner so release-write
      # credentials never reach the persistent build machine.
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: swift-sdk-release-assets
          path: |
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.xcframework.zip
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.checksum.txt
            packages/swift-sdk/DashSDKFFI-${{ steps.release-ref.outputs.version }}.commit.txt
          if-no-files-found: error
          retention-days: 7

      # PR jobs reuse this workspace, and some build into target/ after a
      # `clean: false` checkout. Never leave them a link into the release
      # cache. Removing the link leaves the cache itself untouched.
      - name: Remove the workspace target/ link
        if: always()
        run: |
          if [ -L "$GITHUB_WORKSPACE/target" ]; then
            rm "$GITHUB_WORKSPACE/target"
          fi

  attach-release:
    name: Attach XCFramework to platform release
    needs: build-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-swift-sdk-attach-${{ needs.build-and-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: swift-sdk-release-assets
          path: release-assets

      - name: Verify tag and existing assets
        id: verify
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          ZIP_ASSET: DashSDKFFI-${{ needs.build-and-release.outputs.version }}.xcframework.zip
          SUM_ASSET: DashSDKFFI-${{ needs.build-and-release.outputs.version }}.checksum.txt
          COMMIT_ASSET: DashSDKFFI-${{ needs.build-and-release.outputs.version }}.commit.txt
          BUILT_SHA: ${{ needs.build-and-release.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBJ_TYPE=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.type')
          OBJ_SHA=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha')
          if [ "$OBJ_TYPE" = "tag" ]; then
            OBJ_SHA=$(gh api "repos/${REPO}/git/tags/${OBJ_SHA}" --jq '.object.sha')
          fi
          [ "$OBJ_SHA" = "$BUILT_SHA" ] || { echo "::error::Tag ${TAG} moved from built commit ${BUILT_SHA} to ${OBJ_SHA}."; exit 1; }
          ASSETS=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].name')
          HAVE_ZIP=$(echo "$ASSETS" | grep -Fxc "$ZIP_ASSET" || true)
          HAVE_SUM=$(echo "$ASSETS" | grep -Fxc "$SUM_ASSET" || true)
          HAVE_COMMIT=$(echo "$ASSETS" | grep -Fxc "$COMMIT_ASSET" || true)
          if [ "$HAVE_ZIP" = 1 ] && [ "$HAVE_SUM" = 1 ] && [ "$HAVE_COMMIT" = 1 ]; then
            RECORDED_SHA=$(gh release download "$TAG" --repo "$REPO" --pattern "$COMMIT_ASSET" --output - | tr -d '[:space:]')
            [ "$RECORDED_SHA" = "$BUILT_SHA" ] || { echo "::error::Existing XCFramework provenance does not match this build."; exit 1; }
            echo "asset_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAVE_ZIP" = 1 ] || [ "$HAVE_SUM" = 1 ] || [ "$HAVE_COMMIT" = 1 ]; then
            echo "::error::Release has only some XCFramework provenance assets; delete them before retrying."
            exit 1
          else
            echo "asset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach XCFramework to the platform release
        if: steps.verify.outputs.asset_exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag_name }}
          overwrite_files: false
          files: |
            release-assets/DashSDKFFI-${{ needs.build-and-release.outputs.version }}.xcframework.zip
            release-assets/DashSDKFFI-${{ needs.build-and-release.outputs.version }}.checksum.txt
            release-assets/DashSDKFFI-${{ needs.build-and-release.outputs.version }}.commit.txt

      - name: Write SwiftPM usage to the job summary
        if: steps.verify.outputs.asset_exists != 'true'
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          VERSION: ${{ needs.build-and-release.outputs.version }}
          CHECKSUM: ${{ needs.build-and-release.outputs.checksum }}
          REPO: ${{ github.repository }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## DashSDKFFI ${VERSION}

          SwiftPM usage:

          \`\`\`swift
          .binaryTarget(
            name: "DashSDKFFI",
            url: "https://github.com/${REPO}/releases/download/${TAG}/DashSDKFFI-${VERSION}.xcframework.zip",
            checksum: "${CHECKSUM}"
          )
          \`\`\`
          EOF
