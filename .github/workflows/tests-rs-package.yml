on:
  workflow_call:
    inputs:
      package:
        description: The package name to run tests for
        type: string
        required: true
      check-each-feature:
        description: If true, try to build each individual feature for this crate
        type: boolean
        default: false
      direct-packages:
        description: JSON array of packages that changed directly (not via deps)
        type: string
        default: "[]"

# All per-package checks (linting, formatting, unused deps, immutable structures)
# have been consolidated into tests-rs-workspace.yml.
# check-each-feature has been moved to the nightly workflow.

jobs: {}
