name: Publish PR images

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-pr-images:
    name: Publish ${{ matrix.name }} image for PR
    if: ${{ github.event.pull_request.head.repo.fork && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Drive
            image_name: drive
            target: drive-abci
            build_args: |
              SDK_TEST_DATA=true
          - name: RS-DAPI
            image_name: rs-dapi
            target: rs-dapi
          - name: Dashmate helper
            image_name: dashmate-helper
            target: dashmate-helper
    uses: ./.github/workflows/tests-build-image.yml
    with:
      name: ${{ matrix.name }}
      image_name: ${{ matrix.image_name }}
      target: ${{ matrix.target }}
      build_args: ${{ matrix.build_args }}
      image_org: ghcr.io/dashpay/platform-ci
      image_tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      publish: true
      enabled: true
      checkout_ref: ${{ github.event.pull_request.head.sha }}
