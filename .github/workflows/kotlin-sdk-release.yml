name: Release Kotlin SDK AAR

on:
  push:
    tags:
      - 'kotlin-sdk-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (optional; defaults to ref name)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build release AAR (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A manual dispatch runs on the branch/tag selected in the UI, not
          # on the `tag` input it will publish under — without this ref the
          # released AAR could be built from a different commit than the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;28.1.13356709

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kotlin-sdk-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            kotlin-sdk-release-cargo-
            kotlin-sdk-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install protoc v32.0 (repo-standard; apt's 3.21 breaks tenderdash-proto)
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          protoc --version

      - name: Build native library (both ABIs, release profile)
        working-directory: packages/kotlin-sdk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.1.13356709
        run: ./build_android.sh --abi all --profile release --verify

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release AAR
        working-directory: packages/kotlin-sdk
        run: ./gradlew :sdk:assembleRelease --stacktrace

      - name: Attach AAR to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: packages/kotlin-sdk/sdk/build/outputs/aar/sdk-release.aar
          generate_release_notes: true
