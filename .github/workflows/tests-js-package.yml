# Runs one yarn script for each of several JS packages after a single setup.
# `.github/scripts/js-packages.py plan` (in tests.yml's `changes` job) decides
# which packages share a job; see its docstring for why.
on:
  workflow_call:
    inputs:
      job:
        description: The job name, such as Tests or Linting
        type: string
        required: true
      packages:
        description: JSON array of {"package", "command"} objects, run in order as `yarn workspace <package> <command>`
        type: string
        required: true

jobs:
  run:
    name: ${{ inputs.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      # No JS test or lint reads git history, so the default shallow checkout
      # is enough.
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node.JS
        uses: ./.github/actions/nodejs

      - name: Download JS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: js-build-${{ github.sha }}
          path: packages

      - name: Create necessary dotenv files
        run: |
          cp packages/dapi/.env.example packages/dapi/.env

      - name: Run ${{ inputs.job }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: python3 .github/scripts/js-packages.py run
