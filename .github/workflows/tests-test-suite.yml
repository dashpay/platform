on:
  workflow_call:
    inputs:
      name:
        type: string
        description: Name
        required: true
      command:
        description: Run tests command
        type: string
        default: test
        required: true
      batch_index:
        description: Browser test batch index
        type: number
        default: 0
      batch_total:
        description: Browser test batch total
        type: number
        default: 0

jobs:
  test-suite:
    name: Run ${{ inputs.name }}
    runs-on: ubuntu-24.04
    # Cold helper-image pulls can consume most of 15 minutes before tests start.
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        id: registry
        uses: ./.github/actions/ghcr_login

      - name: Start local network
        uses: ./.github/actions/local-network
        with:
          image_org: ${{ steps.registry.outputs.image_org }}

      - name: Run test suite
        run: yarn workspace @dashevo/platform-test-suite ${{ inputs.command }}
        env:
          BROWSER_TEST_BATCH_INDEX: ${{ inputs.batch_index }}
          BROWSER_TEST_BATCH_TOTAL: ${{ inputs.batch_total }}

      - name: Show Docker logs
        if: ${{ failure() }}
        uses: jwalton/gh-docker-logs@v2
