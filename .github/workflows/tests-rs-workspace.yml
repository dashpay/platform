on:
  workflow_call:

jobs:
  test:
    name: "Tests (shard ${{ matrix.partition }}/4)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: ". -> target/llvm-cov-target"

      - name: Install librocksdb
        uses: ./.github/actions/librocksdb

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-nextest

      - name: Strip cdylib from dash-sdk (incompatible with static rocksdb)
        run: sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml

      - name: Configure core dumps
        run: |
          sudo mkdir /cores
          sudo chmod 777 /cores
          sudo bash -c 'echo "/cores/%e.%p.%t" > /proc/sys/kernel/core_pattern'

      - name: Run tests with coverage (shard ${{ matrix.partition }}/4)
        run: |
          ulimit -c unlimited
          cargo llvm-cov nextest \
            --package drive \
            --package dpp \
            --package drive-abci \
            --package dash-sdk \
            --package platform-value \
            --package rs-dapi \
            --package platform-wallet \
            --package rs-dapi-client \
            --package platform-serialization \
            --all-features \
            --locked \
            --partition count:${{ matrix.partition }}/4 \
            --lcov --output-path lcov.info
        env:
          RUST_MIN_STACK: 4194304
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust-shard-${{ matrix.partition }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Collect crash artifacts
        if: failure()
        run: |
          set -euo pipefail
          shopt -s nullglob

          if ! compgen -G "/cores/*" > /dev/null; then
            echo "No core dumps were produced; skipping artifact archive."
            exit 0
          fi

          ARTIFACT_DIR=crash-artifacts
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}/cores" "${ARTIFACT_DIR}/binaries"

          cp -a /cores/. "${ARTIFACT_DIR}/cores/"

          for path in target/debug/deps/*; do
            if [[ -f "$path" && -x "$path" && ! "$path" == *.d ]]; then
              cp -a "$path" "${ARTIFACT_DIR}/binaries/"
            fi
          done

          (cd "${ARTIFACT_DIR}" && zip -9 -r ../core-dumps.zip .)

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-dumps-shard-${{ matrix.partition }}
          path: core-dumps.zip
          if-no-files-found: ignore
          retention-days: 3
