on:
  workflow_call:
    inputs:
      doctests-changed:
        description: Whether doc comments with code examples have changed
        type: boolean
        default: false
      shielded-changed:
        # Computed by the `changes` job in tests.yml (see the
        # "Check for shielded-relevant changes" step there for the heuristic
        # and its safety net). When false, the shielded test phase is skipped
        # and its coverage is restored from the cache populated by runs that
        # did execute it. Defaults to true so any caller that doesn't compute
        # the heuristic gets the full suite.
        description: Whether shielded code (or anything affecting the shielded suite) changed
        type: boolean
        default: true

jobs:
  test:
    name: Tests
    # Scheduled onto whichever self-hosted runner is free — the macOS boxes or
    # the Linux one. `rust-ci` is a custom label applied to exactly those
    # runners; pairing it with `self-hosted` keeps the job off GitHub-hosted
    # runners entirely, so untrusted code never reaches a hosted Linux VM by
    # way of a label collision.
    runs-on: [self-hosted, rust-ci]
    # Fork PRs must not execute on any persistent runner, macOS or Linux.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
      || github.event.pull_request.head.repo.owner.login == 'thepastaclaw'
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          clean: false

      # target/llvm-cov-target is deliberately NOT pruned here: it holds the
      # coverage-instrumented build (~10GB) that makes the test step's compile
      # incremental (~2.5 min saved per run). The size/free-disk guard below
      # removes the whole target/ if it ever outgrows the caps.
      - name: Prune runner disk before tests
        run: |
          for path in ../target-backup-before-*-clean-*; do
            if [ -e "$path" ]; then
              echo "Removing stale runner artifact: $path"
              rm -rf "$path"
            fi
          done

          # Absolute caps tuned for the large macOS volumes, clamped to a share
          # of the volume so a smaller runner doesn't purge target/ every run
          # and force a cold rebuild on each job.
          TOTAL=$(df -m . | awk 'NR == 2 {print $2}')
          FREE=$(df -m . | awk 'NR == 2 {print $4}')
          SIZE=$(du -sm target 2>/dev/null | awk '{print $1}' || echo 0)
          TOTAL=${TOTAL:-0}
          FREE=${FREE:-0}
          SIZE=${SIZE:-0}

          TARGET_MAX_MB=120000
          MIN_FREE_MB=60000
          if [ "$TOTAL" -gt 0 ]; then
            [ $((TOTAL / 3)) -lt "$TARGET_MAX_MB" ] && TARGET_MAX_MB=$((TOTAL / 3))
            [ $((TOTAL / 5)) -lt "$MIN_FREE_MB" ] && MIN_FREE_MB=$((TOTAL / 5))
          fi

          echo "volume size: ${TOTAL}MB"
          echo "target/ size: ${SIZE}MB (cap ${TARGET_MAX_MB}MB)"
          echo "available disk: ${FREE}MB (floor ${MIN_FREE_MB}MB)"
          if [ "$SIZE" -gt "$TARGET_MAX_MB" ] || [ "$FREE" -lt "$MIN_FREE_MB" ]; then
            echo "target/ exceeds ${TARGET_MAX_MB}MB or disk is below ${MIN_FREE_MB}MB free; removing target/"
            rm -rf target
          fi

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          brew list cmake &>/dev/null || brew install cmake
          brew list gmp &>/dev/null || brew install gmp
          brew list llvm &>/dev/null || brew install llvm
          brew list gnupg &>/dev/null || brew install gnupg

      # clang, llvm and libsnappy are installed by ./.github/actions/rust on
      # Linux; this covers what the rest of the job needs and what a bare
      # self-hosted image doesn't ship. Every branch is a no-op once the
      # persistent runner has been provisioned by the first run.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          MISSING=()
          for pkg in build-essential cmake libgmp-dev libssl-dev pkg-config jq zip; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING+=("$pkg")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Installing: ${MISSING[*]}"
            sudo apt-get update -qq
            sudo apt-get install -qq --yes "${MISSING[@]}"
          fi

          # Needed by the immutable-structure check below.
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get install -qq --yes gh || {
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -qq --yes gh
            }
          fi

          # dtolnay/rust-toolchain drives rustup; it must already exist.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          cache: false
          components: llvm-tools, rustfmt, clippy

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov 2>/dev/null || true

      # Self-hosted runners are not guaranteed to have nextest preinstalled;
      # the test step invokes `cargo llvm-cov nextest` and dies with
      # "no such command: nextest" on runners that lack it.
      - name: Install cargo-nextest
        run: cargo install cargo-nextest 2>/dev/null || true

      - name: Check formatting
        run: cargo fmt --check --all

      # Fails the PR that introduces a new workspace dependent of the wallet
      # crates, keeping the wallet-only fast path (tests-rs-wallet.yml) sound:
      # such a PR always takes this full path, so the check must live here to
      # fire at the moment the invariant breaks.
      - name: Verify wallet reverse-dependency closure
        run: python3 .github/scripts/check-wallet-closure.py

      - name: Clippy lints
        run: |
          cargo clippy \
            --workspace \
            --all-features \
            --locked \
            -- --no-deps -D warnings

      - name: Find unused dependencies
        run: |
          cargo install cargo-machete 2>/dev/null || true
          cargo machete

      - name: Detect immutable structure changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED_RS=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '[.files[].path] | map(select(test("\\.rs$"))) | .[]')
          if [ -z "$CHANGED_RS" ]; then
            echo "No .rs files changed — skipping"
            exit 0
          fi

          # Brace-aware extractor: captures from @tag through the matching closing brace
          extract_tagged_block() {
            local tag="$1"
            awk -v tag="$tag" '
              $0 ~ tag { found=1; depth=0 }
              found {
                for (i=1; i<=length($0); i++) {
                  c = substr($0,i,1)
                  if (c == "{") depth++
                  if (c == "}") depth--
                }
                print
                if (found && depth <= 0 && index($0, "}")) { found=0 }
              }
            '
          }

          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          for file in $CHANGED_RS; do
            if [ ! -f "$file" ]; then continue; fi
            BASE_CONTENT=$(git show origin/${{ github.event.pull_request.base.ref }}:"$file" 2>/dev/null || true)
            if [ -z "$BASE_CONTENT" ]; then continue; fi

            BASE_APPEND=$(echo "$BASE_CONTENT" | extract_tagged_block "@append_only")
            PR_APPEND=$(extract_tagged_block "@append_only" < "$file")
            BASE_IMMUTABLE=$(echo "$BASE_CONTENT" | extract_tagged_block "@immutable")
            PR_IMMUTABLE=$(extract_tagged_block "@immutable" < "$file")

            if [ -n "$BASE_APPEND" ]; then
              # Check for deletions, ignoring comment-only lines and the tag itself
              DELETIONS=$(diff <(echo "$BASE_APPEND") <(echo "$PR_APPEND") | grep "^<" | grep -v "@append_only" | grep -v "^< *$" | grep -v "^< *///" | grep -v "^< *//" || true)
              if [ -n "$DELETIONS" ]; then
                echo "Deletions detected in @append_only structures in $file"
                echo "$DELETIONS"
                exit 1
              fi
            fi
            if [ -n "$BASE_IMMUTABLE" ]; then
              CHANGES=$(diff <(echo "$BASE_IMMUTABLE") <(echo "$PR_IMMUTABLE") | grep -E "^[<>]" | grep -v "^[<>] *$" | grep -v "^[<>] *///" | grep -v "^[<>] *//" | grep -v "@immutable" || true)
              if [ -n "$CHANGES" ]; then
                echo "Code changes detected in @immutable structures in $file"
                echo "$CHANGES"
                exit 1
              fi
            fi
          done
          echo "No immutable/append_only structure violations found"

      - name: Check if coverage can be reused
        id: coverage-cache
        run: |
          CURRENT_TREE=$(git rev-parse HEAD^{tree})
          CACHED_TREE=$(cat target/lcov-tree-hash 2>/dev/null || echo "none")
          if [ "$CURRENT_TREE" = "$CACHED_TREE" ] && [ -f lcov-nonshielded.info ] && [ -f lcov-shielded.info ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Tree hash matches ($CURRENT_TREE) — reusing coverage from previous run"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Tree hash changed ($CACHED_TREE -> $CURRENT_TREE) — running tests"
          fi

      # Also purge leftover profile data so a cancelled previous run (whose
      # end-of-job cleanup may not have executed) cannot leak stale profraw
      # into this run's coverage report.
      - name: Remove stale coverage data
        if: steps.coverage-cache.outputs.reuse == 'false'
        run: |
          rm -f lcov.info lcov-nonshielded.info lcov-shielded.info
          if [ -d target/llvm-cov-target ]; then
            find target/llvm-cov-target \( -name '*.profraw' -o -name '*.profdata' \) -delete || true
          fi

      # Content-address the shielded coverage cache: the key is a hash over
      # the blobs of the union of every input the shielded-change detector in
      # tests.yml treats as shielded-relevant (keep the keyword regex and the
      # build-input list in sync with it):
      #   - tracked files whose PATH mentions a shielded keyword (shielded
      #     module files don't all mention a keyword in their content, e.g.
      #     error types under a shielded/ directory);
      #   - tracked .rs/.proto files whose CONTENT mentions a keyword
      #     (shielded match arms and test names in shared files);
      #   - the build inputs that select or compile the suite: every Cargo
      #     manifest and lockfile, rust-toolchain.toml, the rust setup
      #     action, and the Rust test workflows.
      # An exact-key hit therefore proves the cached lcov was produced from
      # byte-identical shielded sources and build configuration — a PR can
      # never reuse coverage from a tree whose shielded inputs differ from
      # its own, and any change that forces a fresh shielded run also moves
      # the key (Actions cache entries are immutable, so a stale entry must
      # never stay reachable under a current key). `git ls-files`/`git grep`
      # only consider tracked files, so runner-local artifacts (target/)
      # cannot perturb the hash.
      - name: Compute shielded source content hash
        id: shielded-hash
        if: steps.coverage-cache.outputs.reuse == 'false'
        run: |
          set -eu
          HASH=$(
            {
              git ls-files | grep -iE 'shield|orchard|halo2' || true
              git grep -ilE 'shield|orchard|halo2' -- '*.rs' '*.proto' || true
              git ls-files | grep -E '(^|/)Cargo\.(toml|lock)$' || true
              echo rust-toolchain.toml
              git ls-files -- .github/actions/rust .github/workflows/tests.yml .github/workflows/tests-rs-workspace.yml
            } \
              | LC_ALL=C sort -u \
              | tr '\n' '\0' \
              | xargs -0 git ls-files -s -- \
              | git hash-object --stdin
          )
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Shielded source content hash: $HASH"

      # When the PR didn't touch anything shielded-relevant, reuse the
      # shielded coverage produced by an earlier run of identical shielded
      # sources instead of paying ~4-5 minutes of halo2 proving per PR. In
      # practice the hit comes from the entry saved by a post-merge push run
      # on the base branch. Exact key match only — no restore-keys prefix
      # fallback — so a hit is a content-verified reuse. A miss (evicted
      # cache, shielded sources newer than any prior full run) simply falls
      # back to running the shielded suite, which then repopulates the cache.
      - name: Restore shielded coverage from cache
        id: shielded-cache
        if: steps.coverage-cache.outputs.reuse == 'false' && inputs.shielded-changed == false
        uses: actions/cache/restore@v4
        with:
          path: lcov-shielded.info
          key: rs-shielded-lcov-v1-${{ steps.shielded-hash.outputs.hash }}

      - name: Run non-shielded tests with nextest (parallel, compiles all packages)
        if: steps.coverage-cache.outputs.reuse == 'false'
        run: |
          cargo llvm-cov nextest --no-report \
            --package drive \
            --package dpp \
            --package drive-abci \
            --package dash-sdk \
            --package dash-async \
            --package platform-value \
            --package rs-dapi \
            --package platform-wallet \
            --package platform-wallet-storage \
            --package rs-sdk-ffi \
            --package platform-wallet-ffi \
            --package rs-dapi-client \
            --package platform-serialization \
            --package dapi-grpc \
            --package json-schema-compatibility-validator \
            --package dashpay-contract \
            --package dpns-contract \
            --package masternode-reward-shares-contract \
            --package withdrawals-contract \
            --package token-history-contract \
            --package wallet-utils-contract \
            --package keyword-search-contract \
            --all-features \
            --locked \
            -E 'not test(~shield)'
        env:
          RUST_MIN_STACK: 4194304
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"

      # Report the non-shielded phase on its own, then drop its profraw files
      # so the shielded report below contains only shielded execution. The
      # two lcov files are uploaded together and codecov merges them, so the
      # combined coverage is the same as the old single-report flow — but the
      # shielded half is now separately cacheable.
      - name: Generate non-shielded coverage report
        if: steps.coverage-cache.outputs.reuse == 'false'
        run: |
          cargo llvm-cov report --lcov --output-path lcov-nonshielded.info
          cargo llvm-cov clean --profraw-only

      # Runs when shielded-relevant code changed, and also when nothing
      # shielded changed but no content-verified cached coverage could be
      # restored. (A skipped restore step yields an empty cache-hit output,
      # which correctly reads as "no cache" here.)
      - name: Run shielded tests with cargo test (shared process for VK reuse)
        id: shielded-tests
        if: >-
          steps.coverage-cache.outputs.reuse == 'false'
          && (inputs.shielded-changed || steps.shielded-cache.outputs.cache-hit != 'true')
        run: |
          cargo llvm-cov test --no-report \
            --package dpp \
            --package drive \
            --package drive-abci \
            --package dash-sdk \
            --all-features \
            --locked \
            -- shield
        env:
          RUST_MIN_STACK: 4194304
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"

      - name: Generate shielded coverage report
        if: steps.shielded-tests.outcome == 'success'
        run: cargo llvm-cov report --lcov --output-path lcov-shielded.info

      # Saving under the content hash means a duplicate save (same shielded
      # sources already cached) is a harmless no-op warning.
      - name: Save shielded coverage to cache
        if: steps.shielded-tests.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: lcov-shielded.info
          key: rs-shielded-lcov-v1-${{ steps.shielded-hash.outputs.hash }}

      # The marker means "this exact tree passed the COMPLETE suite", so it
      # is written only when the shielded phase actually ran and succeeded.
      # A fast-path run (cache-restored shielded coverage) must not write it:
      # the post-merge push commonly has the same tree as the PR merge ref,
      # and on the same runner the marker would let the reuse check skip the
      # push run's shielded suite — the safety net for shared-code changes
      # the detector heuristic misses.
      - name: Record coverage tree hash
        if: >-
          steps.coverage-cache.outputs.reuse == 'false'
          && steps.shielded-tests.outcome == 'success'
        run: git rev-parse HEAD^{tree} > target/lcov-tree-hash

      - name: Reset GPG state (fix stale keyboxd locks on the macOS runners)
        if: always() && runner.os == 'macOS'
        run: |
          gpgconf --kill all 2>/dev/null || true
          rm -rf ~/.gnupg/public-keys.d/*.lock 2>/dev/null || true
          rm -rf ~/.gnupg/.#* 2>/dev/null || true

      # Codecov merges the two report files into one combined coverage view;
      # on runs that skipped the shielded phase, lcov-shielded.info is the
      # cache-restored report from the last run that executed it.
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: lcov-nonshielded.info,lcov-shielded.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Keep the coverage-instrumented build (target/llvm-cov-target) between
      # runs so the test step's compile stays incremental — a full wipe forces
      # a ~2.5 min cold rebuild of ~700 crates every job. Only per-run profile
      # data is removed: profraw files (one per test process, regenerated by
      # every run) and the merged profdata. Disk pressure is handled by the
      # size/free-disk guard in "Prune runner disk before tests", which
      # removes the whole target/ when it outgrows the caps. ("Remove stale
      # coverage data" purges profile data again at the start of the next run,
      # covering cancelled jobs where this step never executes.)
      - name: Remove per-run coverage profile data
        if: always()
        run: |
          if [ -d target/llvm-cov-target ]; then
            find target/llvm-cov-target \( -name '*.profraw' -o -name '*.profdata' \) -delete || true
            du -sh target/llvm-cov-target 2>/dev/null || true
          fi
          du -sh target 2>/dev/null || true

      - name: Run doctests
        if: ${{ inputs.doctests-changed }}
        run: |
          cargo test \
            --workspace \
            --all-features \
            --locked \
            --doc
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
