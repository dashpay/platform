on:
  workflow_call:

jobs:
  detect-zk-changes:
    name: Detect ZK code changes
    runs-on: ubuntu-24.04
    outputs:
      zk-changed: ${{ steps.check.outputs.zk-changed }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ZK-related changes
        id: check
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE \
            'packages/rs-dpp/src/shielded/|packages/rs-dpp/src/address_funds/orchard|packages/rs-dpp/src/state_transition/state_transitions/shielded/|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/shield|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/shielded_|packages/rs-drive-abci/src/execution/validation/state_transition/state_transitions/unshield|packages/rs-drive/src/state_transition_action/shielded/|packages/rs-drive/src/verify/shielded/|packages/rs-drive-abci/tests/strategy_tests/test_cases/shielded_tests'; then
            echo "zk-changed=true" >> "$GITHUB_OUTPUT"
            echo "ZK-related files changed — ZK tests will run"
          else
            echo "zk-changed=false" >> "$GITHUB_OUTPUT"
            echo "No ZK-related changes — skipping ZK tests"
          fi

  test:
    name: "Tests (shard ${{ matrix.partition }}/8)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Strip cdylib crate-types (incompatible with static rocksdb)
        run: |
          sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml packages/wasm-drive-verify/Cargo.toml
          sed -i 's/\["cdylib", "lib"\]/["lib"]/' packages/wasm-dpp2/Cargo.toml
          sed -i 's/\["cdylib"\]/["rlib"]/' packages/wasm-sdk/Cargo.toml
          sed -i 's/\["staticlib", "cdylib", "rlib"\]/["staticlib", "rlib"]/g' packages/rs-sdk-ffi/Cargo.toml packages/rs-platform-wallet-ffi/Cargo.toml

      - name: Setup Rust
        uses: ./.github/actions/rust

      - name: Setup sccache
        uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.CACHE_S3_BUCKET }}
          region: ${{ vars.CACHE_REGION }}
          endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          access_key_id: ${{ secrets.CACHE_KEY_ID }}
          secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}

      - name: Install librocksdb
        uses: ./.github/actions/librocksdb

      - uses: taiki-e/install-action@cargo-nextest

      - name: Configure core dumps
        run: |
          sudo mkdir /cores
          sudo chmod 777 /cores
          sudo bash -c 'echo "/cores/%e.%p.%t" > /proc/sys/kernel/core_pattern'

      - name: Run tests (shard ${{ matrix.partition }}/8)
        run: |
          ulimit -c unlimited
          cargo nextest run \
            --package drive \
            --package dpp \
            --package drive-abci \
            --package dash-sdk \
            --package platform-value \
            --package rs-dapi \
            --package platform-wallet \
            --package rs-sdk-ffi \
            --package platform-wallet-ffi \
            --package rs-dapi-client \
            --package platform-serialization \
            --package dapi-grpc \
            --package json-schema-compatibility-validator \
            --package dashpay-contract \
            --package dpns-contract \
            --package masternode-reward-shares-contract \
            --package withdrawals-contract \
            --package token-history-contract \
            --package wallet-utils-contract \
            --package keyword-search-contract \
            --all-features \
            --locked \
            -E 'not test(/shield/)' \
            --partition count:${{ matrix.partition }}/8
        env:
          RUST_MIN_STACK: 4194304
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
          SCCACHE_S3_KEY_PREFIX: ${{ runner.os }}/sccache/${{ runner.arch }}/linux-gnu
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"

      - name: Collect crash artifacts
        if: failure()
        run: |
          set -euo pipefail
          shopt -s nullglob

          if ! compgen -G "/cores/*" > /dev/null; then
            echo "No core dumps were produced; skipping artifact archive."
            exit 0
          fi

          ARTIFACT_DIR=crash-artifacts
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}/cores" "${ARTIFACT_DIR}/binaries"

          cp -a /cores/. "${ARTIFACT_DIR}/cores/"

          for path in target/debug/deps/*; do
            if [[ -f "$path" && -x "$path" && ! "$path" == *.d ]]; then
              cp -a "$path" "${ARTIFACT_DIR}/binaries/"
            fi
          done

          (cd "${ARTIFACT_DIR}" && zip -9 -r ../core-dumps.zip .)

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-dumps-shard-${{ matrix.partition }}-of-8
          path: core-dumps.zip
          if-no-files-found: ignore
          retention-days: 3

  zk-tests:
    name: ZK / Shielded tests
    needs: detect-zk-changes
    if: needs.detect-zk-changes.outputs.zk-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Strip cdylib crate-types (incompatible with static rocksdb)
        run: |
          sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml packages/wasm-drive-verify/Cargo.toml
          sed -i 's/\["cdylib", "lib"\]/["lib"]/' packages/wasm-dpp2/Cargo.toml
          sed -i 's/\["cdylib"\]/["rlib"]/' packages/wasm-sdk/Cargo.toml
          sed -i 's/\["staticlib", "cdylib", "rlib"\]/["staticlib", "rlib"]/g' packages/rs-sdk-ffi/Cargo.toml packages/rs-platform-wallet-ffi/Cargo.toml

      - name: Setup Rust
        uses: ./.github/actions/rust

      - name: Setup sccache
        uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.CACHE_S3_BUCKET }}
          region: ${{ vars.CACHE_REGION }}
          endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          access_key_id: ${{ secrets.CACHE_KEY_ID }}
          secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}

      - name: Install librocksdb
        uses: ./.github/actions/librocksdb

      - uses: taiki-e/install-action@cargo-nextest

      - name: Run ZK / Shielded tests
        run: |
          cargo nextest run \
            --package dpp \
            --package drive-abci \
            --package drive \
            --all-features \
            --locked \
            -E 'test(/shield/)'
        env:
          RUST_MIN_STACK: 4194304
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
          SCCACHE_S3_KEY_PREFIX: ${{ runner.os }}/sccache/${{ runner.arch }}/linux-gnu
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"
