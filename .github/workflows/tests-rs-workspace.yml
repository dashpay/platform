on:
  workflow_call:
    inputs:
      zk-changed:
        description: Whether ZK/shielded related code has changed
        type: boolean
        default: false
      doctests-changed:
        description: Whether doc comments with code examples have changed
        type: boolean
        default: false

jobs:
  test-mac:
    name: Tests (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean target if too large
        run: |
          SIZE=$(du -sm target 2>/dev/null | cut -f1 || true)
          SIZE=${SIZE:-0}
          echo "target/ size: ${SIZE}MB"
          if [ "$SIZE" -gt 200000 ]; then
            echo "target/ exceeds 200GB — cleaning"
            cargo clean
          fi

      - name: Install build dependencies
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          brew list cmake &>/dev/null || brew install cmake
          brew list gmp &>/dev/null || brew install gmp
          brew list llvm &>/dev/null || brew install llvm
          brew list gnupg &>/dev/null || brew install gnupg

      - name: Setup Rust
        uses: ./.github/actions/rust
        with:
          cache: false
          components: llvm-tools

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov 2>/dev/null || true

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy lints
        run: |
          cargo clippy \
            --workspace \
            --all-features \
            --locked \
            -- --no-deps -D warnings

      - name: Find unused dependencies
        run: |
          cargo install cargo-machete 2>/dev/null || true
          cargo machete

      - name: Detect immutable structure changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED_RS=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '[.files[].path] | map(select(test("\\.rs$"))) | .[]')
          if [ -z "$CHANGED_RS" ]; then
            echo "No .rs files changed — skipping"
            exit 0
          fi

          # Brace-aware extractor: captures from @tag through the matching closing brace
          extract_tagged_block() {
            local tag="$1"
            awk -v tag="$tag" '
              $0 ~ tag { found=1; depth=0 }
              found {
                for (i=1; i<=length($0); i++) {
                  c = substr($0,i,1)
                  if (c == "{") depth++
                  if (c == "}") depth--
                }
                print
                if (found && depth <= 0 && index($0, "}")) { found=0 }
              }
            '
          }

          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          for file in $CHANGED_RS; do
            if [ ! -f "$file" ]; then continue; fi
            BASE_CONTENT=$(git show origin/${{ github.event.pull_request.base.ref }}:"$file" 2>/dev/null || true)
            if [ -z "$BASE_CONTENT" ]; then continue; fi

            BASE_APPEND=$(echo "$BASE_CONTENT" | extract_tagged_block "@append_only")
            PR_APPEND=$(extract_tagged_block "@append_only" < "$file")
            BASE_IMMUTABLE=$(echo "$BASE_CONTENT" | extract_tagged_block "@immutable")
            PR_IMMUTABLE=$(extract_tagged_block "@immutable" < "$file")

            if [ -n "$BASE_APPEND" ]; then
              # Check for deletions, ignoring comment-only lines and the tag itself
              DELETIONS=$(diff <(echo "$BASE_APPEND") <(echo "$PR_APPEND") | grep "^<" | grep -v "@append_only" | grep -v "^< *$" | grep -v "^< *///" | grep -v "^< *//" || true)
              if [ -n "$DELETIONS" ]; then
                echo "Deletions detected in @append_only structures in $file"
                echo "$DELETIONS"
                exit 1
              fi
            fi
            if [ -n "$BASE_IMMUTABLE" ]; then
              CHANGES=$(diff <(echo "$BASE_IMMUTABLE") <(echo "$PR_IMMUTABLE") | grep -E "^[<>]" | grep -v "^[<>] *$" | grep -v "^[<>] *///" | grep -v "^[<>] *//" | grep -v "@immutable" || true)
              if [ -n "$CHANGES" ]; then
                echo "Code changes detected in @immutable structures in $file"
                echo "$CHANGES"
                exit 1
              fi
            fi
          done
          echo "No immutable/append_only structure violations found"

      - name: Run tests with coverage
        run: |
          FILTER_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER_ARGS="-E 'not test(/shield/)'"
          fi
          eval cargo llvm-cov nextest \
            --package drive \
            --package dpp \
            --package drive-abci \
            --package dash-sdk \
            --package platform-value \
            --package rs-dapi \
            --package platform-wallet \
            --package rs-sdk-ffi \
            --package platform-wallet-ffi \
            --package rs-dapi-client \
            --package platform-serialization \
            --package dapi-grpc \
            --package json-schema-compatibility-validator \
            --package dashpay-contract \
            --package dpns-contract \
            --package masternode-reward-shares-contract \
            --package withdrawals-contract \
            --package token-history-contract \
            --package wallet-utils-contract \
            --package keyword-search-contract \
            --all-features \
            --locked \
            $FILTER_ARGS \
            --lcov --output-path lcov.info
        env:
          RUST_MIN_STACK: 4194304
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"

      - name: Upload coverage
        if: always()
        run: |
          curl -Os https://cli.codecov.io/latest/macos/codecov
          chmod +x codecov
          ./codecov do-upload \
            --token "$CODECOV_TOKEN" \
            --git-service github \
            --file lcov.info \
            --flag rust-mac \
            --branch "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" || true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run doctests
        if: ${{ inputs.doctests-changed }}
        run: |
          cargo test \
            --workspace \
            --all-features \
            --locked \
            --doc
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"

  test-ubuntu:
    name: "Tests backup (shard ${{ matrix.partition }}/4)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Wait and check if Mac runner is available
        id: check-mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          MAC_JOB=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "Rust workspace tests / Tests (macOS)")' 2>/dev/null || echo "{}")
          MAC_STATUS=$(echo "$MAC_JOB" | jq -r '.status // "unknown"')
          MAC_CONCLUSION=$(echo "$MAC_JOB" | jq -r '.conclusion // ""')
          echo "mac-status=$MAC_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$MAC_STATUS" = "in_progress" ]; then
            echo "Mac runner picked up the job — skipping Ubuntu fallback"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$MAC_STATUS" = "completed" ] && [ "$MAC_CONCLUSION" = "failure" ]; then
            echo "Mac runner already failed — failing Ubuntu fallback too"
            exit 1
          else
            echo "Mac runner not available (status: $MAC_STATUS) — running on Ubuntu"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Check out repo
        if: steps.check-mac.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Strip cdylib crate-types (incompatible with static rocksdb)
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml packages/wasm-drive-verify/Cargo.toml
          sed -i 's/\["cdylib", "lib"\]/["lib"]/' packages/wasm-dpp2/Cargo.toml
          sed -i 's/\["cdylib"\]/["rlib"]/' packages/wasm-sdk/Cargo.toml
          sed -i 's/\["staticlib", "cdylib", "rlib"\]/["staticlib", "rlib"]/g' packages/rs-sdk-ffi/Cargo.toml packages/rs-platform-wallet-ffi/Cargo.toml

      - name: Setup Rust
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/rust

      - name: Setup sccache
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.CACHE_S3_BUCKET }}
          region: ${{ vars.CACHE_REGION }}
          endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          access_key_id: ${{ secrets.CACHE_KEY_ID }}
          secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}

      - name: Install librocksdb
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/librocksdb

      - uses: taiki-e/install-action@cargo-nextest
        if: steps.check-mac.outputs.skip == 'false'

      - name: Configure core dumps
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          sudo mkdir /cores
          sudo chmod 777 /cores
          sudo bash -c 'echo "/cores/%e.%p.%t" > /proc/sys/kernel/core_pattern'

      - name: Run tests (shard ${{ matrix.partition }}/6)
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          ulimit -c unlimited
          FILTER_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER_ARGS="-E 'not test(/shield/)'"
          fi
          eval cargo nextest run \
            --package drive \
            --package dpp \
            --package drive-abci \
            --package dash-sdk \
            --package platform-value \
            --package rs-dapi \
            --package platform-wallet \
            --package rs-sdk-ffi \
            --package platform-wallet-ffi \
            --package rs-dapi-client \
            --package platform-serialization \
            --package dapi-grpc \
            --package json-schema-compatibility-validator \
            --package dashpay-contract \
            --package dpns-contract \
            --package masternode-reward-shares-contract \
            --package withdrawals-contract \
            --package token-history-contract \
            --package wallet-utils-contract \
            --package keyword-search-contract \
            --all-features \
            --locked \
            $FILTER_ARGS \
            --partition count:${{ matrix.partition }}/4
        env:
          RUST_MIN_STACK: 4194304
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
          SCCACHE_S3_KEY_PREFIX: ${{ runner.os }}/sccache/${{ runner.arch }}/linux-gnu
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"

      - name: Collect crash artifacts
        if: failure() && steps.check-mac.outputs.skip == 'false'
        run: |
          set -euo pipefail
          shopt -s nullglob

          if ! compgen -G "/cores/*" > /dev/null; then
            echo "No core dumps were produced; skipping artifact archive."
            exit 0
          fi

          ARTIFACT_DIR=crash-artifacts
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}/cores" "${ARTIFACT_DIR}/binaries"

          cp -a /cores/. "${ARTIFACT_DIR}/cores/"

          for path in target/debug/deps/*; do
            if [[ -f "$path" && -x "$path" && ! "$path" == *.d ]]; then
              cp -a "$path" "${ARTIFACT_DIR}/binaries/"
            fi
          done

          (cd "${ARTIFACT_DIR}" && zip -9 -r ../core-dumps.zip .)

      - name: Upload core dumps
        if: failure() && steps.check-mac.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: core-dumps-shard-${{ matrix.partition }}-of-4
          path: core-dumps.zip
          if-no-files-found: ignore
          retention-days: 3

  lint-ubuntu:
    name: "Formatting & Linting backup"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Wait and check if Mac runner is available
        id: check-mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          MAC_JOB=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "Rust workspace tests / Tests (macOS)")' 2>/dev/null || echo "{}")
          MAC_STATUS=$(echo "$MAC_JOB" | jq -r '.status // "unknown"')
          MAC_CONCLUSION=$(echo "$MAC_JOB" | jq -r '.conclusion // ""')
          echo "mac-status=$MAC_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$MAC_STATUS" = "in_progress" ]; then
            echo "Mac runner picked up the job — skipping Ubuntu fallback"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$MAC_STATUS" = "completed" ] && [ "$MAC_CONCLUSION" = "failure" ]; then
            echo "Mac runner already failed — failing Ubuntu fallback too"
            exit 1
          else
            echo "Mac runner not available (status: $MAC_STATUS) — running on Ubuntu"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.check-mac.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Strip cdylib crate-types (incompatible with static rocksdb)
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml packages/wasm-drive-verify/Cargo.toml
          sed -i 's/\["cdylib", "lib"\]/["lib"]/' packages/wasm-dpp2/Cargo.toml
          sed -i 's/\["cdylib"\]/["rlib"]/' packages/wasm-sdk/Cargo.toml
          sed -i 's/\["staticlib", "cdylib", "rlib"\]/["staticlib", "rlib"]/g' packages/rs-sdk-ffi/Cargo.toml packages/rs-platform-wallet-ffi/Cargo.toml

      - name: Setup Rust
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.CACHE_S3_BUCKET }}
          region: ${{ vars.CACHE_REGION }}
          endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          access_key_id: ${{ secrets.CACHE_KEY_ID }}
          secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}

      - name: Install librocksdb
        if: steps.check-mac.outputs.skip == 'false'
        uses: ./.github/actions/librocksdb

      - name: Check formatting
        if: steps.check-mac.outputs.skip == 'false'
        run: cargo fmt --check --all

      - name: Clippy lints
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          cargo clippy \
            --workspace \
            --all-features \
            --locked \
            -- --no-deps -D warnings
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          SCCACHE_S3_KEY_PREFIX: ${{ runner.os }}/sccache/${{ runner.arch }}/linux-gnu
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"

      - name: Find unused dependencies
        if: steps.check-mac.outputs.skip == 'false'
        run: |
          cargo install cargo-machete 2>/dev/null || true
          cargo machete
        env:
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"

      - name: Detect immutable structure changes
        if: steps.check-mac.outputs.skip == 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED_RS=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '[.files[].path] | map(select(test("\\.rs$"))) | .[]')
          if [ -z "$CHANGED_RS" ]; then
            echo "No .rs files changed — skipping"
            exit 0
          fi

          # Brace-aware extractor: captures from @tag through the matching closing brace
          extract_tagged_block() {
            local tag="$1"
            awk -v tag="$tag" '
              $0 ~ tag { found=1; depth=0 }
              found {
                for (i=1; i<=length($0); i++) {
                  c = substr($0,i,1)
                  if (c == "{") depth++
                  if (c == "}") depth--
                }
                print
                if (found && depth <= 0 && index($0, "}")) { found=0 }
              }
            '
          }

          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          for file in $CHANGED_RS; do
            if [ ! -f "$file" ]; then continue; fi
            BASE_CONTENT=$(git show origin/${{ github.event.pull_request.base.ref }}:"$file" 2>/dev/null || true)
            if [ -z "$BASE_CONTENT" ]; then continue; fi

            BASE_APPEND=$(echo "$BASE_CONTENT" | extract_tagged_block "@append_only")
            PR_APPEND=$(extract_tagged_block "@append_only" < "$file")
            BASE_IMMUTABLE=$(echo "$BASE_CONTENT" | extract_tagged_block "@immutable")
            PR_IMMUTABLE=$(extract_tagged_block "@immutable" < "$file")

            if [ -n "$BASE_APPEND" ]; then
              DELETIONS=$(diff <(echo "$BASE_APPEND") <(echo "$PR_APPEND") | grep "^<" | grep -v "@append_only" | grep -v "^< *$" | grep -v "^< *///" | grep -v "^< *//" || true)
              if [ -n "$DELETIONS" ]; then
                echo "Deletions detected in @append_only structures in $file"
                echo "$DELETIONS"
                exit 1
              fi
            fi
            if [ -n "$BASE_IMMUTABLE" ]; then
              CHANGES=$(diff <(echo "$BASE_IMMUTABLE") <(echo "$PR_IMMUTABLE") | grep -E "^[<>]" | grep -v "^[<>] *$" | grep -v "^[<>] *///" | grep -v "^[<>] *//" | grep -v "@immutable" || true)
              if [ -n "$CHANGES" ]; then
                echo "Code changes detected in @immutable structures in $file"
                echo "$CHANGES"
                exit 1
              fi
            fi
          done
          echo "No immutable/append_only structure violations found"

  zk-tests:
    name: ZK / Shielded tests
    if: ${{ inputs.zk-changed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Strip cdylib crate-types (incompatible with static rocksdb)
        run: |
          sed -i 's/\["cdylib", "rlib"\]/["rlib"]/' packages/rs-sdk/Cargo.toml packages/wasm-drive-verify/Cargo.toml
          sed -i 's/\["cdylib", "lib"\]/["lib"]/' packages/wasm-dpp2/Cargo.toml
          sed -i 's/\["cdylib"\]/["rlib"]/' packages/wasm-sdk/Cargo.toml
          sed -i 's/\["staticlib", "cdylib", "rlib"\]/["staticlib", "rlib"]/g' packages/rs-sdk-ffi/Cargo.toml packages/rs-platform-wallet-ffi/Cargo.toml

      - name: Setup Rust
        uses: ./.github/actions/rust

      - name: Setup sccache
        uses: ./.github/actions/sccache
        with:
          bucket: ${{ vars.CACHE_S3_BUCKET }}
          region: ${{ vars.CACHE_REGION }}
          endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          access_key_id: ${{ secrets.CACHE_KEY_ID }}
          secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}

      - name: Install librocksdb
        uses: ./.github/actions/librocksdb

      - uses: taiki-e/install-action@cargo-nextest

      - name: Run ZK / Shielded tests
        run: |
          cargo nextest run \
            --package dpp \
            --package drive-abci \
            --package drive \
            --all-features \
            --locked \
            -E 'test(/shield/)'
        env:
          RUST_MIN_STACK: 4194304
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
          SCCACHE_S3_KEY_PREFIX: ${{ runner.os }}/sccache/${{ runner.arch }}/linux-gnu
          ROCKSDB_STATIC: "/opt/rocksdb/usr/local/lib/librocksdb.a"
          ROCKSDB_LIB_DIR: "/opt/rocksdb/usr/local/lib"
          SNAPPY_STATIC: "/usr/lib/x86_64-linux-gnu/libsnappy.a"
          SNAPPY_LIB_DIR: "/usr/lib/x86_64-linux-gnu"
