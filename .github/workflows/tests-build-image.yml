on:
  workflow_call:
    inputs:
      name:
        type: string
        description: Name
        required: true
      image_name:
        type: string
        description: Image name
        required: true
      target:
        type: string
        description: Image target
        required: true
      build_args:
        type: string
        description: Additional build arguments to pass to Docker build
        default: ""
      image_org:
        type: string
        description: Registry and namespace for CI images
        required: false
        default: ghcr.io/dashpay/platform-ci
      image_tag:
        type: string
        description: Primary image tag
        required: true
      branch_tag:
        type: string
        description: Optional branch-scoped image tag
        required: false
        default: ""
      publish:
        type: boolean
        description: Push built image tags to registry
        required: false
        default: true
      enabled:
        type: boolean
        description: Build image when true, otherwise skip
        required: false
        default: true
      checkout_ref:
        type: string
        description: Optional git ref to checkout
        required: false
        default: ""

jobs:
  build-image:
    name: Build ${{ inputs.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        if: inputs.enabled
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}

      - name: Login to GHCR
        if: inputs.enabled && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        if: inputs.enabled
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ inputs.image_org }}/${{ inputs.image_name }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.branch_tag }}" ]; then
            echo "${{ inputs.image_org }}/${{ inputs.image_name }}:${{ inputs.branch_tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.enabled
        uses: docker/setup-buildx-action@v3

      - name: Build and optionally push image
        if: inputs.enabled
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,scope=${{ inputs.image_name }},mode=max
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Skip image build for external fork pull request
        if: ${{ !inputs.enabled }}
        shell: bash
        run: |
          echo "Skipping image build in untrusted pull_request workflow."
