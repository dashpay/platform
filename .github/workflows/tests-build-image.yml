on:
  workflow_call:
    inputs:
      name:
        type: string
        description: Name
        required: true
      image_name:
        type: string
        description: Image name
        required: true
      target:
        type: string
        description: Image target
        required: true
      build_args:
        type: string
        description: Additional build arguments to pass to Docker build
        default: ""

jobs:
  build-image:
    name: Build ${{ inputs.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        id: registry
        uses: ./.github/actions/ghcr_login

      - name: Build and push by SHA
        uses: ./.github/actions/docker
        with:
          image_name: ${{ inputs.image_name }}
          image_org: ${{ steps.registry.outputs.image_org }}
          target: ${{ inputs.target }}
          platform: linux/amd64
          push_tags: true
          build_args: ${{ inputs.build_args }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          cache_region: ${{ vars.CACHE_REGION }}
          cache_bucket: ${{ vars.CACHE_S3_BUCKET }}
          cache_endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          cache_access_key_id: ${{ secrets.CACHE_KEY_ID }}
          cache_secret_access_key: ${{ secrets.CACHE_SECRET_KEY }}
          cache_to_name: ${{ github.event_name == 'push' && 'true' || 'false' }}
