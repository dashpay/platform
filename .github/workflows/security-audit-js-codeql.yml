name: "Security: JS CodeQL"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

jobs:
  build-js:
    name: Build JS packages
    secrets: inherit
    uses: ./.github/workflows/tests-build-js.yml

  js-codeql:
    name: JS code security audit
    needs: build-js
    secrets: inherit
    uses: ./.github/workflows/tests-codeql.yml
