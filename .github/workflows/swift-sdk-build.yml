name: Build and test Swift SDK (no warnings)

on:
  workflow_call:

jobs:
  swift-sdk-build:
    name: Swift SDK build + tests (warnings as errors)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean working directory while preserving Rust build cache
        run: |
          git reset --hard HEAD
          git clean -ffdx \
            -e target/ \
            -e target/**

      # Rust + Cargo cache to speed up FFI build
      - name: Set up Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Add iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Restore cached Protobuf (protoc)
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.HOME }}/.local/protoc-32.0/bin
            ${{ env.HOME }}/.local/protoc-32.0/include
          key: protoc/32.0/${{ runner.os }}/universal

      - name: Install Protobuf (protoc) if cache miss
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION=32.0
          OS=osx-universal_binary
          PROTOC_DIR="$HOME/.local/protoc-${VERSION}"
          mkdir -p "$PROTOC_DIR"
          curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
            -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${VERSION}/protoc-${VERSION}-${OS}.zip"
          unzip -o /tmp/protoc.zip -d "$PROTOC_DIR"

      - name: Save cached Protobuf (protoc)
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.HOME }}/.local/protoc-32.0/bin
            ${{ env.HOME }}/.local/protoc-32.0/include
          key: protoc/32.0/${{ runner.os }}/universal

      - name: Verify protoc and export env
        run: |
          set -euxo pipefail
          echo "$HOME/.local/protoc-32.0/bin" >> $GITHUB_PATH
          echo "PROTOC=$HOME/.local/protoc-32.0/bin/protoc" >> "$GITHUB_ENV"
          "$HOME/.local/protoc-32.0/bin/protoc" --version

      - name: Clean Xcode derived data and Swift package caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          rm -rf packages/swift-sdk/.build || true
          rm -rf packages/swift-sdk/SwiftExampleApp/.build || true

      - name: Build and test Swift SDK
        run: |
          bash packages/swift-sdk/run_tests.sh
