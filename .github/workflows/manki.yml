name: Manki
run-name: 'Manki ${{ inputs.event }}.${{ inputs.action }} on #${{ inputs.pr }} (${{ inputs.delivery_id }})'

on:
  workflow_dispatch:
    inputs:
      event: { type: string, required: true }
      action: { type: string, required: true }
      pr: { type: string, required: true }
      head_sha: { type: string, required: false }
      comment_id: { type: string, required: false }
      review_id: { type: string, required: false }
      delivery_id: { type: string, required: false }

permissions:
  contents: read          # read repo files and diffs
  pull-requests: read     # read only, the Manki App posts reviews and approvals
  issues: write           # post a note on the PR when the token service gives no token
  id-token: write         # OIDC token for GitHub App identity
  actions: read           # verify workflow run is legitimate
  checks: read            # read CI annotations as review evidence

jobs:
  review:
    timeout-minutes: 30
    runs-on: ${{ vars.MANKI_RUNNER || 'ms-a2' }}
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Manki Review
        uses: manki-review/manki@v7.7.4
        with:
          claude_code_oauth_token: ${{ secrets.MANKI_CLAUDE_CODE_OAUTH_TOKEN }}
          # The repository variable MANKI_OPENAI_LOGIN picks the OpenAI login: `subscription` uses the
          # ChatGPT login, anything else or unset the endpoint at MANKI_OPENAI_BASE_URL.
          openai_oauth_token: ${{ vars.MANKI_OPENAI_LOGIN == 'subscription' && secrets.MANKI_OPENAI_OAUTH_TOKEN || '' }}
          openai_api_key: ${{ secrets.MANKI_OPENAI_API_KEY }}
          openai_base_url: ${{ vars.MANKI_OPENAI_LOGIN != 'subscription' && secrets.MANKI_OPENAI_BASE_URL || '' }}
