name: Shared PR policy
on:
  workflow_call:
    inputs:
      engine_revision:
        description: Full commit SHA matching the reusable workflow reference
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: pr-review-policy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Validate engine revision and resolve target default branch
        id: target
        env:
          ENGINE_REVISION: ${{ inputs.engine_revision }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['ENGINE_REVISION']):
              raise ValueError('A pinned engine commit is required')
          repo = os.environ['TARGET_REPOSITORY']
          result = subprocess.run(['gh','api',f'repos/{repo}'],check=True,capture_output=True,text=True)
          branch = json.loads(result.stdout)['default_branch']
          if '\n' in branch or '\r' in branch:
              raise ValueError('Invalid branch name')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'branch={branch}\n')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dashpay/platform
          ref: ${{ inputs.engine_revision }}
          path: review-engine
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.target.outputs.branch }}
          path: review-target
          persist-credentials: false
      - name: Reconcile with repository-local credentials
        working-directory: review-engine
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_AUTOMATION_ENABLED: ${{ vars.PR_REVIEW_AUTOMATION_ENABLED }}
          PR_REVIEW_REPOSITORY_ROOT: ${{ github.workspace }}/review-target
        run: python3 -m scripts.pr_review.event >> "$GITHUB_STEP_SUMMARY"
