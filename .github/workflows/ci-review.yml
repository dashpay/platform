name: Request CI review

# Request CI oversight as soon as a PR is ready for review; never assign the
# implementation work to the reviewer. PR Hygiene keeps its approval gates,
# and the centrally generated, intentionally empty CODEOWNERS stays unchanged.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.repository == 'dashpay/platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute pull-request code with this write token.
      - name: Request ktechmidas review when CI infrastructure changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const reviewer = 'ktechmidas';
            const params = { ...context.repo, pull_number: context.issue.number };
            const { data: pr } = await github.rest.pulls.get(params);
            const requested = (reviewers) => reviewers.some(
              (user) => user.login.toLowerCase() === reviewer
            );
            // GitHub does not request reviews on drafts or from the PR author.
            if (pr.state !== 'open' || pr.draft ||
                pr.user.login.toLowerCase() === reviewer ||
                requested(pr.requested_reviewers)) {
              return;
            }

            const directories = [
              '.github/', '.cargo/', '.devcontainer/', 'ci/', 'scripts/',
              'packages/scripts/', 'packages/dapi-grpc/scripts/',
              'packages/swift-sdk/scripts/', 'packages/swift-sdk/SwiftExampleApp/Scripts/',
              'packages/wasm-dpp/scripts/',
              'packages/wasm-dpp2/scripts/', 'packages/wasm-drive-verify/scripts/',
              'packages/wasm-sdk/scripts/',
            ];
            const buildConfiguration = new Set([
              'Dockerfile', '.dockerignore', '.codecov.yml', '.coderabbit.yaml',
              '.pre-commit-config.yaml', '.yarnrc.yml', 'yarn.config.cjs',
              'rust-toolchain.toml', 'package.json', 'Cargo.toml',
              'packages/platform-test-suite/bin/test.sh',
            ]);
            const isCI = (path) => path && (
              directories.some((directory) => path.startsWith(directory)) ||
              buildConfiguration.has(path) ||
              // Package-level build, test, packaging and release entry points.
              /^packages\/[^/]+\/(?:build|setup_.*build|verify_build|run_(?:integration_)?tests|release|publish|pack)(?:[._-][^/]*)?\.sh$/.test(path)
            );

            // API pagination avoids the 300-file limit of Actions path filters.
            // Include the previous name so moving a file out of CI still routes.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...params, per_page: 100,
            });
            const incomplete = files.length < pr.changed_files;
            if (incomplete) {
              // GitHub caps this endpoint at 3,000 files. Route conservatively
              // rather than silently overlooking CI in an incomplete diff.
              core.warning('Incomplete PR file list; requesting CI review.');
            }
            if (!incomplete && !files.some(
              (file) => isCI(file.filename) || isCI(file.previous_filename)
            )) {
              core.info('No CI infrastructure changes.');
              return;
            }

            // Do not re-request a completed review of this same revision on
            // routine metadata edits. A new head or base retarget needs review.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...params, per_page: 100,
            });
            const baseChanged = Boolean(context.payload.changes?.base);
            if (!baseChanged && reviews.some((review) =>
              review.user?.login?.toLowerCase() === reviewer &&
              review.commit_id === pr.head.sha &&
              ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state)
            )) {
              core.info('CI reviewer has already reviewed this revision.');
              return;
            }

            // This adds a review request, preserving other reviewers and all
            // assignees. Never use the issue-assignment API for CI oversight.
            const { data: updated } = await github.rest.pulls.requestReviewers({
              ...params,
              reviewers: [reviewer],
            });
            if (!requested(updated.requested_reviewers)) {
              throw new Error('GitHub did not request review from ' + reviewer + '; check repository access.');
            }
            core.info('Requested CI review from ' + reviewer + '.');
