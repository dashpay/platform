compressionLevel: mixed

enableGlobalCache: false

npmAuditExcludePackages:
  - rimraf
  - glob
  - inflight
  - braces
  - "@grpc/grpc-js"
  - "@humanwhocodes/config-array"
  - "@humanwhocodes/object-schema"
  - micromatch
  - eslint
  - memdown
  - levelup
  - deferred-leveldown
  - abstract-leveldown
  - level-errors
  - level-concat-iterator
  - lodash.get

npmPublishRegistry: "https://registry.npmjs.org"

packageExtensions:
  "@dashevo/protobufjs@*":
    dependencies:
      chalk: ^3.0.0
      escodegen: ^2.0.0
      espree: ^9.1.0
      estraverse: ^5.3.0
      glob: ^7.2.0
      minimist: ^1.2.5
      semver: ^7.3.5
      uglify-js: ^3.14.4
  "@protobufjs/inquire@*":
    dependencies:
      long: ^5.2.0
  eslint-module-utils@*:
    dependencies:
      eslint-import-resolver-node: ^0.3.6
  karma-mocha@*:
    dependencies:
      mocha: ^11.1.0
  ts-node@*:
    dependencies:
      typescript: ^3.9.5

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-outdated.cjs
    spec: "https://mskelton.dev/yarn-outdated/v2"

yarnPath: .yarn/releases/yarn-4.12.0.cjs
