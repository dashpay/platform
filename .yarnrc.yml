compressionLevel: mixed

enableGlobalCache: false

npmAuditExcludePackages:
  - rimraf # TODO: Update karma
  - glob # TODO: Update karma
  - inflight # TODO: Update karma
  - braces # TODO: Update karma
  - "@humanwhocodes/config-array" # TODO: Update eslint
  - "@humanwhocodes/object-schema" # TODO: Update eslint
  - eslint # TODO: Update eslint https://github.com/dashpay/platform/issues/2212
  - memdown # TODO: Update leveldb
  - levelup # TODO: Update leveldb
  - deferred-leveldown # TODO: Update leveldb
  - abstract-leveldown # TODO: Update leveldb
  - level-errors # TODO: Update leveldb
  - level-concat-iterator # TODO: Update leveldb
  - lodash.get # TODO: Deprecated. Replace to ?. operator. Update sinon
  - elliptic # TODO: Update dashcore-lib dependency when patched version is available
  - ajv # TODO: eslint depends on ajv@^6.12.4 (vuln < 6.14.0), no fix until eslint drops ajv@6 https://github.com/advisories/GHSA-2g4f-4pwh-qvx6
  - bn.js # TODO: Update dashcore-lib dependency when patched version is available https://github.com/advisories/GHSA-378v-28hj-76wf
  - minimatch # TODO: Update @oclif/core, karma-webpack, mocha https://github.com/advisories/GHSA-3ppc-4f35-3m26

npmAuditIgnoreAdvisories:
  - "1240912" # node-forge https://github.com/advisories/GHSA-86w9-cpqp-85rv has no patched release. Dashmate only generates keys and signs CSRs and certificates with node-forge; it verifies signatures with node:crypto X509Certificate
  - "crypto-js (deprecation)" # TODO: Replace crypto-js in wallet-lib account encrypt/decrypt (unmaintained, no advisory)
  - "tsconfck (deprecation)" # TODO: Update @oclif/core to v4 in dashmate, which drops tsconfck (unmaintained, no advisory)

npmPublishRegistry: "https://registry.npmjs.org"

packageExtensions:
  "@dashevo/protobufjs@*":
    dependencies:
      chalk: ^3.0.0
      escodegen: ^2.0.0
      espree: ^9.1.0
      estraverse: ^5.3.0
      glob: ^7.2.0
      minimist: ^1.2.5
      semver: ^7.3.5
      uglify-js: ^3.14.4
  "@protobufjs/inquire@*":
    dependencies:
      long: ^5.2.0
  eslint-module-utils@*:
    dependencies:
      eslint-import-resolver-node: ^0.3.6
  karma-mocha@*:
    dependencies:
      mocha: ^11.1.0
  ts-node@*:
    dependencies:
      typescript: ^3.9.5

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-outdated.cjs
    spec: "https://mskelton.dev/yarn-outdated/v2"

yarnPath: .yarn/releases/yarn-4.12.0.cjs
