# Configuration for typos spell checker
# https://github.com/crate-ci/typos

[default.extend-words]
# Blockchain/crypto terms that are not typos
datas = "datas"

[files]
extend-exclude = [
    "*.lock",
    "*.min.js",
    "node_modules/",
    "target/",
    ".yarn/",
    "packages/wasm-dpp/wasm/*",
    "packages/wasm-sdk/wasm/*",
]
