[package]
name = "platform-wallet"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Platform wallet with identity management support"

[dependencies]
# Dash Platform packages
dpp = { path = "../rs-dpp" }


# Core dependencies
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "4d2a70182276d8bf4b085ec7c0d6a0b7f9690cf3" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "4d2a70182276d8bf4b085ec7c0d6a0b7f9690cf3" }                          # Key wallet dependencies (from rust-dashcore)
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "4d2a70182276d8bf4b085ec7c0d6a0b7f9690cf3", optional = true }

# Standard dependencies
thiserror = "1.0"

# Collections
indexmap = "2.0"


[features]
default = ["bls", "eddsa", "manager"]
bls = ["key-wallet/bls"]
eddsa = ["key-wallet/eddsa"]
manager = ["key-wallet-manager"]
