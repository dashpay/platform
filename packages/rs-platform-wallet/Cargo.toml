[package]
name = "platform-wallet"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Platform wallet with identity management support"

[dependencies]
# Dash Platform packages
dpp = { path = "../rs-dpp" }


# Core dependencies
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "12ba186fd24a85fcb4736f0868b393f8a5b58c46" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "12ba186fd24a85fcb4736f0868b393f8a5b58c46" }                          # Key wallet dependencies (from rust-dashcore)
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "12ba186fd24a85fcb4736f0868b393f8a5b58c46", optional = true }

# Standard dependencies
thiserror = "1.0"

# Collections
indexmap = "2.0"


[features]
default = ["bls", "eddsa", "manager"]
bls = ["key-wallet/bls"]
eddsa = ["key-wallet/eddsa"]
manager = ["key-wallet-manager"]
