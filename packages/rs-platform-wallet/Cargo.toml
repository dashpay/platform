[package]
name = "platform-wallet"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Platform wallet with identity management support"

[dependencies]
# Dash Platform packages
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk", default-features = false, features = ["dashpay-contract", "dpns-contract", "wallet"] }
platform-encryption = { path = "../rs-platform-encryption" }

# Key wallet dependencies (from rust-dashcore)
key-wallet = { workspace = true }
key-wallet-manager = { workspace = true, features = [] }
dash-spv = { workspace = true }

# Core dependencies.
#
# `base64` is NOT among dashcore's default features (those are `secp-recovery`
# and `bincode`), but `MessageSignature::to_base64` / `from_base64` are gated on
# it — and base64 is the only wire form a classic Dash signed message has, the
# one CrowdNode and Dash Core's `verifymessage` RPC accept. `secp-recovery`
# arrives by default and carries `secp256k1/recovery`, which
# `RecoverableSignature` / `recover_ecdsa` need. See `wallet::core::sign_message`.
dashcore = { workspace = true, features = ["base64"] }

# Standard dependencies
thiserror = "1.0"
async-trait = "0.1"
arc-swap = "1"

# Collections
bimap = "0.6"
# `IndexMap` powers the insertion-ordered public outputs map on
# `PlatformAddressWallet::transfer` / `transfer_with_change_address`.
# Same crate that dpp and rs-sdk already vendor; pin a workspace-aligned
# minor that satisfies all in-tree requirements.
indexmap = "2.7"

# Async runtime
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = { version = "0.7.12" }
dash-async = { path = "../rs-dash-async" }

# Logging
tracing = "0.1"

# Encoding
hex = "0.4"
bs58 = "0.5"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
serde_json = "1.0"

# Image processing (DIP-15 avatar hash + fingerprint)
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Security
zeroize = "1"

# `log` facade. `changeset/core_bridge.rs` emits watermark-freeze breadcrumbs
# through `log` so they reach Android logcat (the JNI layer installs
# `android_logger` as the global `log` logger, tag `DashSDK`; the Kotlin SDK's
# only `tracing` subscriber writes to stdout, which Android discards).
# Declared here — deliberately NOT inside the `tracing` block above — so this
# crate owns the dependency independently of the encrypted-txMetadata change
# (#4277) that first introduced a `log` line: that change was reverted on
# v4.2-dev (#4279), and a `log` line living in that reverted region gets
# dropped by the 3-way merge, leaving the `log::` calls in core_bridge.rs
# undeclared (E0433). Keeping it in this untouched region makes it survive.
log = "0.4"

# Shielded pool (optional, behind `shielded` feature)
grovedb-commitment-tree = { git = "https://github.com/dashpay/grovedb", rev = "6c882c3ee7d2c331f1feda2eb4223add9a6f0e45", optional = true }
# Direct `rusqlite` access so `FileBackedShieldedStore::open_path` can set
# WAL + synchronous=NORMAL pragmas before handing the connection to
# `ClientPersistentCommitmentTree`. Version locked to match the rev grovedb
# is built against (its `Cargo.lock` resolves rusqlite at this major).
rusqlite = { version = "0.38", optional = true }
zip32 = { version = "0.2.0", default-features = false, optional = true }
# `StreamExt`/`pin_mut!` to consume the SDK's `sync_shielded_notes_stream`
# in the interleaved fetch/tree-append consumer (shielded sync only).
# Same version as `dash-sdk` so the lockfile resolves a single copy.
futures = { version = "0.3.30", optional = true }

# Networked, opt-in example binaries. Each one performs real network I/O
# against a live devnet, so they are examples (compiled, never run by
# `cargo test`) rather than `#[ignore]`d tests. They are crate-gated on the
# `shielded` feature (`#![cfg(feature = "shielded")]`), so `required-features`
# lets cargo skip building them entirely when the feature is off — otherwise
# the emptied file would have no `main`.
[[example]]
name = "shielded_sync"
required-features = ["shielded"]

[[example]]
name = "shielded_sync_paloma"
required-features = ["shielded"]

[[example]]
name = "shielded_chunk_timing_bench"
required-features = ["shielded"]

[dev-dependencies]
# In-process Signer<IdentityPublicKey> for the manual testnet
# verification example (`examples/dpns_marketplace_testnet.rs`) and the
# `tests/e2e/` harness's signer (`derive`).
simple-signer = { path = "../simple-signer", features = ["state-transitions", "derive"] }
# Used by `examples/shielded_chunk_timing_bench.rs` and
# `tests/shielded_decrypt_bench.rs` to assemble per-chunk wire
# fixtures and decode the `ShieldedEncryptedNote` wire type.
drive-proof-verifier = { path = "../rs-drive-proof-verifier" }
# `test-utils` exposes key-wallet's `TestWalletContext` + `Address::dummy`
# (via `dashcore/test-utils`) for building funded, signable test wallets.
# `keep-finalized-transactions` retains finalized txs in RAM, which the
# in-memory test runs (NoPlatformPersistence) require.
# Dev-only, so the production build stays on the leaner default features.
key-wallet = { workspace = true, features = ["test-utils", "keep-finalized-transactions"] }
rand = "0.8"
# Drives the parallel decrypt benchmark in `shielded_decrypt_bench.rs`.
rayon = "1.10"
# Used by `shielded_tree_append_bench.rs` to open SQLite with tuned PRAGMAs
# (WAL vs DELETE, sync mode) — confirms whether journal mode is what's
# making the simulator path so slow.
rusqlite = "0.38"
static_assertions = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `test-util` brings `tokio::time::pause` / `tokio::test(start_paused = true)`
# so the time-driven retry logic in `submit_with_cl_height_retry` can be
# tested deterministically without sleeping wall-clock seconds.
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "test-util"] }
# Re-enable the SDK with mocks feature for test-only mock builders;
# the non-test build keeps the leaner default-feature SDK above.
dash-sdk = { path = "../rs-sdk", default-features = false, features = ["dashpay-contract", "dpns-contract", "wallet", "mocks"] }

# E2E test framework — see `tests/e2e/` for the integration harness
# that exercises the wallet → SDK → broadcast pipeline against a
# live testnet bank wallet. Pinned to the canonical published crate
# names; cargo normalizes dash/underscore in keys but the published
# name is the source of truth (e.g. `tokio-shared-rt`).
tokio-shared-rt = "0.1"
# `stack_size` attribute macro: runs a test body on a std::thread with an
# explicit stack, sidestepping the ~2MB libtest thread stack that deep SDK
# GroveDB proof-verification recursion overflows (tk_001). Path dep to the
# workspace member, mirroring rs-drive-abci's dev-dep on the same crate.
dash-platform-macros = { path = "../rs-dash-platform-macros" }
tempfile = "3"
dotenvy = "0.15"
bip39 = "2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
# `dash-async::block_on` is the runtime-flavor-agnostic bridge used by
# `framework/context_provider.rs` to call `SpvRuntime`'s async API
# from the synchronous `ContextProvider` trait. Handles all three
# tokio runtime scenarios (no runtime, current-thread, multi-thread)
# without the `block_in_place` panic that `tokio::task::block_in_place`
# triggers on a current-thread runtime.
dash-async = { path = "../rs-dash-async" }
# `rt` feature gives us `CancellationToken` for the panic-hook +
# graceful-shutdown wiring described in the e2e plan.
tokio-util = { version = "0.7", features = ["rt"] }
# `TrustedHttpContextProvider` is the e2e harness's current default
# context provider. It backs `Sdk::set_context_provider` with the
# operator-trusted Quorum HTTP endpoint built into the crate (per
# network) so testnet / mainnet runs work without spinning up an
# SPV client. The SPV-backed provider lives in `framework/spv.rs`
# and `framework/context_provider.rs` and is currently disabled
# (see harness.rs) — re-enable when SPV cold-start is stable
# (Task #15). Also used by `examples/shielded_sync_paloma.rs` to run
# against a remote devnet without a reachable Core RPC.
rs-sdk-trusted-context-provider = { path = "../rs-sdk-trusted-context-provider", features = ["dpns-contract"] }
# `keep-finalized-transactions` retains finalized txs in RAM for the
# in-memory test runs (NoPlatformPersistence); dev-only, so production
# builds pay no memory overhead.
key-wallet-manager = { workspace = true, features = ["keep-finalized-transactions"] }

[features]
default = ["bls", "eddsa"]
bls = ["key-wallet/bls", "key-wallet-manager/bls"]
eddsa = ["key-wallet/eddsa", "key-wallet-manager/eddsa"]
shielded = ["dep:grovedb-commitment-tree", "dep:rusqlite", "dep:zip32", "dep:futures", "dash-sdk/shielded", "dpp/shielded-client"]
# Opt-in gate for the live integration suite under `tests/e2e/`. Off by
# default so a stock `cargo test` (and workspace CI) never compiles or
# runs the network-dependent harness. Pulls in `shielded` so an e2e run
# exercises the shielded-pool cases too. Run with:
# `cargo test -p platform-wallet --test e2e --features e2e`.
e2e = ["shielded", "test-utils"]
# Test-only seams that expose internal shielded spend-assembly
# (extract-spends, note reservation, build-against-a-chosen-note, and an
# asset-lock one-time-key derivation helper) for the adversarial e2e
# cases. NOT in `default`; pulled in by `e2e`. Never enable in production
# builds — these bypass the wallet's spend guards by design. Also
# forwards to key-wallet's own `test-utils` (`TestWalletContext` +
# `Address::dummy`) so downstream crates that only need dummy-wallet
# fixtures can pull them in via this single flag without opting into
# `shielded` directly.
test-utils = ["shielded", "key-wallet/test-utils"]
# Opt-in serde derives on the changeset types in `src/changeset/` plus
# the per-identity / DashPay scalar types those changesets carry.
# Activates `key-wallet/serde` (which transitively activates
# `dashcore/serde` and `dash-network/serde`) so every leaf type in a
# changeset payload — `TransactionRecord`, `Utxo`, `InstantLock`,
# `AccountType`, `AddressInfo`, `ExtendedPubKey`, `Network` — has a
# working `serde::Serialize`/`Deserialize` impl. `dpp` derives serde
# unconditionally; `key-wallet-manager/serde` covers `DerivedAddress`
# and friends; `dash-sdk/serde` surfaces serde on SDK-owned types
# reachable from changeset payloads.
serde = [
    "dep:serde",
    "key-wallet/serde",
    "key-wallet-manager/serde",
    "dash-sdk/serde",
]
# Forward to the upstream `key-wallet` / `key-wallet-manager`
# `keep-finalized-transactions` feature. With it OFF (the default),
# chainlocked transactions are evicted from the in-memory
# `transactions` map and only their txids are kept (in
# `finalized_txids`) for dedup; tx history is delivered through the
# event channel. Turn ON to keep the full `TransactionRecord` for
# finalized transactions in memory for the wallet's lifetime — useful
# for debug surfaces that page through history.
keep-finalized-transactions = [
    "key-wallet/keep-finalized-transactions",
    "key-wallet-manager/keep-finalized-transactions",
]

# Live integration suite. `required-features` keeps the harness out of a
# stock `cargo test` build entirely — it compiles and runs only under
# `--features e2e`. This replaces the former per-test `#[ignore]` gating.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]
