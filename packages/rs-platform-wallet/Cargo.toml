[package]
name = "platform-wallet"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Platform wallet with identity management support"

[dependencies]
# Dash Platform packages
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk", default-features = false, features = ["dashpay-contract", "dpns-contract"] }
platform-encryption = { path = "../rs-platform-encryption" }

# Key wallet dependencies (from rust-dashcore)
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "3202614f145b847c5cf9aeecf76139c21ce04e9b" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "3202614f145b847c5cf9aeecf76139c21ce04e9b", optional = true }

# Core dependencies
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "3202614f145b847c5cf9aeecf76139c21ce04e9b" }

# Standard dependencies
thiserror = "1.0"
async-trait = "0.1"

# Collections
indexmap = "2.0"

[dev-dependencies]
rand = "0.8"


[features]
default = ["bls", "eddsa", "manager"]
bls = ["key-wallet/bls"]
eddsa = ["key-wallet/eddsa"]
manager = ["key-wallet-manager"]
