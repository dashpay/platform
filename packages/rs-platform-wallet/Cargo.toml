[package]
name = "platform-wallet"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Platform wallet with identity management support"

[dependencies]
# Dash Platform packages
dpp = { path = "../rs-dpp" }

# Key wallet dependencies (from rust-dashcore)
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "56e802189ef6c7169fd635190ee382b94cc89870" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "56e802189ef6c7169fd635190ee382b94cc89870", optional = true }

# Core dependencies
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "56e802189ef6c7169fd635190ee382b94cc89870" }

# Standard dependencies
thiserror = "1.0"

# Collections
indexmap = "2.0"


[features]
default = ["bls", "eddsa", "manager"]
bls = ["key-wallet/bls"]
eddsa = ["key-wallet/eddsa"]
manager = ["key-wallet-manager"]
