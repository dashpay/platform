[package]
name = "platform-encryption"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Cryptographic utilities for Dash Platform (DIP-15 DashPay encryption)"

[dependencies]
# Cryptography — direct deps only, so a consumer that needs just this crate
# doesn't pull in/compile all of dashcore. `secp256k1` is pinned to the same
# 0.33 dashcore re-exports, so the public `SecretKey`/`PublicKey` types unify
# with dashcore-typed callers (platform-wallet, rs-sdk-ffi).
secp256k1 = { version = "0.33.1", features = ["std", "recovery"] }
aes = "0.8"
cbc = "0.1"
# The envelope supplies its own seed and nonces, so no `getrandom`: standalone wasm32 builds
# without a JavaScript randomness backend still compile.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
# Tests generate keypairs via secp256k1's RNG helpers (`generate_keypair`,
# `secp256k1::rand`), gated behind the `rand` feature.
secp256k1 = { version = "0.33.1", features = ["std", "rand", "recovery"] }
