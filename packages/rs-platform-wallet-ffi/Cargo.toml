[package]
name = "platform-wallet-ffi"
version = "2.1.1"
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "C FFI bindings for platform-wallet"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
platform-wallet = { path = "../rs-platform-wallet" }
dpp = { path = "../rs-dpp" }

# FFI utilities
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["send_guard"] }
lazy_static = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Core dependencies (for Network type)
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "2bd764fdc071828939d9dc8dd872c39bae906b04" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "2bd764fdc071828939d9dc8dd872c39bae906b04" }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
mocks = []
