[package]
name = "platform-wallet-ffi"
version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "C FFI bindings for platform-wallet"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
platform-wallet = { path = "../rs-platform-wallet" }
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk", features = ["wallet"] }
# Needed for `SignerHandle` + `VTableSigner` so the `*_with_signer`
# entry points can accept iOS-side keychain-backed signers without
# duplicating the vtable plumbing. See `signer.rs` in rs-sdk-ffi.
rs-sdk-ffi = { path = "../rs-sdk-ffi" }

# FFI utilities
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["send_guard"] }
lazy_static = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-metrics = { workspace = true, optional = true }

# Core dependencies (for Network type)
dashcore = { workspace = true }
key-wallet = { workspace = true, features = ["bincode"] }
dash-network = { workspace = true, features = ["ffi"] }

# For the glue impl of platform-wallet's async `DrainCryptoProvider` trait over
# the resolver-backed signer (deferred-crypto drain FFI).
async-trait = "0.1"

# Bincode used to serialize RootExtendedPubKey / ExtendedPubKey across
# FFI for watch-only restore. Same version pinned elsewhere in workspace.
bincode = { version = "=2.0.1" }

# Hex used for error diagnostics that include a wallet_id.
hex = "0.4"

# Persistence loader emits structured warnings for skipped /
# corrupt rows so operators can detect snapshot drift without a
# native debugger attached.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# anyhow surfaces from `KeyType::try_from` / `Purpose::try_from`
# / `SecurityLevel::try_from` in dpp; we need the From impl in
# `error.rs` so `unwrap_result_or_return!` can absorb it.
anyhow = { version = "1.0.81" }

# Used by group-action queries to build the JSON response shape that
# Swift decodes via Codable. See `tokens/group_queries.rs`.
serde_json = "1.0"
bs58 = "0.5"

# Zeroize intermediate key material crossing the FFI boundary.
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
dpp = { path = "../rs-dpp", features = ["fixtures-and-mocks"] }
# Re-enable dash-sdk's `mocks` feature for tests so the coordinator
# lifecycle tests can build a manager over `SdkBuilder::new_mock()`.
# Dev-only: the production cdylib/staticlib build never pulls it in.
dash-sdk = { path = "../rs-sdk", features = ["wallet", "mocks"] }

[build-dependencies]
cbindgen = "0.27"

[features]
default = []
mocks = []
tokio-metrics = ["dep:tokio-metrics", "tokio/time"]
# Opt-in Orchard / shielded support. Pulls in the heavy
# `grovedb-commitment-tree` + `zip32` dependencies via
# `platform-wallet/shielded`. Builds that don't enable this feature
# omit every `shielded_*` FFI symbol cleanly.
shielded = ["platform-wallet/shielded"]
