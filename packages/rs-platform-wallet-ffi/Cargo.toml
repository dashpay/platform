[package]
name = "platform-wallet-ffi"
version = "2.1.1"
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "C FFI bindings for platform-wallet"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
platform-wallet = { path = "../rs-platform-wallet", features = ["bincode"] }
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk" }

# SDK FFI - we re-export everything from rs-sdk-ffi for unified library
rs-sdk-ffi = { path = "../rs-sdk-ffi" }

# FFI utilities
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["send_guard"] }
lazy_static = "1.4"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "=2.0.0-rc.3" }

# Core dependencies (for Network type)
dashcore = { path = "../../../rust-dashcore/dash" }
key-wallet = { path = "../../../rust-dashcore/key-wallet" }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
mocks = []
