[package]
name = "platform-wallet-ffi"
version = "2.1.1"
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "C FFI bindings for platform-wallet"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
platform-wallet = { path = "../rs-platform-wallet" }
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk" }

# FFI utilities
once_cell = "1.19"
parking_lot = { version = "0.12", features = ["send_guard"] }
lazy_static = "1.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

# Core dependencies (for Network type)
dashcore = { workspace = true }
key-wallet = { workspace = true, features = ["bincode"] }

# Bincode used to serialize RootExtendedPubKey / ExtendedPubKey across
# FFI for watch-only restore. Same version pinned elsewhere in workspace.
bincode = { version = "=2.0.1" }

# Hex used for error diagnostics that include a wallet_id.
hex = "0.4"

# Zeroize intermediate key material crossing the FFI boundary.
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
dpp = { path = "../rs-dpp", features = ["fixtures-and-mocks"] }

[features]
default = []
mocks = []
