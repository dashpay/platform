[package]
name = "platform-tools"
version = "0.1.0"
edition = "2021"
default-run = "rocksdb-dump"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
dpp = { path = "../rs-dpp", default-features = false, features = ["abci"] }
drive-abci = { path = "../rs-drive-abci" }
dotenvy = "0.15.7"
envy = "0.4.2"
hex = "0.4.3"
ron = "0.12"
rocksdb = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0" }
tenderdash-abci = { git = "https://github.com/dashpay/rs-tenderdash-abci", tag = "v1.5.0-dev.2", features = [
    "grpc",
    "serde",
] }
textwrap = "0.16"
tracing-subscriber = { version = "0.3.16", default-features = false, features = [
    "env-filter",
    "ansi",
    "fmt",
    "std",
    "registry",
    "tracing-log",
] }
tracing = "0.1"

[[bin]]
name = "rocksdb-dump"
path = "src/bin/rocksdb_dump.rs"

[[bin]]
name = "prepare_proposal_apphash"
path = "src/bin/prepare_proposal_apphash.rs"
