[package]
name = "platform-wallet-storage-v019-codec"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Frozen V019 wallet record decoder for the V020 migration"

# These are historical wire-format dependencies, not runtime dependencies.
# Never replace them with workspace inheritance or advance their revisions.
[dependencies]
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "aca020263990a86a15cc1d97ae2cbf965d488db5", default-features = false, features = ["serde"] }
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "aca020263990a86a15cc1d97ae2cbf965d488db5", features = ["serde"] }
bincode = { package = "grovedb-bincode", version = "=2.1.0", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
