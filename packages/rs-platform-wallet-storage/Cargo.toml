[package]
name = "platform-wallet-storage"
version.workspace = true
rust-version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Storage backends for platform-wallet: SQLite persistence (today) and a future SecretStore submodule"

[lib]
path = "src/lib.rs"

[[bin]]
name = "platform-wallet-storage"
path = "src/bin/platform-wallet-storage.rs"
required-features = ["cli"]

[dependencies]
# Truly cross-cutting deps (always on regardless of features).
thiserror = "1"
tracing = "0.1"
hex = "0.4"

# SQLite-backed persister deps (gated by the `sqlite` feature).
# `platform-wallet` types are reachable through the `sqlite` submodule
# only; without the feature the bare crate ships no items that mention
# them, so the wallet/serde graph stays out of the build (CODE-020).
# `dpp` types reach the persister via `IdentityPublicKey` (identity_keys
# writer), `AssetLockProof` (asset_locks writer) and `Identifier`
# (dashpay writer). `dash-sdk` is here for the `AddressFunds` re-export
# in `schema/platform_addrs.rs`. Feature set mirrors sibling
# `rs-platform-wallet` so the resolver picks identical hashes.
platform-wallet = { path = "../rs-platform-wallet", features = [
    "serde",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
key-wallet = { workspace = true, optional = true }
dashcore = { workspace = true, optional = true }
dpp = { path = "../rs-dpp", optional = true }
dash-sdk = { path = "../rs-sdk", default-features = false, features = [
    "dashpay-contract",
    "dpns-contract",
], optional = true }
rusqlite = { version = "0.38", features = [
    "bundled",
    "backup",
    "blob",
    "hooks",
    "trace",
], optional = true }
refinery = { version = "0.9", default-features = false, features = [
    "rusqlite",
], optional = true }
# bincode 2 is required directly: we encode `dpp::IdentityPublicKey`
# (which derives bincode 2 `Encode`/`Decode`) and decode
# `dpp::AssetLockProof` from the asset-lock blob column.
bincode = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }
sha2 = { version = "0.10", optional = true }

# CLI deps (gated by the `cli` feature)
clap = { version = "4", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
predicates = "3"
static_assertions = "1"
filetime = "0.2"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = "3"
platform-wallet-storage = { path = ".", features = ["sqlite", "cli", "kv", "__test-helpers"] }
# `round_trip_consumer.rs` constructs a real `PlatformWalletManager`
# (consumer) against a real `SqlitePersister` (this crate's impl) so
# every consumer↔persister contract drift becomes a CI failure (CODE-008
# / T-024). The manager needs `dash-sdk::SdkBuilder::new_mock().build()`
# (gated behind `mocks`) and `platform-wallet` requires `wallet` on the
# SDK transitively. Tokio is needed directly so `#[tokio::test]`
# resolves the macro by name.
dash-sdk = { path = "../rs-sdk", default-features = false, features = [
    "dashpay-contract",
    "dpns-contract",
    "wallet",
    "mocks",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["sqlite", "cli", "kv"]
# SQLite-backed persister (`platform_wallet_storage::sqlite`).
sqlite = [
    "dep:platform-wallet",
    "dep:serde",
    "dep:key-wallet",
    "dep:dashcore",
    "dep:dpp",
    "dep:dash-sdk",
    "dep:rusqlite",
    "dep:refinery",
    "dep:bincode",
    "dep:tempfile",
    "dep:chrono",
    "dep:sha2",
]
# Maintenance CLI binary. Requires `sqlite` because the only subcommands
# in scope today operate on the SQLite persister.
cli = [
    "sqlite",
    "dep:clap",
    "dep:humantime",
    "dep:serde_json",
    "dep:tracing-subscriber",
]
# Future `SecretStore` submodule. Slot is reserved; the module is not
# implemented in this build — enabling the feature today is a no-op
# beyond a `// pub mod secrets;` marker in `src/lib.rs`.
secrets = []
# Generic key/value store API (`platform_wallet_storage::KvStore`,
# `KvError`) plus the SQLite-backed impl. Requires `sqlite` because
# the only shipped backend is on `SqlitePersister`. The underlying
# `kv_store` table is always created by V001 so DB files stay
# interoperable across feature combos; this gate only controls the
# Rust API surface.
kv = ["sqlite"]
# Exposes `lock_conn_for_test` / `config_for_test` accessors on
# `SqlitePersister` so this crate's own integration tests can probe
# the write connection. The double-underscore prefix follows Cargo's
# convention for "MUST NOT enable from downstream" features
# (https://doc.rust-lang.org/cargo/reference/features.html#feature-resolver-version-2).
__test-helpers = ["sqlite"]
