[package]
name = "platform-wallet-storage"
version.workspace = true
rust-version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "Storage backends for platform-wallet: SQLite persistence and keyring_core secret backends (encrypted-file + OS keyring)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "platform-wallet-storage"
path = "src/bin/platform-wallet-storage.rs"
required-features = ["cli"]

[dependencies]
# Cross-cutting deps (always on)
platform-wallet = { path = "../rs-platform-wallet", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
hex = "0.4"

# SQLite-backed persister deps (gated by the `sqlite` feature).
# `dpp` types reach the persister via `IdentityPublicKey` (identity_keys
# writer), `AssetLockProof` (asset_locks writer) and `Identifier`
# (dashpay writer). `dash-sdk` is here for the `AddressFunds` re-export
# in `schema/platform_addrs.rs`. Feature set mirrors sibling
# `rs-platform-wallet` so the resolver picks identical hashes.
key-wallet = { workspace = true, optional = true }
key-wallet-manager = { workspace = true, optional = true }
dashcore = { workspace = true, optional = true }
dpp = { path = "../rs-dpp", optional = true }
dash-sdk = { path = "../rs-sdk", default-features = false, features = [
    "dashpay-contract",
    "dpns-contract",
], optional = true }
rusqlite = { version = "0.38", features = [
    "bundled",
    "backup",
    "blob",
    "hooks",
    "trace",
], optional = true }
refinery = { version = "0.9", default-features = false, features = [
    "rusqlite",
], optional = true }
barrel = { version = "0.7", features = ["sqlite3"], optional = true }
# bincode 2 is required directly: we encode `dpp::IdentityPublicKey`
# (which derives bincode 2 `Encode`/`Decode`) and decode
# `dpp::AssetLockProof` from the asset-lock blob column.
bincode = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }
sha2 = { version = "0.10", optional = true }

# Secret-storage deps (gated by the `secrets` feature). RustSec-clean
# pins (Smythe §7); `aes-gcm` is deliberately omitted. `keyring`'s
# library is `keyring-core` + per-platform store crates (the `keyring`
# crate itself is sample/CLI). Verified to build under MSRV 1.92.
argon2 = { version = "=0.5.3", optional = true }
chacha20poly1305 = { version = "=0.10.1", optional = true }
zeroize = { version = "=1.8.2", features = ["derive"], optional = true }
subtle = { version = "=2.6.1", optional = true }
getrandom = { version = "0.2", optional = true }
region = { version = "=3.0.2", optional = true }
keyring-core = { version = "=1.0.0", optional = true }

# CLI deps (gated by the `cli` feature)
clap = { version = "4", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# Per-platform OS-keyring credential stores. `keyring-core 1.0.0` is
# the API; these crates provide the platform backends (the `keyring`
# 4.x crate is the sample CLI and is intentionally not depended on).
# Gated by `secrets` via `dep:`. Target-specific tables MUST follow all
# `[dependencies]` entries.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
linux-keyutils-keyring-store = { version = "=1.0.0", optional = true }
dbus-secret-service-keyring-store = { version = "=1.0.0", features = [
    "crypto-rust",
    "vendored",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.0.0", optional = true }

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
predicates = "3"
static_assertions = "1"
filetime = "0.2"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = "3"
# `default-features = false` so the off-state CI invocation
# (`--no-default-features --features sqlite,cli`) actually exercises a
# build with `secrets` disabled — otherwise the dev-dep view would
# silently re-enable the default feature set for every integration test.
platform-wallet-storage = { path = ".", default-features = false, features = ["__test-helpers"] }
tempfile = "3"

[features]
default = ["sqlite", "cli", "secrets"]
# SQLite-backed persister (`platform_wallet_storage::sqlite`).
sqlite = [
    "dep:key-wallet",
    "dep:key-wallet-manager",
    "dep:dashcore",
    "dep:dpp",
    "dep:dash-sdk",
    "dep:rusqlite",
    "dep:refinery",
    "dep:barrel",
    "dep:bincode",
    "dep:fs2",
    "dep:tempfile",
    "dep:chrono",
    "dep:sha2",
]
# Maintenance CLI binary. Requires `sqlite` because the only subcommands
# in scope today operate on the SQLite persister.
cli = [
    "sqlite",
    "dep:clap",
    "dep:humantime",
    "dep:serde_json",
    "dep:tracing-subscriber",
]
# `secrets` submodule (`platform_wallet_storage::secrets`): zeroizing
# secret wrappers + EncryptedFile backend + OS-keyring construction
# helper, all built on the upstream `keyring_core::api` SPI. Default-on
# so `Cargo.lock` unconditionally pins the RustSec-clean crypto stack
# (SEC-REQ-4.7). Disable explicitly via `--no-default-features` to
# build the storage crate without the crypto graph.
secrets = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:serde_json",
    "dep:zeroize",
    "dep:subtle",
    "dep:getrandom",
    "dep:region",
    "dep:keyring-core",
    "dep:linux-keyutils-keyring-store",
    "dep:dbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]
# Exposes `secrets::MemoryCredentialStore` (in-RAM test double). Double-underscore
# prefix = Cargo's "MUST NOT enable from downstream" convention; keeps
# the test store unreachable from production builds (SEC-REQ-2.3.1).
__secrets-test-helpers = ["secrets"]
# Exposes `lock_conn_for_test` / `config_for_test` accessors on
# `SqlitePersister` so this crate's own integration tests can probe
# the write connection. The double-underscore prefix follows Cargo's
# convention for "MUST NOT enable from downstream" features
# (https://doc.rust-lang.org/cargo/reference/features.html#feature-resolver-version-2).
__test-helpers = ["sqlite"]
