[package]
name = "dash-context-provider"
version.workspace = true
edition = "2021"
authors = ["sam@dash.org"]
license = "MIT"
description = "Context provider traits for Dash Platform SDK"

[dependencies]
dash-async = { path = "../rs-dash-async" }
dpp = { path = "../rs-dpp", default-features = false }
drive = { path = "../rs-drive", default-features = false, features = [
    "verify",
] }
thiserror = "1.0"
hex = "0.4"
serde_json = { version = "1.0", optional = true }

[features]
mocks = ["serde_json", "dpp/serde-conversion"]
# Lets `LocalContextProvider::with_system_contracts` serve system data
# contracts. Each contract it serves must also be compiled into dpp, through
# the matching feature below or the embedder's own dpp features.
system-contracts = ["dpp/system_contracts"]
dpns-contract = ["system-contracts", "dpp/dpns-contract"]
dashpay-contract = ["system-contracts", "dpp/dashpay-contract"]
