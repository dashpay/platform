[package]
name = "dash-context-provider"
version.workspace = true
edition = "2021"
authors = ["sam@dash.org"]
license = "MIT"
description = "Context provider traits and quorum-source routing for Dash Platform SDK"

[dependencies]
arc-swap = "1.7.1"
dash-async = { path = "../rs-dash-async" }
dpp = { path = "../rs-dpp", default-features = false }
drive = { path = "../rs-drive", default-features = false, features = [
    "verify",
] }
thiserror = "1.0"
tracing = "0.1.41"
hex = "0.4"
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
mocks = ["serde_json", "dpp/serde-conversion"]
