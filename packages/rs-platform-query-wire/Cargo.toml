[package]
name = "platform-query-wire"
description = "Shared wire-request decoders mapping Dash Platform query protos onto drive query types, used by drive-abci and client-side proof verifiers"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"

[features]
# The `drive::query` types this crate decodes into are gated on either of
# drive's `server` / `verify` features, so exactly one must be on. `verify`
# is the default (the client-verifier cut); rs-drive-abci opts out of
# defaults and selects `server`, so the consensus binary gains no
# proof-verification code from this crate.
default = ["verify"]
server = ["drive/server"]
verify = ["drive/verify"]

[dependencies]
# `client` is what makes dapi-grpc emit the platform message types on
# native targets; no transport is pulled in without the `transport` feature.
dapi-grpc = { path = "../dapi-grpc", default-features = false, features = [
  "platform",
  "client",
] }
dpp = { path = "../rs-dpp", default-features = false }
drive = { path = "../rs-drive", default-features = false }
thiserror = "2.0.17"
