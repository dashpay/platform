[package]
name = "platform-wallet-sqlite"
version.workspace = true
rust-version.workspace = true
edition = "2021"
authors = ["Dash Core Team"]
license = "MIT"
description = "SQLite-backed PlatformWalletPersistence implementation with online backup, retention, and CLI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "platform-wallet-sqlite"
path = "src/bin/platform-wallet-sqlite.rs"
required-features = ["cli"]

[dependencies]
platform-wallet = { path = "../rs-platform-wallet" }
key-wallet = { workspace = true }
key-wallet-manager = { workspace = true }
dashcore = { workspace = true }
# `dpp` types reach the persister via `IdentityPublicKey` (identity_keys
# writer), `AssetLockProof` (asset_locks writer) and `Identifier`
# (dashpay writer). `dash-sdk` is here for the `AddressFunds` re-export
# in `schema/platform_addrs.rs`. Feature set mirrors sibling
# `rs-platform-wallet` so the resolver picks identical hashes.
dpp = { path = "../rs-dpp" }
dash-sdk = { path = "../rs-sdk", default-features = false, features = [
    "dashpay-contract",
    "dpns-contract",
] }
rusqlite = { version = "0.38", features = ["bundled", "backup", "blob", "hooks"] }
refinery = { version = "0.9", default-features = false, features = ["rusqlite"] }
barrel = { version = "0.7", features = ["sqlite3"] }
serde = { version = "1", features = ["derive"] }
# bincode 2 is required directly: we encode `dpp::IdentityPublicKey`
# (which derives bincode 2 `Encode`/`Decode`) and decode
# `dpp::AssetLockProof` from the asset-lock blob column. The
# `serde` feature is unused — drop it once a deeper audit confirms
# no transitive caller needs it.
bincode = "2"
thiserror = "1"
tracing = "0.1"
fs2 = "0.4"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
humantime = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
predicates = "3"
static_assertions = "1"
filetime = "0.2"
platform-wallet-sqlite = { path = ".", features = ["test-helpers"] }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]
# Exposes a `lock_conn_for_test` / `config_for_test` accessor on
# `SqlitePersister` so this crate's own integration tests can probe the
# write connection. Downstream code MUST NOT enable this feature.
test-helpers = []
