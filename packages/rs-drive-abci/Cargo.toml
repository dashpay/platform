[package]
name = "drive-abci"
version.workspace = true
authors = [
  "Samuel Westrich <sam@dash.org>",
  "Ivan Shumkov <ivan@shumkov.ru>",
  "Djavid Gabibiyan <djavid@dash.org>",
  "Lukasz Klimek <lukasz.klimek@dash.org>",
  "Igor Markin <igor.markin@dash.org>",
]
edition = "2021"
rust-version.workspace = true
license = "MIT"

[dependencies]
arc-swap = "1.7.0"
bincode = { version = "=2.0.1", features = ["serde"] }
ciborium = { version = "0.2.2" }
chrono = "0.4.35"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
drive = { path = "../rs-drive", default-features = false, features = [
  "server",
  "grovedb_operations_logging",
] }
thiserror = "1.0.64"
rand = "0.8.5"
tempfile = "3.3.0"
hex = "0.4.3"
indexmap = { version = "2.2.6", features = ["serde"] }
dpp = { path = "../rs-dpp", default-features = false, features = ["abci"] }
simple-signer = { path = "../simple-signer", features = ["state-transitions"] }
rust_decimal = "1.39.0"
rust_decimal_macros = "1.39.0"
mockall = { version = "0.13", optional = true }
prost = { version = "0.14", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = [] }
clap = { version = "4.4.10", features = ["derive"] }
envy = { version = "0.4.2" }
dotenvy = { version = "0.15.7" }
dapi-grpc = { path = "../dapi-grpc", default-features = false, features = [
  "server",
  "platform",
] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
  "env-filter",
  "ansi",
  "json",
  "fmt",
  "std",
  "registry",
  "tracing-log",
], optional = false }
tenderdash-abci = { git = "https://github.com/dashpay/rs-tenderdash-abci", tag = "v1.5.1", features = [
  "grpc",
] }
time = { version = "0.3", optional = true, features = [
  "macros",
  "formatting",
  "serde-human-readable",
] }

lazy_static = "1.4.0"
itertools = { version = "0.13" }
file-rotate = { version = "0.7.3" }
reopen = { version = "1.0.3" }
delegate = { version = "0.13" }
regex = { version = "1.8.1" }
metrics = { version = "0.24" }
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = [
  "http-listener",
] }
url = { version = "2.3.1" }
tokio = { version = "1.40", features = [
  "macros",
  "signal",
  "rt-multi-thread",
  "time",
] }
tokio-util = { version = "0.7" }
derive_more = { version = "1.0", features = ["from", "deref", "deref_mut"] }
async-trait = "0.1.77"
console-subscriber = { version = "0.4", optional = true }
bls-signatures = { git = "https://github.com/dashpay/bls-signatures", rev = "0842b17583888e8f46c252a4ee84cdfd58e0546f", optional = true }
grovedb-commitment-tree = { git = "https://github.com/dashpay/grovedb", rev = "6b34ea815e7937f5defc3dc94b7769971db2212f" }
nonempty = "0.11"
# Shielded-pool snapshot needs raw RocksDB SstFileWriter + ingest_external_file_cf
# bindings, and blake3 for the snapshot-file checksum.
rocksdb = { git = "https://github.com/QuantumExplorer/rust-rocksdb.git", rev = "52772eea7bcd214d1d07d80aa538b1d24e5015b7" }
blake3 = "1.5"

[dev-dependencies]
dash-platform-queries = { path = "../dash-platform-queries" }
platform-version = { path = "../rs-platform-version", features = [
  "mock-versions",
] }
dpp = { path = "../rs-dpp", default-features = false, features = [
  "abci",
  "random-documents",
  "state-transition-signing",
  "random-identities",
  "random-public-keys",
  "random-document-types",
  "fixtures-and-mocks",
  "json-conversion",
  "data-contract-cbor-conversion",
] }
drive = { path = "../rs-drive", features = ["fixtures-and-mocks"] }
drive-proof-verifier = { path = "../rs-drive-proof-verifier" }
strategy-tests = { path = "../strategy-tests" }
grovedb-commitment-tree = { git = "https://github.com/dashpay/grovedb", rev = "6b34ea815e7937f5defc3dc94b7769971db2212f", features = ["client"] }
assert_matches = "1.5.0"
drive-abci = { path = ".", features = ["testing-config", "mocks", "shielded_test_data"] }
bls-signatures = { git = "https://github.com/dashpay/bls-signatures", rev = "0842b17583888e8f46c252a4ee84cdfd58e0546f" }
mockall = { version = "0.13" }
dash-platform-macros = { path = "../rs-dash-platform-macros" }
libc = "0.2"

# For tests of grovedb verify
rocksdb = { git = "https://github.com/QuantumExplorer/rust-rocksdb.git", rev = "52772eea7bcd214d1d07d80aa538b1d24e5015b7" }
integer-encoding = { version = "4.0.0" }

# For dump_only_default_and_aux_cfs_under_shielded_subtree_prefix — same
# subtree-prefix algorithm grovedb uses internally.
grovedb-path = { git = "https://github.com/dashpay/grovedb", rev = "6b34ea815e7937f5defc3dc94b7769971db2212f" }
grovedb-storage = { git = "https://github.com/dashpay/grovedb", rev = "6b34ea815e7937f5defc3dc94b7769971db2212f" }

[features]
default = ["bls-signatures"]
mocks = ["mockall", "drive/fixtures-and-mocks", "bls-signatures"]
console = ["console-subscriber", "tokio/tracing"]
testing-config = []
# Compiles in the shielded-pool seeder, the `snapshot-bake` subcommand, and
# the bake/apply API used at devnet InitChain. Pulls `drive/shielded_test_data`
# (which forwards to `grovedb/unsafe-dump-load`) so the underlying snapshot
# primitives become available. Dockerfile turns this on when
# `SHIELDED_TEST_DATA=true`. The snapshot roundtrip test in this crate's own
# `#[cfg(test)]` module also requires it — the dev-dependency below enables
# it for `cargo test`.
shielded_test_data = ["drive/shielded_test_data"]
grovedbg = ["drive/grovedbg"]
# `abci-server replay` command
replay = ["dep:time", "tenderdash-abci/serde"]
# Long-running shielded strategy tests (ZK proof generation)
__shielded_strategy_tests = []
[[bin]]
name = "drive-abci"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(tokio_unstable)',
  'cfg(create_sdk_test_data)',
  'cfg(feature, values("__shielded_strategy_tests"))',
] }
