---

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "500m"
    max-file: "5"
    compress: "true"

services:
  gateway:
    depends_on:
      - drive_abci
      - gateway_rate_limiter

  gateway_rate_limiter:
    image: ${PLATFORM_GATEWAY_RATE_LIMITER_DOCKER_IMAGE:?err}
    labels:
      org.dashmate.service.title: "Gateway rate limiter"
    restart: unless-stopped
    logging: *default-logging
    command: /bin/ratelimit
    depends_on:
      - gateway_rate_limiter_redis
    networks:
      - gateway_rate_limiter
    volumes:
      - ${DASHMATE_HOME_DIR:?err}/${CONFIG_NAME:?err}/platform/gateway/rate_limiter/rate_limiter.yaml:/data/ratelimit/config/config.yaml:ro
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=text
      - BACKEND_TYPE=redis
      - REDIS_SOCKET_TYPE=tcp
      - REDIS_URL=gateway_rate_limiter_redis:6379
      - RUNTIME_ROOT=/data
      - RUNTIME_SUBDIRECTORY=ratelimit
      - RUNTIME_WATCH_ROOT=false
      - DISABLE_STATS=${PLATFORM_GATEWAY_RATE_LIMITER_METRICS_DISABLED:?err}
      - STATSD_HOST=gateway_rate_limiter_metrics
      - STATSD_PORT=9125
      - CONFIG_TYPE=FILE
      - GRPC_MAX_CONNECTION_AGE=1h
      - GRPC_MAX_CONNECTION_AGE_GRACE=10m
      - GRPC_PORT=8081
      # Emit RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset response
      # headers so rs-dapi-client can read the exact reset window and ban the
      # node for that duration instead of the exponential health-ban ladder.
      # Controlled by platform.gateway.rateLimiter.responseHeaders.enabled.
      - LIMIT_RESPONSE_HEADERS_ENABLED=${PLATFORM_GATEWAY_RATE_LIMITER_RESPONSE_HEADERS_ENABLED:?err}
    expose:
      - 8081
    profiles:
      - platform

  gateway_rate_limiter_redis:
    labels:
      org.dashmate.service.title: "Gateway rate limiter storage"
    restart: unless-stopped
    logging: *default-logging
    image: redis:alpine
    expose:
      - 6379
    networks:
      - gateway_rate_limiter
    profiles:
      - platform
