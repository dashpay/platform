[package]
name = "wasm-sdk"
version.workspace = true
edition = "2021"
publish = false
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = [
  "dpns-contract",
  "dashpay-contract",
  "wallet-utils-contract",
  "token-history-contract",
  "keywords-contract",
  "mocks",
]

mocks = ["dash-sdk/mocks"]

# All system contracts
all-system-contracts = [
  "dash-sdk/all-system-contracts",
  "rs-sdk-trusted-context-provider/all-system-contracts",
]

# Individual contract features
withdrawals-contract = [
  "dash-sdk/withdrawals-contract",
  "rs-sdk-trusted-context-provider/withdrawals-contract",
]
dpns-contract = [
  "dash-sdk/dpns-contract",
  "rs-sdk-trusted-context-provider/dpns-contract",
]
dashpay-contract = [
  "dash-sdk/dashpay-contract",
  "rs-sdk-trusted-context-provider/dashpay-contract",
]
wallet-utils-contract = [
  "dash-sdk/wallet-utils-contract",
  "rs-sdk-trusted-context-provider/wallet-utils-contract",
]
token-history-contract = [
  "dash-sdk/token-history-contract",
  "rs-sdk-trusted-context-provider/token-history-contract",
]
keywords-contract = [
  "dash-sdk/keywords-contract",
  "rs-sdk-trusted-context-provider/keywords-contract",
]

token_reward_explanations = ["dash-sdk/token_reward_explanations"]

[dependencies]
dash-sdk = { path = "../rs-sdk", features = [
  "serde",
  "core_key_wallet",
], default-features = false }
drive = { path = "../rs-drive", default-features = false, features = [
  "verify",
] }
console_error_panic_hook = { version = "0.1.6" }
thiserror = { version = "2.0.17" }
wasm-bindgen = { version = "=0.2.108" }
wasm-bindgen-futures = { version = "0.4.58" }
drive-proof-verifier = { path = "../rs-drive-proof-verifier", default-features = false } # TODO: I think it's not needed (LKl)
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
  "env-filter",
  "registry",
] }
tracing-wasm = { version = "0.2.1" }
platform-value = { path = "../rs-platform-value", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { git = "https://github.com/dashpay/serde-wasm-bindgen", branch = "fix/uint8array-to-bytes" }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
bip39 = { version = "2.0", features = ["rand", "all-languages"] }
rand = { version = "0.8", features = ["std"] }
rs-sdk-trusted-context-provider = { path = "../rs-sdk-trusted-context-provider" }
once_cell = "1.19"
js-sys = "0.3.64"
dapi-grpc = { path = "../dapi-grpc" }
rs-dapi-client = { path = "../rs-dapi-client" }
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
dpp-json-convertible-derive = { path = "../rs-dpp-json-convertible-derive" }
wasm-dpp2 = { path = "../wasm-dpp2" }

[dev-dependencies]
# Self-dependency to enable `mocks` for the lib under test. Do not add
# system-contract features here: Cargo unifies them into the tested lib, so
# `all-system-contracts` would let the trusted context resolve every contract
# and silently defeat the tests that assert an uncompiled one is fetched.
wasm-sdk = { path = ".", features = ["mocks"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
# wasm32-only test harness. Host tests cover every decision that can regress;
# this covers the one thing they cannot observe — that a wide integer group
# key really crosses as an exact JS BigInt. Run with:
#   CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
#     cargo test -p wasm-sdk --target wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.58"

[package.metadata.wasm-pack]
wasm-opt = false

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen-futures", "wasm-sdk"]
