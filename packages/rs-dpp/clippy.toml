# Consensus crates must not call libm-backed float methods: their results differ by
# architecture (musl aarch64 vs x86_64, via the platform C library) and split the app hash.
# Use the pinned `libm` crate via `DistributionFunction::evaluate`, or integer math.
# `sqrt` and `mul_add` are IEEE correctly-rounded and deliberately not listed.
#
# clippy reads the first clippy.toml found walking up from the crate directory and never
# merges, so this file is duplicated verbatim in rs-dpp, rs-drive and rs-drive-abci.
# Keep the three copies identical.
disallowed-methods = [
  { path = "f64::ln",     reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::log",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::log2",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::log10",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::ln_1p",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::exp",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::exp2",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::exp_m1", reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::powf",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::powi",   reason = "architecture-dependent on musl; use the libm crate or integer math" },
  { path = "f64::cbrt",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::hypot",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::sin",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::cos",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::tan",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::asin",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::acos",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::atan",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::atan2",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::sinh",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::cosh",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f64::tanh",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::ln",     reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::log",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::log2",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::log10",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::ln_1p",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::exp",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::exp2",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::exp_m1", reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::powf",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::powi",   reason = "architecture-dependent on musl; use the libm crate or integer math" },
  { path = "f32::cbrt",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::hypot",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::sin",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::cos",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::tan",    reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::asin",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::acos",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::atan",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::atan2",  reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::sinh",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::cosh",   reason = "architecture-dependent on musl; use the libm crate" },
  { path = "f32::tanh",   reason = "architecture-dependent on musl; use the libm crate" },
