[package]
name = "dpp"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = [
  "Anton Suprunchuk <anton.suprunchuk@gmail.com>",
  "Samuel Westrich <sam@dash.org>",
  "Ivan Shumkov <ivan@shumkov.ru>",
  "Djavid Gabibiyan <djavid@dash.org>",
  "Igor Markin <igor.markin@dash.org>",
]

[dependencies]
anyhow = { version = "1.0.81" }
async-trait = { version = "0.1.79" }
base64 = "0.22.1"
bech32 = "0.11"
bs58 = "0.5"
byteorder = { version = "1.4" }
chrono = { version = "0.4.35", default-features = false, features = [
  "wasmbind",
  "clock",
] }
chrono-tz = { version = "0.8", optional = true }
ciborium = { version = "0.2.2", optional = true }
dashcore = { workspace = true, features = [
  "secp-recovery",
  "rand",
  "signer",
  "serde",
  "eddsa",
], default-features = false }
key-wallet = { workspace = true, optional = true }
dash-spv = { workspace = true, optional = true }
dashcore-rpc = { workspace = true, optional = true }

env_logger = { version = "0.11" }
getrandom = { version = "0.2", features = ["js"] }

hex = { version = "0.4" }
integer-encoding = { version = "4.0.0" }
itertools = { version = "0.13" }
jsonschema = { git = "https://github.com/dashpay/jsonschema-rs", branch = "configure_regexp", default-features = false, features = [
  "draft202012",
], optional = true }
lazy_static = { version = "1.4" }
num_enum = "0.7"
bincode = { version = "=2.0.1", features = ["serde"] }
rand = { version = "0.8.5", features = ["small_rng"] }
regex = { version = "1.10.4" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_repr = { version = "0.1.7" }
sha2 = { version = "0.10" }
thiserror = { version = "2.0.17" }
data-contracts = { path = "../data-contracts", optional = true, default-features = false }
platform-value = { path = "../rs-platform-value" }
platform-version = { path = "../rs-platform-version" }
platform-versioning = { path = "../rs-platform-versioning" }
platform-serialization = { path = "../rs-platform-serialization" }
platform-serialization-derive = { path = "../rs-platform-serialization-derive" }
dpp-json-convertible-derive = { path = "../rs-dpp-json-convertible-derive" }
derive_more = { version = "1.0", features = ["from", "display", "try_into"] }
nohash-hasher = "0.2.0"
rust_decimal = { version = "1.39.0", optional = true }
rust_decimal_macros = { version = "1.39.0", optional = true }
indexmap = { version = "2.7.0", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
json-schema-compatibility-validator = { path = '../rs-json-schema-compatibility-validator', optional = true }
once_cell = "1.19.0"
tracing = { version = "0.1.41" }
grovedb-commitment-tree = { git = "https://github.com/dashpay/grovedb", rev = "8f25b20d04bfc0e8bdfb3870676d647a0d74918b", optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
pretty_assertions = { version = "1.4.1" }
dpp = { path = ".", default-features = false, features = [
  "all_features_without_client",
  "token-reward-explanations",
] }
assert_matches = "1.5.0"
once_cell = "1.7"
env_logger = { version = "0.11.8" }
log = { version = "0.4.27" }

[features]
default = ["state-transitions"]
core_bincode = ["dashcore/bincode"]
core_verification = ["dashcore/message_verification"]
core_quorum_validation = ["dashcore/quorum_validation"]
core_key_wallet = ["dep:key-wallet"]
core_key_wallet_bincode = ["dep:key-wallet", "key-wallet/bincode"]
core_key_wallet_bip_38 = ["dep:key-wallet", "key-wallet/bip38"]
core_key_wallet_serde = ["dep:key-wallet", "key-wallet/serde"]
core_spv = ["dep:dash-spv"]
core_rpc_client = ["dep:dashcore-rpc"]
bls-signatures = ["dashcore/bls"]
ed25519-dalek = ["dashcore/eddsa"]
all_features = [
  "json-conversion",
  "all-system_contracts",
  "state-transitions",
  "extended-document",
  "bls-signatures",
  "cbor",
  "validation",
  "identity-hashing",
  "identity-serialization",
  "ciborium",
  "core-types",
  "core-types-serialization",
  "core-types-serde-conversion",
  "document-cbor-conversion",
  "data-contract-cbor-conversion",
  "identity-cbor-conversion",
  "state-transition-validation",
  "state-transition-signing",
  "factories",
  "fixtures-and-mocks",
  "random-public-keys",
  "random-identities",
  "random-documents",
  "random-document-types",
  "fee-distribution",
  "client",
  "vote-serialization",
  "token-reward-explanations",
]

dash-sdk-features = [
  "identity-hashing",
  "json-conversion",
  "state-transition-signing",
  "client",
  "platform-value-cbor",
  "core_rpc_client",
]
all_features_without_client = [
  "json-conversion",
  "all-system_contracts",
  "state-transitions",
  "extended-document",
  "cbor",
  "validation",
  "identity-hashing",
  "identity-serialization",
  "ciborium",
  "core-types",
  "core-types-serialization",
  "core-types-serde-conversion",
  "document-cbor-conversion",
  "data-contract-cbor-conversion",
  "identity-cbor-conversion",
  "state-transition-validation",
  "state-transition-signing",
  "factories",
  "fixtures-and-mocks",
  "random-public-keys",
  "random-identities",
  "random-documents",
  "random-document-types",
  "fee-distribution",
  "vote-serialization",
]
abci = [
  "state-transitions",
  "state-transition-validation",
  "validation",
  "random-public-keys",
  "identity-serialization",
  "vote-serialization",
  "platform-value-cbor",
  "core-types",
  "core-types-serialization",
  "serde-conversion",
  "core_rpc_client",
]
cbor = ["ciborium"]
validation = [
  "json-schema-validation",
  "value-conversion",
  "ed25519-dalek",
]
# TODO: Tring to remove regexp
create-contested-document = []
json-conversion = ["value-conversion", "platform-value/json", "json-object"]
platform-value-json = ["platform-value/json", "json-conversion"]
platform-value-cbor = ["platform-value/cbor"]
json-schema-validation = [
  "jsonschema",
  "platform-value-json",
  "dep:json-schema-compatibility-validator",
]
json-object = ["platform-value", "platform-value-json"]
platform-value = []
identity-hashing = ["identity-serialization"]
message-signing = []
message-signature-verification = ["bls-signatures"]
# Unified conversion features (chain: serde → value → json)
serde-conversion = []
value-conversion = ["serde-conversion", "platform-value"]
# json-conversion is defined above (value-conversion + platform-value/json)

# Backwards-compatible aliases (point to unified flags)
document-serde-conversion = ["serde-conversion"]
document-value-conversion = ["value-conversion"]
document-json-conversion = ["json-conversion"]
document-cbor-conversion = [
  "value-conversion",
  "cbor",
  "platform-value-cbor",
]
data-contract-serde-conversion = ["serde-conversion"]
data-contract-value-conversion = ["value-conversion"]
data-contract-json-conversion = ["json-conversion"]
data-contract-cbor-conversion = [
  "value-conversion",
  "cbor",
  "platform-value-cbor",
]
identity-serialization = []
identity-serde-conversion = ["serde-conversion"]
identity-value-conversion = ["value-conversion"]
identity-json-conversion = ["json-conversion"]
identity-cbor-conversion = [
  "value-conversion",
  "cbor",
  "platform-value-cbor",
]
index-serde-conversion = ["serde-conversion"]
state-transition-serde-conversion = ["serde-conversion"]
state-transition-value-conversion = ["value-conversion"]
state-transition-json-conversion = ["json-conversion"]
state-transition-validation = [
  "state-transitions",
  "message-signature-verification",
]
state-transition-signing = [
  "state-transitions",
  "message-signing",
  "state-transition-validation",
]
vote-serialization = []
vote-serde-conversion = ["serde-conversion"]
core-types = ["bls-signatures"]
core-types-serialization = ["core-types"]
core-types-serde-conversion = ["core-types"]
state-transitions = []
system_contracts = ["data-contracts", "factories", "platform-value-json"]
# All system data contracts
all-system_contracts = [
  "system_contracts",
  "data-contracts/all-contracts",
  "dpns-contract",
  "dashpay-contract",
  "withdrawals-contract",
  "masternode-rewards-contract",
  "wallet-utils-contract",
  "token-history-contract",
  "keywords-contract",
]

# Individual data contract features
dpns-contract = ["data-contracts", "data-contracts/dpns"]
dashpay-contract = ["data-contracts", "data-contracts/dashpay"]
withdrawals-contract = ["data-contracts", "data-contracts/withdrawals"]
masternode-rewards-contract = [
  "data-contracts",
  "data-contracts/masternode-rewards",
]
wallet-utils-contract = ["data-contracts", "data-contracts/wallet-utils"]
token-history-contract = ["data-contracts", "data-contracts/token-history"]
keywords-contract = ["data-contracts", "data-contracts/keyword-search"]
fixtures-and-mocks = ["all-system_contracts", "platform-value/json"]
random-public-keys = ["bls-signatures", "ed25519-dalek"]
random-identities = ["random-public-keys"]
random-documents = []
random-document-types = ["platform-value-json"]
fee-distribution = ["dep:rust_decimal", "dep:rust_decimal_macros"]
extended-document = [
  "json-conversion",
]
token-reward-explanations = ["dep:chrono-tz"]

# Gates client-side Orchard helpers (address encoding, bundle building, proving).
# Clients that don't need to create shielded transactions can omit this to avoid
# compiling the Orchard/Halo 2 dependency tree. The shielded state transition
# types themselves are always available — only the client tooling is behind this gate.
shielded-client = [
  "state-transition-signing",
  "dep:grovedb-commitment-tree",
]
factories = []
client = ["factories", "state-transitions"]
