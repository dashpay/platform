[package]
name = "simple-signer"
version.workspace = true
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Enable state transitions support (requires additional dpp features)
state-transitions = [
    "dpp/state-transitions",
    "dpp/bls-signatures",
    "dpp/state-transition-signing",
]

[dependencies]
async-trait = "0.1"
dpp = { path = "../rs-dpp", default-features = false, features = [
    "ed25519-dalek",
] }
bincode = { version = "=2.0.1", features = ["serde"] }
base64 = { version = "0.22.1" }
hex = { version = "0.4.3" }
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.41"

[package.metadata.cargo-machete]
ignored = ["bincode"]
