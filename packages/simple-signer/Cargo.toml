[package]
name = "simple-signer"
version.workspace = true
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Enable state transitions support (requires additional dpp features)
state-transitions = [
    "dpp/state-transitions",
    "dpp/bls-signatures",
    "dpp/state-transition-signing",
]
# Eager seed-based key derivation constructors (DIP-17 / DIP-9).
derive = ["dep:key-wallet", "dep:thiserror", "state-transitions"]

[dependencies]
dpp = { path = "../rs-dpp", default-features = false, features = [
    "ed25519-dalek",
] }
async-trait = { version = "0.1.79" }
bincode = { workspace = true, features = ["serde"] }
base64 = { version = "0.22.1" }
hex = { version = "0.4.3" }
# rand 0.8 `RngCore`, the RNG type strategy-tests/drive-abci pass in; the
# secp256k1 re-export is rand 0.9.
rand = { version = "0.8", default-features = false }
tracing = "0.1.41"
key-wallet = { workspace = true, optional = true }
thiserror = { version = "2.0.17", optional = true }
zeroize = "1"

[package.metadata.cargo-machete]
ignored = ["bincode"]
