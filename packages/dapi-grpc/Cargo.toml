[package]
name = "dapi-grpc"
description = "GRPC client for Dash Platform"
version.workspace = true
authors = [
  "Samuel Westrich <sam@dash.org>",
  "Igor Markin <igor.markin@dash.org>",
  "Łukasz Klimek <lukasz.klimek@dash.org>",
  "Anton Suprunchuk <anton.suprunchuk@dash.org>",
  "Ivan Shumkov <shumkov@dash.org>",
]
edition = "2021"
rust-version.workspace = true
license = "MIT"

[features]
default = ["core", "platform", "client"]
# Internal Drive endpoints. Used by DAPI
drive = ["platform"]
core = []
platform = []
# Re-export Dash Platform protobuf types as `dapi_grpc::platform::proto`
# Note: client needs tls and tls-roots to connect to testnet which uses TLS.
tenderdash-proto = []

# Client support.
client = ["platform"]

# Networked tonic client: `connect()` on generated clients, TLS roots.
# Deliberately NOT in the default set: cargo features are not target-scoped,
# so a default-on transport would force tonic's transport stack onto wasm32
# consumers riding defaults, where it does not build. Without this feature
# the crate provides message types and transport-generic client stubs only.
# Tonic's codegen graph still includes tokio-stream and a minimal Tokio
# slice, but its hyper/rustls transport stack is not enabled. Native
# networked consumers enable this explicitly (rs-dapi-client does so through
# its non-wasm dependency); the wasm codegen path never emits `connect()`.
transport = [
  "tonic/channel",
  "tonic/transport",
  "tonic/tls-native-roots",
  "tonic/tls-webpki-roots",
  "tonic/tls-ring",
]

# Build tonic server code. Includes all client features and adds server-specific dependencies.
server = [
  "platform",
  "tenderdash-proto/server",
  "client",
  "drive",
  "transport",
  "tonic/router",
]

serde = ["dep:serde", "dep:serde_bytes", "tenderdash-proto/serde"]
mocks = ["serde", "dep:serde_json"]

[dependencies]
tenderdash-proto = { git = "https://github.com/dashpay/rs-tenderdash-abci", tag = "v1.5.1", default-features = false }

prost = { version = "0.14" }
futures-core = "0.3.30"
serde = { version = "1.0.219", optional = true, features = ["derive"] }
serde_bytes = { version = "0.11.12", optional = true }
serde_json = { version = "1.0", optional = true }
dash-platform-macros = { path = "../rs-dash-platform-macros" }
platform-version = { path = "../rs-platform-version" }
tonic-prost = { version = "0.14.2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic = { version = "0.14.2", features = ["codegen"], default-features = false }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { version = "0.14.2", features = ["codegen"], default-features = false }

[build-dependencies]
tonic-prost-build = { version = "0.14.2" }

[lib]

[[example]]
name = "core_example"
path = "clients/core/v0/rust/core_example.rs"


[[example]]
name = "platform_example"
path = "clients/platform/v0/rust/platform_example.rs"

[package.metadata.cargo-machete]
ignored = [
  "platform-version",
  "futures-core",
  "tonic-prost-build",
  "getrandom",            # Ignore getrandom as we need it to enable `js` feature
  "dash-platform-macros", # used in build.rs
]
