syntax = "proto3";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";

package org.dash.platform.dapi.v0;

import "google/protobuf/timestamp.proto";

service Platform {
  // @sdk-ignore: Write-only endpoint, not a query
  rpc broadcastStateTransition(BroadcastStateTransitionRequest)
      returns (BroadcastStateTransitionResponse);
  rpc getIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc getIdentityKeys(GetIdentityKeysRequest) returns (GetIdentityKeysResponse);
  rpc getIdentitiesContractKeys(GetIdentitiesContractKeysRequest)
      returns (GetIdentitiesContractKeysResponse);
  rpc getIdentityNonce(GetIdentityNonceRequest)
      returns (GetIdentityNonceResponse);
  rpc getIdentityContractNonce(GetIdentityContractNonceRequest)
      returns (GetIdentityContractNonceResponse);
  rpc getIdentityBalance(GetIdentityBalanceRequest)
      returns (GetIdentityBalanceResponse);
  rpc getIdentitiesBalances(GetIdentitiesBalancesRequest)
      returns (GetIdentitiesBalancesResponse);
  rpc getIdentityBalanceAndRevision(GetIdentityBalanceAndRevisionRequest)
      returns (GetIdentityBalanceAndRevisionResponse);
  rpc getEvonodesProposedEpochBlocksByIds(
      GetEvonodesProposedEpochBlocksByIdsRequest)
      returns (GetEvonodesProposedEpochBlocksResponse);
  rpc getEvonodesProposedEpochBlocksByRange(
      GetEvonodesProposedEpochBlocksByRangeRequest)
      returns (GetEvonodesProposedEpochBlocksResponse);
  rpc getDataContract(GetDataContractRequest) returns (GetDataContractResponse);
  rpc getDataContractHistory(GetDataContractHistoryRequest)
      returns (GetDataContractHistoryResponse);
  rpc getDataContracts(GetDataContractsRequest)
      returns (GetDataContractsResponse);
  rpc getDocumentHistory(GetDocumentHistoryRequest)
      returns (GetDocumentHistoryResponse);
  rpc getDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);
  rpc getIdentityByPublicKeyHash(GetIdentityByPublicKeyHashRequest)
      returns (GetIdentityByPublicKeyHashResponse);
  rpc getIdentityByNonUniquePublicKeyHash(
      GetIdentityByNonUniquePublicKeyHashRequest)
      returns (GetIdentityByNonUniquePublicKeyHashResponse);
  rpc waitForStateTransitionResult(WaitForStateTransitionResultRequest)
      returns (WaitForStateTransitionResultResponse);
  // @sdk-ignore: Consensus params fetched via Tenderdash RPC
  rpc getConsensusParams(GetConsensusParamsRequest)
      returns (GetConsensusParamsResponse);
  rpc getProtocolVersionUpgradeState(GetProtocolVersionUpgradeStateRequest)
      returns (GetProtocolVersionUpgradeStateResponse);
  rpc getProtocolVersionUpgradeVoteStatus(
      GetProtocolVersionUpgradeVoteStatusRequest)
      returns (GetProtocolVersionUpgradeVoteStatusResponse);
  rpc getEpochsInfo(GetEpochsInfoRequest) returns (GetEpochsInfoResponse);
  rpc getFinalizedEpochInfos(GetFinalizedEpochInfosRequest)
      returns (GetFinalizedEpochInfosResponse);
  // What votes are currently happening for a specific contested index
  rpc getContestedResources(GetContestedResourcesRequest)
      returns (GetContestedResourcesResponse);
  // What's the state of a contested resource vote? (ie who is winning?)
  rpc getContestedResourceVoteState(GetContestedResourceVoteStateRequest)
      returns (GetContestedResourceVoteStateResponse);
  // Who voted for a contested resource to go to a specific identity?
  rpc getContestedResourceVotersForIdentity(
      GetContestedResourceVotersForIdentityRequest)
      returns (GetContestedResourceVotersForIdentityResponse);
  // How did an identity vote?
  rpc getContestedResourceIdentityVotes(
      GetContestedResourceIdentityVotesRequest)
      returns (GetContestedResourceIdentityVotesResponse);
  // What vote polls will end soon?
  rpc getVotePollsByEndDate(GetVotePollsByEndDateRequest)
      returns (GetVotePollsByEndDateResponse);
  rpc getPrefundedSpecializedBalance(GetPrefundedSpecializedBalanceRequest)
      returns (GetPrefundedSpecializedBalanceResponse);
  rpc getTotalCreditsInPlatform(GetTotalCreditsInPlatformRequest)
      returns (GetTotalCreditsInPlatformResponse);
  rpc getPathElements(GetPathElementsRequest) returns (GetPathElementsResponse);
  rpc getStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc getCurrentQuorumsInfo(GetCurrentQuorumsInfoRequest)
      returns (GetCurrentQuorumsInfoResponse);
  rpc getIdentityTokenBalances(GetIdentityTokenBalancesRequest)
      returns (GetIdentityTokenBalancesResponse);
  rpc getIdentitiesTokenBalances(GetIdentitiesTokenBalancesRequest)
      returns (GetIdentitiesTokenBalancesResponse);
  rpc getIdentityTokenInfos(GetIdentityTokenInfosRequest)
      returns (GetIdentityTokenInfosResponse);
  rpc getIdentitiesTokenInfos(GetIdentitiesTokenInfosRequest)
      returns (GetIdentitiesTokenInfosResponse);
  rpc getTokenStatuses(GetTokenStatusesRequest)
      returns (GetTokenStatusesResponse);
  rpc getTokenDirectPurchasePrices(GetTokenDirectPurchasePricesRequest)
      returns (GetTokenDirectPurchasePricesResponse);
  rpc getTokenContractInfo(GetTokenContractInfoRequest)
      returns (GetTokenContractInfoResponse);
  rpc getTokenPreProgrammedDistributions(
      GetTokenPreProgrammedDistributionsRequest)
      returns (GetTokenPreProgrammedDistributionsResponse);
  rpc getTokenPerpetualDistributionLastClaim(
      GetTokenPerpetualDistributionLastClaimRequest)
      returns (GetTokenPerpetualDistributionLastClaimResponse);
  rpc getTokenTotalSupply(GetTokenTotalSupplyRequest)
      returns (GetTokenTotalSupplyResponse);
  rpc getGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
  rpc getGroupInfos(GetGroupInfosRequest) returns (GetGroupInfosResponse);
  rpc getGroupActions(GetGroupActionsRequest) returns (GetGroupActionsResponse);
  rpc getGroupActionSigners(GetGroupActionSignersRequest)
      returns (GetGroupActionSignersResponse);
  rpc getAddressInfo(GetAddressInfoRequest)
          returns (GetAddressInfoResponse);
  rpc getAddressesInfos(GetAddressesInfosRequest)
          returns (GetAddressesInfosResponse);
  rpc getAddressesTrunkState(GetAddressesTrunkStateRequest)
          returns (GetAddressesTrunkStateResponse);
  rpc getAddressesBranchState(GetAddressesBranchStateRequest)
          returns (GetAddressesBranchStateResponse);
  rpc getRecentAddressBalanceChanges(GetRecentAddressBalanceChangesRequest)
          returns (GetRecentAddressBalanceChangesResponse);
  rpc getRecentCompactedAddressBalanceChanges(GetRecentCompactedAddressBalanceChangesRequest)
          returns (GetRecentCompactedAddressBalanceChangesResponse);
  rpc getShieldedEncryptedNotes(GetShieldedEncryptedNotesRequest)
      returns (GetShieldedEncryptedNotesResponse);
  rpc getShieldedAnchors(GetShieldedAnchorsRequest)
      returns (GetShieldedAnchorsResponse);
  rpc getMostRecentShieldedAnchor(GetMostRecentShieldedAnchorRequest)
      returns (GetMostRecentShieldedAnchorResponse);
  rpc getShieldedPoolState(GetShieldedPoolStateRequest)
      returns (GetShieldedPoolStateResponse);
  rpc getShieldedNotesCount(GetShieldedNotesCountRequest)
      returns (GetShieldedNotesCountResponse);
  rpc getShieldedNullifiers(GetShieldedNullifiersRequest)
      returns (GetShieldedNullifiersResponse);
}

// Proof message includes cryptographic proofs for validating responses
message Proof {
  bytes grovedb_proof = 1; // GroveDB proof for the data
  bytes quorum_hash = 2;   // Hash of the quorum validating the data
  bytes signature = 3;     // Signature proving data authenticity
  uint32 round = 4;        // Consensus round number
  bytes block_id_hash = 5; // Hash of the block ID
  uint32 quorum_type = 6;  // Type of the quorum
}

// ResponseMetadata provides metadata about the blockchain state at the time of
// response
message ResponseMetadata {
  uint64 height = 1 [ jstype = JS_STRING ]; // Current blockchain height
  uint32 core_chain_locked_height = 2; // Latest known core height in consensus
  uint32 epoch = 3;                    // Current epoch number
  uint64 time_ms = 4 [ jstype = JS_STRING ]; // Timestamp in milliseconds
  uint32 protocol_version = 5;               // Protocol version
  string chain_id = 6;                       // Identifier of the blockchain
}

message StateTransitionBroadcastError {
  uint32 code = 1;
  string message = 2;
  bytes data = 3;
}

enum KeyPurpose {
  AUTHENTICATION = 0;
  ENCRYPTION = 1;
  DECRYPTION = 2;
  TRANSFER = 3;
  VOTING = 5;
}

message BroadcastStateTransitionRequest { bytes state_transition = 1; }

message BroadcastStateTransitionResponse {}

message GetIdentityRequest {

  message GetIdentityRequestV0 {
    bytes id = 1;   // The ID of the identity being requested
    bool prove = 2; // Flag to request a proof as the response
  }

  oneof version { GetIdentityRequestV0 v0 = 1; }
}

message GetIdentityNonceRequest {

  message GetIdentityNonceRequestV0 {
    bytes identity_id = 1;
    bool prove = 2;
  }

  oneof version { GetIdentityNonceRequestV0 v0 = 1; }
}

message GetIdentityContractNonceRequest {

  message GetIdentityContractNonceRequestV0 {
    bytes identity_id = 1;
    bytes contract_id = 2;
    bool prove = 3;
  }

  oneof version { GetIdentityContractNonceRequestV0 v0 = 1; }
}

message GetIdentityBalanceRequest {

  message GetIdentityBalanceRequestV0 {
    bytes id = 1;   // ID of the identity whose balance is requested
    bool prove = 2; // Flag to request a proof as the response
  }

  oneof version { GetIdentityBalanceRequestV0 v0 = 1; }
}

message GetIdentityBalanceAndRevisionRequest {

  message GetIdentityBalanceAndRevisionRequestV0 {
    bytes id = 1;   // ID of the identity for balance and revision
    bool prove = 2; // Flag to request a proof as the response
  }

  oneof version { GetIdentityBalanceAndRevisionRequestV0 v0 = 1; }
}

message GetIdentityResponse {

  message GetIdentityResponseV0 {
    oneof result {
      bytes identity = 1; // The requested identity data
      Proof proof = 2;    // Proof of the identity data, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }

  oneof version { GetIdentityResponseV0 v0 = 1; }
}

message GetIdentityNonceResponse {

  message GetIdentityNonceResponseV0 {
    oneof result {
      uint64 identity_nonce = 1 [ jstype = JS_STRING ];
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version { GetIdentityNonceResponseV0 v0 = 1; }
}

message GetIdentityContractNonceResponse {

  message GetIdentityContractNonceResponseV0 {
    oneof result {
      uint64 identity_contract_nonce = 1 [ jstype = JS_STRING ];
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version { GetIdentityContractNonceResponseV0 v0 = 1; }
}

message GetIdentityBalanceResponse {

  message GetIdentityBalanceResponseV0 {
    oneof result {
      uint64 balance = 1
          [ jstype = JS_STRING ]; // The balance of the requested identity
      Proof proof = 2;            // Proof of the balance, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }

  oneof version { GetIdentityBalanceResponseV0 v0 = 1; }
}

message GetIdentityBalanceAndRevisionResponse {

  message GetIdentityBalanceAndRevisionResponseV0 {
    message BalanceAndRevision {
      uint64 balance = 1 [ jstype = JS_STRING ]; // Balance of the identity
      uint64 revision = 2
          [ jstype = JS_STRING ]; // Revision number of the identity
    }

    oneof result {
      BalanceAndRevision balance_and_revision =
          1;           // The balance and revision data
      Proof proof = 2; // Proof of the data, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }

  oneof version { GetIdentityBalanceAndRevisionResponseV0 v0 = 1; }
}

message KeyRequestType {
  oneof request {
    AllKeys all_keys = 1;           // Request for all keys
    SpecificKeys specific_keys = 2; // Request for specific keys by their IDs
    SearchKey search_key = 3; // Request for keys based on a search criteria
  }
}

// AllKeys is an empty message used to signify a request for all keys
message AllKeys {}

// SpecificKeys is used to request specific keys by their IDs
message SpecificKeys {
  repeated uint32 key_ids = 1; // List of key IDs
}

// SearchKey represents a request to search for keys based on specific criteria
message SearchKey {
  map<uint32, SecurityLevelMap> purpose_map =
      1; // Map of purposes to their security level maps
}

// SecurityLevelMap maps security levels to a request type for key retrieval
message SecurityLevelMap {
  enum KeyKindRequestType {
    CURRENT_KEY_OF_KIND_REQUEST =
        0; // Request the current key of a particular kind
    ALL_KEYS_OF_KIND_REQUEST = 1; // Request all keys of a particular kind
  }
  map<uint32, KeyKindRequestType> security_level_map =
      1; // Maps security levels to key request types
}

message GetIdentityKeysRequest {

  message GetIdentityKeysRequestV0 {
    bytes identity_id = 1; // ID of the identity for key retrieval
    KeyRequestType request_type =
        2; // Type of key request: all, specific, or search
    google.protobuf.UInt32Value limit =
        3; // Limit on the number of keys to be returned
    google.protobuf.UInt32Value offset =
        4;          // Offset for pagination through the keys
    bool prove = 5; // Flag to request a proof as the response
  }

  oneof version { GetIdentityKeysRequestV0 v0 = 1; }
}

message GetIdentityKeysResponse {

  message GetIdentityKeysResponseV0 {
    message Keys {
      repeated bytes keys_bytes = 1;
    } // Collection of keys as byte sequences

    oneof result {
      Keys keys = 1;   // The actual key data
      Proof proof = 2; // Proof of the keys data, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }
  oneof version { GetIdentityKeysResponseV0 v0 = 1; }
}

message GetIdentitiesContractKeysRequest {
  message GetIdentitiesContractKeysRequestV0 {
    repeated bytes identities_ids = 1;
    bytes contract_id = 2;
    optional string document_type_name = 3;
    repeated KeyPurpose purposes = 4;
    bool prove = 5;
  }

  oneof version { GetIdentitiesContractKeysRequestV0 v0 = 1; }
}

message GetIdentitiesContractKeysResponse {
  message GetIdentitiesContractKeysResponseV0 {
    message PurposeKeys {
      KeyPurpose purpose = 1;
      repeated bytes keys_bytes = 2;
    }

    message IdentityKeys {
      bytes identity_id = 1;
      repeated PurposeKeys keys = 2;
    }

    message IdentitiesKeys { repeated IdentityKeys entries = 1; };

    oneof result {
      IdentitiesKeys identities_keys = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version { GetIdentitiesContractKeysResponseV0 v0 = 1; }
}

message GetEvonodesProposedEpochBlocksByIdsRequest {

  message GetEvonodesProposedEpochBlocksByIdsRequestV0 {
    optional uint32 epoch =
        1; // The epoch we are querying for, if none is set, get current epoch
    repeated bytes ids =
        2; // IDs of the evonodes for which we want to get their proposed blocks
    bool prove = 3; // Flag to request a proof as the response
  }

  oneof version { GetEvonodesProposedEpochBlocksByIdsRequestV0 v0 = 1; }
}

message GetEvonodesProposedEpochBlocksResponse {

  message GetEvonodesProposedEpochBlocksResponseV0 {
    message EvonodeProposedBlocks {
      bytes pro_tx_hash = 1;
      uint64 count = 2 [ jstype = JS_STRING ];
    }

    message EvonodesProposedBlocks {
      repeated EvonodeProposedBlocks evonodes_proposed_block_counts = 1;
    }

    oneof result {
      EvonodesProposedBlocks evonodes_proposed_block_counts_info =
          1;           // The actual result
      Proof proof = 2; // Proof of the keys data, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }
  oneof version { GetEvonodesProposedEpochBlocksResponseV0 v0 = 1; }
}

message GetEvonodesProposedEpochBlocksByRangeRequest {

  message GetEvonodesProposedEpochBlocksByRangeRequestV0 {
    optional uint32 epoch =
        1; // The epoch we are querying for, if none is set, get current epoch
    optional uint32 limit =
        2; // Maximum number of evonodes proposed epoch blocks to return
    oneof start {
      bytes start_after = 3; // Start retrieval after this document
      bytes start_at = 4;    // Start retrieval at this document
    }
    bool prove = 5; // Flag to request a proof as the response
  }

  oneof version { GetEvonodesProposedEpochBlocksByRangeRequestV0 v0 = 1; }
}

message GetIdentitiesBalancesRequest {
  message GetIdentitiesBalancesRequestV0 {
    repeated bytes ids = 1;
    bool prove = 2;
  }

  oneof version { GetIdentitiesBalancesRequestV0 v0 = 1; }
}

message GetIdentitiesBalancesResponse {
  message GetIdentitiesBalancesResponseV0 {
    message IdentityBalance {
      bytes identity_id = 1;
      optional uint64 balance = 2 [ jstype = JS_STRING ];
    }

    message IdentitiesBalances { repeated IdentityBalance entries = 1; };

    oneof result {
      IdentitiesBalances identities_balances = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version { GetIdentitiesBalancesResponseV0 v0 = 1; }
}

message GetDataContractRequest {
  message GetDataContractRequestV0 {
    bytes id = 1;   // The ID of the data contract being requested
    bool prove = 2; // Flag to request a proof as the response
  }
  oneof version { GetDataContractRequestV0 v0 = 1; }
}

message GetDataContractResponse {
  message GetDataContractResponseV0 {
    oneof result {
      bytes data_contract = 1; // The actual data contract in binary form
      Proof proof = 2; // Cryptographic proof of the data contract, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }
  oneof version { GetDataContractResponseV0 v0 = 1; }
}

message GetDataContractsRequest {
  message GetDataContractsRequestV0 {
    repeated bytes ids =
        1; // A list of unique IDs for the data contracts being requested
    bool prove = 2; // Flag to request a proof as the response
  }
  oneof version { GetDataContractsRequestV0 v0 = 1; }
}

message GetDataContractsResponse {
  message DataContractEntry {
    bytes identifier = 1; // The unique identifier of the data contract
    google.protobuf.BytesValue data_contract =
        2; // The actual data contract content
  }

  // DataContracts is a collection of data contract entries.
  message DataContracts {
    repeated DataContractEntry data_contract_entries =
        1; // A list of data contract entries
  }

  message GetDataContractsResponseV0 {
    oneof result {
      DataContracts data_contracts = 1; // The actual data contracts requested
      Proof proof =
          2; // Cryptographic proof for the data contracts, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }
  oneof version { GetDataContractsResponseV0 v0 = 1; }
}

message GetDataContractHistoryRequest {
  message GetDataContractHistoryRequestV0 {
    bytes id = 1; // The unique ID of the data contract
    google.protobuf.UInt32Value limit =
        2; // The maximum number of history entries to return
    google.protobuf.UInt32Value offset =
        3; // The offset for pagination through the contract history
    uint64 start_at_ms = 4 [
      jstype = JS_STRING
    ];              // Only return results starting at this time in milliseconds
    bool prove = 5; // Flag to request a proof as the response
  }
  oneof version { GetDataContractHistoryRequestV0 v0 = 1; }
}

message GetDataContractHistoryResponse {
  message GetDataContractHistoryResponseV0 {
    // Represents a single entry in the data contract's history
    message DataContractHistoryEntry {
      uint64 date = 1 [ jstype = JS_STRING ]; // The date of the history entry
      bytes value =
          2; // The value of the data contract at this point in history
    }

    // Collection of data contract history entries
    message DataContractHistory {
      repeated DataContractHistoryEntry data_contract_entries =
          1; // List of history entries
    }

    oneof result {
      DataContractHistory data_contract_history =
          1; // The actual history of the data contract
      Proof proof =
          2; // Cryptographic proof of the data contract history, if requested
    }

    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }
  oneof version { GetDataContractHistoryResponseV0 v0 = 1; }
}

message GetDocumentsRequest {
  // Comparison operator for a single `WhereClause`. Wire values
  // mirror `drive::query::WhereOperator` 1:1; the server maps the
  // enum discriminant directly without re-parsing operator strings.
  //
  // `BETWEEN*` operators expect the right-hand operand to be a
  // 2-element `DocumentFieldValue.list` carrying `[lower, upper]`;
  // `IN` expects a `list` of candidate values; all other operators
  // expect a scalar `DocumentFieldValue` matching the indexed
  // field's type.
  enum WhereOperator {
    EQUAL = 0;
    GREATER_THAN = 1;
    GREATER_THAN_OR_EQUALS = 2;
    LESS_THAN = 3;
    LESS_THAN_OR_EQUALS = 4;
    BETWEEN = 5;
    BETWEEN_EXCLUDE_BOUNDS = 6;
    BETWEEN_EXCLUDE_LEFT = 7;
    BETWEEN_EXCLUDE_RIGHT = 8;
    IN = 9;
    STARTS_WITH = 10;
    // Time-range bucket selection (v1 / `GetDocumentsRequestV1` only — the
    // v0 CBOR where surface is unaffected). The clause's `field` names a
    // timestamp property covered by a `timeRange` index. The operand is
    // either `DocumentFieldValue.text` — the bare selector `"newest"` or
    // `"oldest"`, legal while exactly one grid buckets the field — or
    // `DocumentFieldValue.list` of `[text(selector), uint64(range),
    // uint64(step)]` / `[…, uint64(phase)]`, naming one of the field's
    // grids in the contract's own declared seconds (required when several
    // grids bucket the field; a zero phase is spelled by omission, so
    // every grid has exactly one wire spelling). The server resolves the
    // selector to a concrete equality on the named grid's bucket start
    // using the current block time, and the verifier re-derives the same
    // bucket from the quorum-signed response metadata time — so the proof
    // is an ordinary index/count proof. See `timeRange` in the document
    // meta-schema and `drive::query::resolve_time_range_bucket_clause`.
    IN_TIME_RANGE = 11;
  }

  // Tagged scalar (or list) operand for a `WhereClause`. The
  // variant the caller picks names the wire-level primitive type
  // only — the **document type's schema** is the source of truth
  // for the indexed field's actual type, and the server coerces
  // each variant through the schema-driven
  // `document_type.serialize_value_for_key(field, value, …)` path
  // (the same path the CBOR-shaped v0 request flows through). That
  // means:
  //
  // - Identifier-typed fields accept either a `bytes_value` (raw
  //   32 bytes) **or** a `text` (base58-encoded). The schema
  //   decides; callers don't need a dedicated identifier variant.
  // - Fixed-width byte fields (e.g. `Bytes20`/`Bytes36`) accept
  //   `bytes_value` of the appropriate length; the schema
  //   validates the size.
  // - Numeric fields accept the closest-fit signed (`int64_value`)
  //   or unsigned (`uint64_value`) variant; the schema coerces to
  //   the indexed type (`u8` … `u64`/`i8` … `i64`/`u128`/`i128`).
  // - String / bool fields accept `text` / `bool_value`.
  //
  // The `null_value` variant is the typed-wire equivalent of a CBOR
  // `null` operand on the v0 path. Callers should NOT use it for
  // "no clause" — empty where-clauses are still expressed by
  // leaving `GetDocumentsRequestV1.where_clauses` empty. It exists
  // for clauses that legitimately compare against `null` (e.g.
  // queries on schema-nullable index entries from the v0 wire that
  // round-trip through the v1 surface).
  message DocumentFieldValue {
    // Recursive list — operand for `IN` (candidate values) and
    // `BETWEEN*` (exactly 2 values `[lower, upper]`). Nested
    // `list` is structurally allowed but every supported document
    // index value-type is currently scalar, so callers should not
    // need to nest.
    message ValueList { repeated DocumentFieldValue values = 1; }

    oneof variant {
      bool bool_value = 1;
      sint64 int64_value = 2 [jstype = JS_STRING];
      uint64 uint64_value = 3 [jstype = JS_STRING];
      double double_value = 4;
      string text = 5;
      bytes bytes_value = 6;
      ValueList list = 7;
      // `bool` payload is a placeholder — only the discriminant
      // matters. Picking the variant means "this operand is null";
      // the bool value itself is ignored on the server.
      bool null_value = 8;
    }
  }

  // Single `field <op> value` clause. The server reassembles a
  // `Vec<WhereClause>` from the request's `where_clauses` field,
  // runs the same `WhereClause::group_clauses` validator (rejects
  // duplicate / conflicting same-field clauses) and the same
  // `> AND <` → `between*` canonicalizer the CBOR-shaped path uses,
  // then hands the structured clauses to the executor. Wire
  // semantics are identical to v0's CBOR `[field, op, value]`
  // triples — only the envelope differs.
  message WhereClause {
    string field = 1;
    WhereOperator operator = 2;
    DocumentFieldValue value = 3;
  }

  // Per-group aggregate operand for the left side of a
  // `HavingClause`, and the aggregate-function target of an
  // `OrderClause`. Only the per-group aggregates live here —
  // `HAVING` is a boolean predicate over one group's own aggregate,
  // and nothing on this message reaches across groups. Cross-group
  // ranking ("which groups score highest?") is expressed with SQL's
  // ordering surface instead: `ORDER BY <the selected aggregate>
  // DESC LIMIT n [OFFSET m]`. See `GetDocumentsRequestV1.order_by`.
  //
  // **Field semantics by function**:
  // - `COUNT`: empty `field` means `COUNT(*)` (group cardinality);
  //   non-empty `field` means `COUNT(field)` (count of non-null
  //   values of `field` in the group).
  // - `SUM` / `AVG`: `field` is required.
  message HavingAggregate {
    enum Function {
      COUNT = 0;
      SUM = 1;
      AVG = 2;
    }
    Function function = 1;
    // Required for every function except `COUNT`; for `COUNT` an
    // empty `field` means `COUNT(*)`.
    string field = 2;
  }

  // Single `HAVING <aggregate> <op> <value>` clause. Multiple
  // entries in `GetDocumentsRequestV1.having` combine with
  // implicit AND — same semantics as multiple `where_clauses`
  // entries. `HAVING COUNT(*) > 5 AND SUM(amount) > 100` is two
  // `HavingClause` rows, not a tree.
  //
  // **`HAVING` is a boolean per-group predicate and nothing else.**
  // Its right operand is always a literal `DocumentFieldValue`; it
  // never names another group or the set of groups. Cross-group
  // ranking — "the 5 highest-scoring groups" — is `ORDER BY <the
  // selected aggregate> DESC LIMIT 5`, exactly as in SQL, and is
  // served by the ranked executor (protocol v14+). An earlier draft
  // of this surface carried the ranking on the right of a `HAVING`
  // (`HAVING AVG(grade) IN TOP(5)`); that spelling was removed
  // before release rather than deprecated, because it invented
  // non-SQL grammar for something SQL already expresses.
  //
  // **From protocol v14 a single `HAVING` clause is served as a
  // bounded range read** (having-range mode): `SELECT <agg> GROUP BY
  // p HAVING <agg> <op> <value> [ORDER BY <order-key> ASC|DESC]
  // LIMIT n` answers from the same per-axis secondary as ranked
  // mode, on an index declaring the matching ranked axis. The
  // clause's aggregate must be the selected aggregate, the operator
  // must describe one contiguous range (`NOT_EQUAL` / `IN` are
  // rejected), and the optional `ORDER BY` picks the walk direction
  // using the same order-key spelling as ranked mode: `f` for
  // `SUM(f)` / `AVG(f)`, the `$count` sentinel for `COUNT(*)` —
  // never an explicit `OrderClause.aggregate` target, which is
  // rejected. See the supported-shape table on
  // `GetDocumentsRequestV1`. On protocol v13 and earlier every
  // non-empty `having` stays rejected with `Unsupported`, exactly as
  // before.
  //
  // The operator set mirrors `WhereOperator` minus `STARTS_WITH`
  // (prefix matching has no natural meaning against a scalar
  // aggregate result, even a string-typed one). `BETWEEN*` and
  // `IN` operand semantics match `WhereOperator`: `BETWEEN*`
  // expects a 2-element `DocumentFieldValue.list` carrying
  // `[lower, upper]`, and `IN` expects a `list` of candidate
  // values.
  //
  // The `right` oneof exists (rather than a bare
  // `DocumentFieldValue` field) so the "unset right operand" case
  // stays distinguishable from "the literal null value"; the wire
  // rejects an unset `right`.
  message HavingClause {
    enum Operator {
      EQUAL = 0;
      NOT_EQUAL = 1;
      GREATER_THAN = 2;
      GREATER_THAN_OR_EQUALS = 3;
      LESS_THAN = 4;
      LESS_THAN_OR_EQUALS = 5;
      BETWEEN = 6;
      BETWEEN_EXCLUDE_BOUNDS = 7;
      BETWEEN_EXCLUDE_LEFT = 8;
      BETWEEN_EXCLUDE_RIGHT = 9;
      IN = 10;
    }
    HavingAggregate aggregate = 1;
    Operator operator = 2;
    oneof right {
      DocumentFieldValue value = 3;
    }
  }

  // Single `ORDER BY <target> <direction>` clause. Multi-field
  // ordering is expressed by repeating this message at the
  // request level (`repeated OrderClause order_by = 4`), matching
  // SQL's `ORDER BY a ASC, b DESC` shape.
  //
  // The `target` oneof carries either a plain field name
  // (`ORDER BY field`) or an aggregate function applied to a
  // field (`ORDER BY COUNT(*)`, `ORDER BY SUM(amount)`).
  //
  // **Two distinct roles ride the `field` target.**
  //
  // 1. *Row ordering* — `select = DOCUMENTS`. `field` names a
  //    document property and the matched rows come back in that
  //    order. This is v0's behaviour, unchanged.
  //
  // 2. *Aggregate ordering* — the **ranked** surface (protocol
  //    v14+). With a `GROUP BY` and a single aggregate `select`,
  //    exactly one `order_by` clause naming that select's
  //    aggregate orders the *groups* by their aggregate value and
  //    routes the request to the ranked executor:
  //
  //    ```text
  //    SELECT AVG(grade) GROUP BY restaurantId
  //      ORDER BY grade DESC LIMIT 3          -- 3 best restaurants
  //    SELECT COUNT(*)   GROUP BY restaurantId
  //      ORDER BY $count DESC LIMIT 10 OFFSET 10  -- busiest, page 2
  //    ```
  //
  //    `SUM(f)` / `AVG(f)` are named by `f` — the same property the
  //    projection aggregates, which is how `ORDER BY avg(grade)`
  //    reads once `SELECT` has already fixed the function.
  //    `COUNT(*)` aggregates no property, so it is named by the
  //    reserved sentinel **`$count`**. The `$` prefix is what keeps
  //    the sentinel from colliding with a real document property:
  //    document properties cannot start with `$` (that namespace is
  //    the system fields' `$id` / `$ownerId` / …), so `$count` can
  //    never be mistaken for a column. `DESC` is the "top n"
  //    reading, `ASC` the "bottom n" reading.
  //
  //    An `order_by` naming anything other than the selected
  //    aggregate — a second clause, the `GROUP BY` property, an
  //    unrelated field — is rejected rather than normalized: it
  //    asks for an ordering the ranked secondary cannot produce.
  //
  // **Aggregate target still rejected** with
  // `Unsupported("ORDER BY on aggregate keys is not yet
  // implemented")`. It is the *explicit* spelling of role 2
  // (`ORDER BY AVG(grade)` rather than `ORDER BY grade` under a
  // `SELECT AVG(grade)`) and is wire-stable so it can start being
  // evaluated without another version bump; today the field-target
  // spelling above is the one the ranked executor reads.
  message OrderClause {
    oneof target {
      // Plain field name. Today's evaluated form — a document
      // property for row ordering, or the selected aggregate's
      // property (`$count` for `COUNT(*)`) for aggregate ordering.
      string field = 1;
      // Aggregate function applied to a field, sorted by the
      // per-group result. `function = DOCUMENTS` is invalid
      // here — DOCUMENTS isn't an aggregate.
      HavingAggregate aggregate = 3;
    }
    bool ascending = 2;
  }

  message GetDocumentsRequestV0 {
    bytes data_contract_id =
        1; // The ID of the data contract containing the documents
    string document_type = 2; // The type of document being requested
    bytes where = 3;          // Conditions to be met by the requested documents
    bytes order_by = 4;       // Ordering criteria for the documents
    uint32 limit = 5;         // Maximum number of documents to return

    // Specifies the starting point for the document retrieval
    oneof start {
      bytes start_after = 6; // Start retrieval after this document
      bytes start_at = 7;    // Start retrieval at this document
    }
    bool prove = 8; // Flag to request a proof as the response
  }

  // SQL-shaped successor to v0 that unifies `getDocuments` and
  // `getDocumentsCount` under a single request type with a typed
  // `select` projection and optional `group_by` / `having` clauses.
  //
  // Mode is determined by `select` × `group_by` × `having`:
  //
  // * `select = DOCUMENTS, group_by = []`: return matched documents
  //   (identical semantics to v0).
  // * `select = COUNT, group_by = []`: return a single aggregate
  //   count. With an `In` clause the server fans out per-In via
  //   `query_aggregate_count` and sums (O(|In| × log n), see
  //   `RangeNoProof`'s compound-summed path); with a range clause
  //   it uses `AggregateCountOnRange`.
  // * `select = COUNT, group_by = [<field>]`: return per-group
  //   `CountEntry` rows. Only supported when the grouping field
  //   matches an `In`-constrained or range-constrained where clause;
  //   other shapes return `Unsupported` (see supported-shape table
  //   below).
  //
  // **Ranked mode** is served from protocol v14 and is selected by
  // `group_by` + a single `order_by` naming the selected aggregate —
  // SQL's own top-n spelling, `ORDER BY <agg> DESC LIMIT n OFFSET m`.
  // It returns `ResultData.ranked`. See `order_by` and the
  // supported-shape table below.
  //
  // **Having-range mode** is served from protocol v14: a single
  // `having` clause whose aggregate is the selected aggregate turns
  // the request into a bounded range read over the same per-axis
  // secondary ranked mode walks, answered in `ResultData.ranked`.
  // On protocol v13 and earlier every non-empty `having` is rejected
  // (`"HAVING clause is not yet implemented"`). `having` carries no
  // ranking spelling: an earlier draft put cross-group ranking on the
  // right of a `HAVING` (`HAVING AVG(grade) IN TOP(5)`) and that
  // grammar was removed before release in favour of `ORDER BY` +
  // `LIMIT`. See the supported-shape table below.
  //
  // **Supported shapes** (everything else rejects with a typed
  // `QuerySyntaxError::Unsupported` so callers can detect un-wired
  // capabilities without parsing prose). Bullets are kept
  // single-line so the generated Rust doc comments don't trip
  // rustdoc's `list_item_without_indent` lint on continuation
  // lines.
  //
  // `select=DOCUMENTS, group_by=[]`: any where shape v0 supports.
  //
  // `select=COUNT, group_by=[]`:
  // - empty where → `documentsCountable: true` doctype.
  // - `==` only → `countable: true` index covering the fields.
  // - one `In` → `countable: true` index covering the fields (per-In aggregate fan-out).
  // - one range → `rangeCountable: true` index.
  // - one `In` + one range → `rangeCountable: true` compound index (per-In aggregate fan-out on no-proof; rejected on prove because the aggregate proof primitive can't fork).
  //
  // `select=COUNT, group_by=[g]`:
  // - g is the In clause's field → `countable: true` index, grouped by g (PerInValue on no-proof, CountTree element proof per In branch on prove).
  // - g is the range clause's field → `rangeCountable: true` index, grouped by g (RangeDistinct on no-proof, distinct range proof on prove).
  //
  // `select=COUNT, group_by=[a, b]`:
  // - a is the In field AND b is the range field, in that order → existing compound distinct shape; entries carry both `in_key` (= a's value) and `key` (= b's value).
  //
  // `select=<COUNT(*)|SUM(f)|AVG(f)>, group_by=[p], order_by=[<the selected aggregate>]` (protocol v14+) — **ranked mode**:
  // - exactly one `group_by` property, exactly one `order_by` clause naming the select's aggregate (`f` for `SUM(f)` / `AVG(f)`, the `$count` sentinel for `COUNT(*)`), a `limit` in `1 ..= 100`, an optional `offset`, and no `having` / `start_at`, on an index declaring the matching `rankedCountable` / `rankedSummable` / `rankedAverageable` axis → ranked executor, answered in `ResultData.ranked`. On a single-property ranked index no `where` is accepted; on a compound ranked index every leading index property must be pinned with an `EQUAL` where clause (one per property, `group_by` names the trailing property), selecting which prefix's ranking is read.
  // - `DESC` is the "top n" reading (walk the axis from the largest aggregate down), `ASC` the "bottom n" reading. Worked example: `SELECT AVG(grade) GROUP BY restaurantId ORDER BY grade DESC LIMIT 1 OFFSET 4` is the 5th-best restaurant.
  //
  // `select=<COUNT(*)|SUM(f)|AVG(f)>, group_by=[p], having=[<the selected aggregate> <op> <value>]` (protocol v14+) — **having-range mode**:
  // - exactly one `group_by` property, exactly one `having` clause whose aggregate is the select's aggregate, an operator describing one contiguous range (`EQUAL`, `GREATER_THAN[_OR_EQUALS]`, `LESS_THAN[_OR_EQUALS]`, `BETWEEN*`; `NOT_EQUAL` / `IN` rejected), a `limit` in `1 ..= 100`, an optional `order_by` naming the same aggregate (walk direction; ascending by default), and no `offset` / `start_at` / `start_after`, on an index declaring the matching ranked axis → having-range executor, answered in `ResultData.ranked`. `where` follows the same rule as ranked mode: none on a single-property ranked index; exactly one `EQUAL` pin per leading index property on a compound ranked index.
  // - no offset or cursor pagination: a page cut at `limit` continues only by tightening the bound past the last *distinct* aggregate value seen; a cut inside a tie (several groups sharing the boundary aggregate) cannot be continued, so size `limit` above the widest expected tie.
  //
  // **Rejected shapes** (return `Unsupported`):
  // - any non-empty `having` on protocol v13 and earlier; at v14+, any `having` shape outside having-range mode above (multiple clauses, an aggregate other than the select's, `NOT_EQUAL` / `IN`, a `where` shape other than the compound-index equality pins above, or a carried `offset` / cursor).
  // - at v14+: a ranked-shaped request carrying a `where` shape other than the compound-index equality pins above (a non-`EQUAL` operator, a repeated or non-leading property, or a missing pin), a `start_at` / `start_after` cursor, more than one `order_by`, or an `order_by` naming anything but the selected aggregate.
  // - `select=DOCUMENTS` with non-empty `group_by`.
  // - `select=COUNT` with `group_by` on a field that is not constrained by an `In` or range where clause.
  // - `select=COUNT` with `group_by.len() > 2`.
  // - `select=COUNT` with 2-field `group_by` that does not match the `(in_field, range_field)` shape above.
  //
  // **Absent-from-tree branches on `In`-grouped queries**: when
  // `select=COUNT, group_by=[in_field]` and an `In` value has no
  // matching documents, the underlying merk index has nothing to
  // emit (zero-count branches aren't materialized as CountTree
  // elements), so the wire `CountEntries.entries` list contains
  // only the In values that exist.
  //
  // The SDK's proof decoder surfaces this by **omission**, not by
  // a sentinel `count` value: the current point-lookup path query
  // doesn't set `absence_proofs_for_non_existing_searched_keys:
  // true`, so grovedb's `verify_query` silently drops absent-Key
  // branches from the verified elements stream. The drive-side
  // verifier (`verify_point_lookup_count_proof`) therefore emits
  // one `SplitCountEntry` per **present** In branch and the SDK
  // wraps those into `CountEntry`. Callers that need to detect
  // "queried but absent" diff their request's In array against
  // the returned entries by `key` (each entry's `key` is the
  // serialized In value, recoverable via
  // `document_type.serialize_value_for_key(in_field, v, …)`).
  // `SplitCountEntry::count`'s `Option<u64>` and the `None`
  // variant exist for a future absence-proof variant; today the
  // wire `CountEntry.count` is plain `uint64`.
  //
  // For range-grouped queries the walker only emits keys that
  // exist in the index, which IS SQL-conformant; no equivalent
  // reconstruction step because the range itself is unbounded and
  // the caller has no explicit "expected keys" list to compare
  // against.
  message GetDocumentsRequestV1 {
    // Projection over the matched row set. `(function, field)`
    // pair — analogous to `HavingAggregate`'s shape but with an
    // additional `DOCUMENTS` variant for the row-fetch path.
    //
    // Determines what the response carries:
    // - `DOCUMENTS`: `ResultData.documents` (matched rows;
    //   `field` must be empty).
    // - `COUNT`: `ResultData.counts` carrying row counts. Empty
    //   `field` is `COUNT(*)` (group cardinality); non-empty is
    //   `COUNT(field)` (non-null `field` values).
    // - `SUM` / `AVG`: `ResultData` carrying numeric
    //   aggregate(s); `field` is required and must be a
    //   numeric-typed schema field.
    //
    // Single-aggregate vs per-group response shape comes from
    // `group_by` (empty → single, non-empty → per-group entries) —
    // same rule as today's `COUNT` routing.
    //
    // **Server capability today**: `DOCUMENTS`, `COUNT(*)` (empty
    // `field`), `SUM(<field>)`, and `AVG(<field>)` are evaluated
    // end-to-end (no-proof and proof paths route through the drive
    // count / sum / average dispatchers). `COUNT(<field>)` (non-null
    // value counting on a specific field), `MIN(<field>)`, and
    // `MAX(<field>)` are wire-stable but rejected at routing time
    // with `Unsupported("SELECT … is not yet implemented")` so the
    // surface is shipped first and execution lands later without
    // another version bump. MIN/MAX in particular wait on a grovedb
    // primitive — there's no min/max aggregate on count or sum
    // trees today, and the order-by-then-LIMIT-1 emulation has the
    // wrong proof shape for the cryptographic verifier.
    message Select {
      enum Function {
        DOCUMENTS = 0;
        COUNT = 1;
        SUM = 2;
        AVG = 3;
        // Per-group MIN / MAX — `SELECT MIN(field) GROUP BY
        // category` returns the smallest `field` value in each
        // category. These operate over the row values *within*
        // each group, the same way `SUM` and `AVG` do; they are
        // not a cross-group ranking. To pick out the extreme
        // *group*, order by the aggregate instead:
        // `ORDER BY <agg> ASC|DESC LIMIT 1` (see `order_by`).
        MIN = 4;
        MAX = 5;
      }
      Function function = 1;
      // Field the projection function is applied to. See the
      // message-level docstring for the per-function requirement
      // (empty for `DOCUMENTS`, optional for `COUNT`, required
      // for `SUM` / `AVG` / `MIN` / `MAX`).
      string field = 2;
    }

    bytes data_contract_id = 1; // The data contract owning the documents
    string document_type = 2;   // Document type within the contract
    // Structured where clauses. Empty list = no `WHERE` filter
    // (return all matching rows under the document type / contract).
    // See top-level `WhereClause` for shape semantics.
    repeated WhereClause where_clauses = 3;
    // Structured order_by clauses. Empty list = no explicit
    // ordering (server applies the index's natural order). Multiple
    // entries express SQL's `ORDER BY a ASC, b DESC, …` shape; the
    // first entry's direction also governs split-mode entry
    // ordering on `select=COUNT` paths.
    repeated OrderClause order_by = 4;
    // Maximum number of rows to return.
    //
    // **Wire semantics on the `optional uint32` field**: `None`
    // (unset) requests the server's default; `Some(N)` with `N > 0`
    // requests an explicit cap of `N`. `Some(0)` is **rejected with
    // `InvalidLimit` across every SELECT mode** — zero-cap is
    // structurally meaningless and the legacy v0 `uint32`-with-0-as-
    // sentinel mapping doesn't extend to `optional uint32` (the
    // whole point of switching is that `None` carries "unset"
    // explicitly). Callers must send `None` for "use server default."
    //
    // Per-mode behavior of `Some(N > 0)`:
    //   - `select=DOCUMENTS`: matched-document cap (same as v0).
    //   - `select=COUNT, group_by=[]`: **rejected with `InvalidLimit`
    //     when set**. Aggregate count is a single row by construction
    //     — a limit would either be redundant (≥ 1) or silently
    //     mislead callers if the dispatcher's per-In fan-out honored
    //     it and returned a partial sum disguised as a total. Omit
    //     `limit` for aggregate count.
    //   - `select=COUNT, group_by=[in_field]`: **rejected with
    //     `InvalidLimit` when set**. The In array is already capped
    //     at 100 entries by `WhereClause::in_values()`, so the
    //     result is bounded by construction; a separate `limit`
    //     would either be redundant or silently truncate the proof
    //     to fewer In branches than the caller asked for (the
    //     PointLookupProof shape can't represent a partial-In
    //     selection in its `SizedQuery`). Narrow the In array
    //     directly to reduce the result set.
    //   - `select=COUNT, group_by=[range_field]`: entries cap on
    //     the distinct-range walk.
    //   - `select=COUNT, group_by=[in_field, range_field]`: global
    //     cap over the emitted `(in_key, key)` lex stream — NOT
    //     per-In-branch. The compound walk pushes one
    //     `SizedQuery::limit` over the combined tuple stream, so a
    //     request with `|In| = 3` and `limit = 5` returns at most
    //     5 entries total across all In branches (ordered by
    //     `(in_key, key)`, direction from the first `order_by`
    //     clause).
    //   Both range-grouped variants share the same validate-don't-
    //   clamp policy on prove paths — `limit > max_query_limit`
    //   returns `InvalidLimit` rather than silent clamping (see
    //   `RangeDistinctProof`'s contract; unset falls back to the
    //   SDK-shared `DEFAULT_QUERY_LIMIT` compile-time constant so
    //   proof bytes are deterministic across operators).
    optional uint32 limit = 5;

    // Pagination cursor. Valid only for `select=DOCUMENTS`. The
    // count surface (`select=COUNT`) rejects cursors entirely:
    // aggregate counts have no concept of "start," and per-group
    // entry paginators would need a new merk walk that doesn't
    // exist yet — callers paginate counts by narrowing the
    // where-clause range itself instead.
    oneof start {
      bytes start_after = 6;
      bytes start_at = 7;
    }

    bool prove = 8; // Request a grovedb proof instead of raw rows

    // SQL `SELECT` projection list. Multiple entries express
    // `SELECT f1(a), f2(b), …` — one row per group carrying a
    // parallel list of aggregate values in the response.
    //
    // Empty list defaults to a single `documents()` projection
    // for v0-style document fetch — callers that don't opt into
    // the SQL-shaped surface get plain row semantics.
    //
    // **Currently rejected when `selects.len() > 1`** with
    // `Unsupported("multi-projection SELECT is not yet
    // implemented")`. The single-projection cases `DOCUMENTS`,
    // `COUNT(*)`, `SUM(<field>)`, and `AVG(<field>)` are evaluated
    // end-to-end today and route through the drive count / sum /
    // average dispatchers (see the `GetDocumentsResponseV1`
    // docstring for the wire-shape table). `COUNT(<field>)`,
    // `MIN(<field>)`, and `MAX(<field>)` remain rejected at the
    // per-function gate — see the `Select` message-level docstring
    // for the rationale (no grovedb min/max primitive; COUNT(field)
    // needs a non-null counter walk that doesn't exist yet). When
    // multi-projection lands the response shape gains a parallel
    // `repeated AggregateValue values` field, so caller code
    // structured around `repeated Select` doesn't need to be
    // rewritten when it does.
    repeated Select selects = 9;

    // SQL `GROUP BY` field names, in left-to-right order. Empty =
    // no explicit grouping (aggregate for `select=COUNT`). See the
    // message-level docstring for the supported-shape table.
    repeated string group_by = 10;

    // SQL `HAVING` clauses — **boolean** aggregate filters that
    // apply to the grouped rows produced by `select=<COUNT|SUM|AVG>,
    // group_by=[…]`. The wire shape is `HavingClause`, not
    // `WhereClause`, because HAVING evaluates against per-group
    // aggregates (`COUNT` / `SUM` / `AVG`) rather than row field
    // values. Multiple entries combine with implicit AND. See
    // `HavingClause` / `HavingAggregate` for the operator and
    // aggregate-function catalogs.
    //
    // **From protocol v14 a single clause is served** as a bounded
    // range read — having-range mode; see the message-level
    // supported-shape table. On v13 and earlier every non-empty
    // `having` is rejected with `Unsupported("HAVING clause is not
    // yet implemented")`. Multi-clause `HAVING COUNT(*) > 5 AND
    // SUM(amount) > 100` requests can still be constructed on the
    // wire, but stay rejected until a multi-clause evaluator lands.
    //
    // **`having` does not express ranking.** "The n highest-scoring
    // groups" is `ORDER BY <the selected aggregate> DESC LIMIT n`
    // (see `order_by`), which *is* served, from protocol v14. An
    // earlier draft of this surface spelled it
    // `HAVING AVG(grade) IN TOP(5)`; that grammar was removed
    // before release rather than deprecated.
    repeated HavingClause having = 11;

    // Row-based pagination offset, on top of the cursor-based
    // `start_after` / `start_at` pagination. `OFFSET N` skips the
    // first `N` result rows before applying `limit`.
    //
    // **Consumed in ranked mode** (protocol v14+): on a request that
    // routes to the ranked executor (`group_by` + a single `order_by`
    // naming the selected aggregate), `offset` skips that many ranks
    // before the returned page, so `ORDER BY avg(grade) DESC LIMIT 1
    // OFFSET 4` is the 5th-best group. The skip is **counted, not
    // walked**: grovedb descends on each subtree's aggregate count and
    // collapses whole subtrees that fit inside the remaining offset, so
    // the work stays `O(log n + k)` at any offset and the response
    // reports the skip it performed in `RankedEntries.skipped`. On a
    // proved request that count is additionally *attested* — committed
    // to by the proof and re-derived by the verifier; on an unproved
    // one it is the node's own report. See `RankedEntries.skipped`. There is deliberately no ceiling — an
    // offset of 4 and an offset of four billion cost the same *order*
    // of work — neither walks the region it skips — so there is no
    // denial-of-service lever a cap would close. An offset
    // past the end of the ranking is a provable answer rather than an
    // error: `entries` comes back empty and `skipped` is the ranking's
    // whole population.
    //
    // **Rejected everywhere else** with
    // `Unsupported("OFFSET pagination is not yet implemented")` —
    // including on every path at protocol v13 and earlier, which has
    // no ranked executor. Cursor pagination via `start_after` /
    // `start_at` remains the supported way to page through documents.
    optional uint32 offset = 12;
  }

  oneof version {
    GetDocumentsRequestV0 v0 = 1;
    GetDocumentsRequestV1 v1 = 2;
  }
}

message GetDocumentsResponse {
  message GetDocumentsResponseV0 {
    // Represents a collection of documents
    message Documents {
      repeated bytes documents = 1; // The actual documents in binary form
    }

    oneof result {
      Documents documents = 1; // The actual documents requested
      Proof proof = 2; // Cryptographic proof of the documents, if requested
    }
    ResponseMetadata metadata = 3; // Metadata about the blockchain state
  }

  // v1 response. Two-variant outer `oneof` mirrors every other
  // `Get*Response`: a non-proof result at position 1, the proof at
  // position 2. The non-proof result is itself a `oneof` because
  // a single v1 request can produce either matched documents (for
  // `select=DOCUMENTS`) or count results (for `select=COUNT`) —
  // wrapping them in an inner `ResultData` keeps the outer shape
  // canonical without flattening to a three-variant oneof.
  //
  // Wire shape by `request.select` × `group_by` × `prove`:
  //   - `select=DOCUMENTS` (no prove)            → `result.data.documents`.
  //   - `select=COUNT, group_by=[]` (no prove)   → `result.data.counts.aggregate_count`.
  //   - `select=COUNT, group_by=[…]` (no prove)  → `result.data.counts.entries`.
  //   - `select=SUM, group_by=[]` (no prove)     → `result.data.sums.aggregate_sum`.
  //   - `select=SUM, group_by=[…]` (no prove)    → `result.data.sums.entries`.
  //   - `select=AVG, group_by=[]` (no prove)     → `result.data.averages.aggregate_average`.
  //   - `select=AVG, group_by=[…]` (no prove)    → `result.data.averages.entries`.
  //   - any select (prove)                        → `result.proof`.
  //
  // **SUM / AVG status**: all four shapes above are wired
  // end-to-end on the drive dispatcher (no-proof and proof paths
  // both terminate at grovedb's aggregate-sum / sum-tree-walk
  // primitives, not at a `NotYetImplemented` stub). The four
  // resolved-mode tables (`compute_aggregate_mode_and_check_limit_v0`,
  // `detect_count_mode`, `detect_sum_mode`, AVG mirror) decide which
  // executor to run from the (mode × range × group_by × prove)
  // tuple; the executors compose count and sum walks for AVG so
  // there's no separate average primitive on the grovedb side.
  // Routing details live in
  // `packages/rs-drive/src/query/drive_document_{sum,average}_query/`.
  //
  // `CountResults` / `CountEntry` / `CountEntries` are nested in
  // `GetDocumentsResponseV1` rather than re-exported from a
  // top-level message — the v0 `getDocumentsCount` endpoint that
  // previously owned them has been removed in this version (it
  // shipped briefly in #3623 and never had stable callers); v1 is
  // the single home for the count wire types.
  message GetDocumentsResponseV1 {
    // Documents result variant — matches the v0 `Documents`
    // message field-for-field (kept distinct so v1 doesn't reach
    // into v0's namespace once v0 is eventually retired).
    message Documents {
      repeated bytes documents = 1;
    }

    // A single per-key entry. Carries `in_key` for compound
    // queries (`In` on a prefix property of a `range_countable`
    // index plus a range clause on the terminator) where each
    // entry is keyed by both the In-fork's prefix value (`in_key`)
    // and the terminator value (`key`). Cross-fork aggregation is
    // intentionally NOT done server-side — callers get the
    // unmerged per-`(in_key, key)` view and can reduce client-side
    // if they want a flat histogram.
    message CountEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      // `jstype = JS_STRING` so JS/Web clients receive a string
      // and don't round counts > 2^53−1 to the nearest
      // representable Number.
      uint64 count = 3 [jstype = JS_STRING];
    }

    message CountEntries {
      repeated CountEntry entries = 1;
    }

    // Non-proof count result. Shape is mode-dependent and made
    // explicit on the wire via the inner `variant` oneof:
    //   * `aggregate_count`: `select=COUNT, group_by=[]` —
    //     single u64 with no per-key breakdown.
    //   * `entries`: `select=COUNT, group_by=[…]` — one
    //     CountEntry per distinct group, in serialized-key order
    //     (subject to the first `order_by` clause's direction and
    //     `limit`).
    message CountResults {
      oneof variant {
        uint64 aggregate_count = 1 [jstype = JS_STRING];
        CountEntries entries = 2;
      }
    }

    // Sum-side analog of `CountEntry` — one per matched key for
    // `select=SUM, group_by=[...]` queries. `in_key` carries the
    // outer prefix value for compound `(In, range)` shapes; `key`
    // carries the terminator value. `sum` is signed because grovedb's
    // SumTree values are `i64` and sums can in principle be negative
    // (deliberate i64-overflow signaling — see the sum-tree book
    // chapter's "Signed `i64` overflow" note). For tip-jar-style
    // non-negative sums this stays >= 0 in practice.
    message SumEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      // `jstype = JS_STRING` so JS/Web clients receive a string
      // and don't round large sums to the nearest Number.
      sint64 sum = 3 [jstype = JS_STRING];
    }

    message SumEntries {
      repeated SumEntry entries = 1;
    }

    // Non-proof sum result. Same shape as `CountResults` for the
    // sum surface — the variants mirror count's:
    //   * `aggregate_sum`: `select=SUM, group_by=[]` — single signed
    //     sum with no per-key breakdown.
    //   * `entries`: `select=SUM, group_by=[…]` — one SumEntry per
    //     distinct group.
    message SumResults {
      oneof variant {
        sint64 aggregate_sum = 1 [jstype = JS_STRING];
        SumEntries entries = 2;
      }
    }

    // Average-side analog of `SumEntry` — one per matched key for
    // `select=AVG, group_by=[…]` queries. Each entry carries BOTH
    // the count and the sum for its group; the client divides
    // `sum / count` to compute the actual average.
    //
    // Why no `average` field on the wire? Returning the (count, sum)
    // pair preserves full precision and lets the client pick the
    // representation it wants (integer-truncated division, floating-
    // point, decimal). Returning a single pre-computed `average`
    // would force the server to choose, and any choice loses
    // information for callers that wanted a different one.
    //
    // This shape is produced by grovedb's `AggregateCountAndSumOnRange`
    // primitive (one root-hash-committed traversal returning both
    // metrics) which lands as part of grovedb PR 670 alongside the
    // PCPS (`ProvableCountProvableSumTree`) tree element.
    message AverageEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      // `jstype = JS_STRING` on both fields so JS/Web clients receive
      // strings and don't lose precision on counts/sums exceeding
      // `Number.MAX_SAFE_INTEGER`.
      uint64 count = 3 [jstype = JS_STRING];
      sint64 sum = 4 [jstype = JS_STRING];
    }

    message AverageEntries {
      repeated AverageEntry entries = 1;
    }

    // Aggregate average across all matched documents (no group_by).
    // Same `(count, sum)` shape as a single entry — the client
    // computes `avg = sum / count` itself.
    message AverageAggregate {
      uint64 count = 1 [jstype = JS_STRING];
      sint64 sum = 2 [jstype = JS_STRING];
    }

    // Non-proof average result. Same outer shape as
    // `CountResults` / `SumResults`; the variants mirror them:
    //   * `aggregate_average`: `select=AVG, group_by=[]` — single
    //     `(count, sum)` pair with no per-key breakdown.
    //   * `entries`: `select=AVG, group_by=[…]` — one AverageEntry
    //     per distinct group, each carrying its own `(count, sum)`.
    message AverageResults {
      oneof variant {
        AverageAggregate aggregate_average = 1;
        AverageEntries entries = 2;
      }
    }

    // One group in a ranked (`GROUP BY … ORDER BY <agg> LIMIT n`)
    // result: the group's index key plus the aggregate it was ranked
    // by.
    //
    // `key` is the raw index-key bytes of the GROUP BY property's
    // value — the same bytes that name the group's value tree under
    // the index (for a `string` property, its UTF-8 bytes). Clients
    // that want the typed value decode it with the document type's
    // key deserialization; the wire carries bytes so prover and
    // verifier agree without a schema round-trip.
    //
    // Exactly one `value` variant is set, determined by the
    // request's SELECT function:
    //   * `count`  — `SELECT COUNT(*)`, ranked on the index's
    //     `rankedCountable` axis.
    //   * `sum`    — `SELECT SUM(field)`, `rankedSummable` axis.
    //     Signed for the same reason `SumEntry.sum` is.
    //   * `avg`    — `SELECT AVG(field)`,
    //     `rankedAverageable` axis.
    message RankedEntry {
      bytes key = 1;
      oneof value {
        // `jstype = JS_STRING` so JS/Web clients receive a string
        // and don't round counts > 2^53−1 to the nearest
        // representable Number — same choice as `CountEntry.count`.
        uint64 count = 2 [jstype = JS_STRING];
        // `jstype = JS_STRING` for the same precision reason as
        // `SumEntry.sum`.
        sint64 sum = 3 [jstype = JS_STRING];
        // The group's average, as a **`double` approximation** of the
        // exact value the Avg axis is ordered by.
        //
        // What grovedb actually commits to and sorts by is an `i128`
        // fixed-point integer: `floor(sum * SCALE / count)` with
        // euclidean (toward −∞) division, where SCALE is grovedb's
        // `AVG_FIXED_POINT_SCALE` (currently 10^19). This field is
        // that integer divided by SCALE in `f64`, i.e.
        // `fixed_point as f64 / SCALE as f64`.
        //
        // A `double` is honest here because `RankedEntry` is only ever
        // populated on the **no-proof ("quick answer") path**, where
        // the client has already chosen to trust the server's reply.
        // A proof-verifying client never reads this field: it
        // reconstructs each entry from the grovedb proof itself, where
        // the exact fixed-point `i128` lives, so nothing about proof
        // verification depends on this number's precision.
        //
        // Precision bound: `f64` carries ~15–16 significant decimal
        // digits, so two groups whose exact fixed-point averages differ
        // only beyond that can compare equal here. Do not use this
        // value for equality checks, tie-breaking, or any
        // reconstruction of the committed integer — request the proof
        // and read the fixed point from it instead. Entry *order* is
        // still exact: the server ranks on the i128 before converting.
        //
        // SCALE is a grovedb constant, not a wire constant: it moved
        // from 10^15 to 10^19 before release. Clients that need it
        // (e.g. to go back to fixed point on the proof path) should
        // read it from the SDK's re-export (`RANKED_AVG_SCALE`) rather
        // than hardcoding the literal.
        double avg = 4;
      }
    }

    // Ranked result entries. **Entry order IS the ranking order** —
    // best-first for `ORDER BY <agg> DESC`, worst-first for `ASC`.
    // Clients must not re-sort; ties (equal aggregates) come back in
    // group-key order in the direction of the walk, which is
    // descending group-key order for `DESC`.
    //
    // Fewer than `limit` entries is normal — the index simply has
    // fewer groups than requested — and is not an error.
    message RankedEntries {
      repeated RankedEntry entries = 1;

      // How many groups were skipped before the first entry — the
      // page's **starting rank base**. Entry `i` of `entries` is the
      // group at rank `skipped + i` (0-based).
      //
      // `0` for an `OFFSET 0` (or offset-less) query, which is what
      // makes this field additive: a caller that never paginates sees
      // the value it would have assumed. For `OFFSET m` it is
      // normally `m`, and it is what turns a page back into a
      // *ranking* — without it, a caller who asked for
      // `ORDER BY avg(grade) DESC LIMIT 1 OFFSET 4` receives one
      // entry with no way to tell that it really is the 5th-best
      // group rather than the best.
      //
      // **When a requested offset exceeds the population**, `entries`
      // is empty and `skipped` is the ranking's *total* reported
      // population — a positive, useful answer ("there are only 12
      // groups") rather than a bare empty list.
      //
      // Both paths report the same quantity: the offset you asked for
      // when the skip succeeded, and the ranking's total population
      // when the walk ran out of groups first. They no longer disagree
      // anywhere, including past the end.
      //
      // What differs is the *warrant*, not the value. On the proved
      // path the number is cryptographically attested — re-derived by
      // the verifier from the counted subtree commitments in the proof
      // bytes rather than trusted from this field — so a proving client
      // should use the verified value and ignore this one. On the
      // unproven path it is an **unverified claim**, exactly like the
      // entries beside it: it equals the attested value on an honest
      // node, and nothing forces a node to be honest. Read "the true
      // population" as "what this node says the population is".
      // Callers who need to trust it, rather than merely receive it,
      // must still prove.
      //
      // Do not assume this field equals the offset you requested. It
      // equals the offset only when the skip succeeded; when the walk
      // ran out of groups first it is smaller, and that is the answer
      // rather than an inconsistency.
      optional uint64 skipped = 2 [jstype = JS_STRING];
    }

    // Non-proof result wrapper. The outer `oneof result` switches
    // between this and `proof`; this inner oneof switches between
    // the non-proof shapes the v1 surface can return.
    message ResultData {
      oneof variant {
        Documents documents = 1;
        CountResults counts = 2;
        // Sum-aggregate result. Routed when the request's
        // `select.function == SUM` and the dispatcher's
        // [`DriveDocumentSumQuery`] (in rs-drive) returns a
        // non-proof variant. The schema field name (`sums`) parallels
        // `counts` above; field numbers stay 1/2/3/4 per the proto-
        // wire-stability rule (additions only, never renumbers).
        SumResults sums = 3;
        // Average-aggregate result. Routed when the request's
        // `select.function == AVG`. The dispatcher returns the
        // `(count, sum)` pair grovedb's `AggregateCountAndSumOnRange`
        // primitive produces in one root-hash-committed traversal;
        // the client divides to obtain the actual average. See
        // `book/src/drive/average-index-examples.md` for the design
        // and the grades-contract worked example.
        AverageResults averages = 4;
        // Ranked-aggregate result. Routed when the request pairs a
        // single-property `group_by` with a single `order_by` clause
        // naming the single aggregate `select` (the `$count` sentinel
        // for `COUNT(*)`) and a `limit` — SQL's `ORDER BY <agg>
        // DESC LIMIT n [OFFSET m]`. Answered from the per-axis
        // secondary of an indexed tree, so the index must declare the
        // matching `rankedCountable` / `rankedSummable` /
        // `rankedAverageable` keyword (meta-schema v3, protocol
        // version 14+). Entry order is the ranking order, and
        // `skipped` carries the page's starting rank — see
        // `RankedEntries`.
        RankedEntries ranked = 5;
      }
    }

    oneof result {
      ResultData data = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version {
    GetDocumentsResponseV0 v0 = 1;
    GetDocumentsResponseV1 v1 = 2;
  }
}

