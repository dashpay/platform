[package]
name = "dash-sdk-macros"
version.workspace = true
edition = "2021"
description = "Proc macros for dash-sdk — provides #[box_async] to replace #[async_trait]"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
