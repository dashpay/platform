[package]
name = "wasm-dpp2"
version = { workspace = true }
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# TODO: Consider to use talc allocator
#talc = { version = "=4.4.2", default-features = false, features = ["lock_api"] }
bincode = "=2.0.1"
wasm-bindgen = { version = "=0.2.108", default-features = false, features = [
  "serde-serialize",
] }
dpp-json-convertible-derive = { path = "../rs-dpp-json-convertible-derive" }
dpp = { path = "../rs-dpp", default-features = false, features = [
  "state-transition-signing",
  "identity-serialization",
  "bls-signatures",
  "platform-value",
  "json-conversion",
  "state-transitions",
] }
serde-wasm-bindgen = { git = "https://github.com/dashpay/serde-wasm-bindgen", branch = "fix/uint8array-to-bytes" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
js-sys = "0.3.77"
hex = "0.4.3"
anyhow = "1.0.75"
thiserror = "1.0"
sha2 = "0.10.8"
