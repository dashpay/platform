[package]
name = "dash-platform-cxx"
version.workspace = true
authors = ["Dash Core Group <dev@dash.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "CXX shell over dash-sdk for C++ embedders that supply their own trust context and signing keys"

[lib]
name = "dash_platform_cxx"
crate-type = ["staticlib", "rlib"]

[features]
default = []
# dash-sdk's mock transport, for tests that replay recorded proved responses
# through the same client code an embedder runs. Never enabled by embedders.
mocks = ["dash-sdk/mocks"]

[dependencies]
cxx = "1.0"
dash-sdk = { path = "../rs-sdk", default-features = false, features = [
  "dpns-contract",
  "dashpay-contract",
  "core_key_wallet",
] }
platform-encryption = { path = "../rs-platform-encryption" }
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time"] }
futures = "0.3"
async-trait = "0.1"
zeroize = "1.8"
hex = "0.4"

[build-dependencies]
cxx-build = "1.0"
