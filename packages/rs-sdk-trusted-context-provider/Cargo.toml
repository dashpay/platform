[package]
name = "rs-sdk-trusted-context-provider"
version.workspace = true
edition = "2021"
authors = ["sam@dash.org"]
license = "MIT"
description = "Trusted HTTP-based context provider for Dash Platform SDK"

[dependencies]

dash-async = { path = "../rs-dash-async" }
dash-context-provider = { path = "../rs-context-provider" }
# Verifies the quorum proofs behind `VerifiedHttpContextProvider`.
dash-core-proof = { path = "../rs-core-proof" }
dpp = { path = "../rs-dpp", default-features = false, features = [
    "dash-sdk-features",
    "bls-signatures",
] }
# TLS backend target-gated (see [target] sections below): Android gets rustls
# + bundled webpki roots; all other targets keep default native-tls so iOS
# still validates against the system trust store.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.41"
lru = "0.16.3"
arc-swap = "1.7.1"
hex = "0.4.3"
url = "2.5"
# `try_join!` / `join!` for the concurrent quorum fetches in `update_quorum_caches`
# and `refresh_quorum_caches`, and `Shared` for the refreshes misses share.
futures = { version = "0.3.30" }
# Monotonic clock that also works on wasm32, for spacing out refreshes.
web-time = "1.1"

[[example]]
name = "refresh_checkpoints"
# Its tests run with the crate's.
test = true

[features]
default = []

# All system contracts (includes all individual contracts)
all-system-contracts = [
    "dpp/all-system_contracts",
    "withdrawals-contract",
    "dpns-contract",
    "dashpay-contract",
    "wallet-utils-contract",
    "token-history-contract",
    "keywords-contract",
    "document-history-contract",
    "app-connect-contract",
    "moderation-charters-contract",
    "decision-proposals-contract",
]

# Individual contract features - these enable specific contracts in DPP
withdrawals-contract = ["dpp/withdrawals-contract"]
dpns-contract = ["dpp/dpns-contract"]
dashpay-contract = ["dpp/dashpay-contract"]
wallet-utils-contract = ["dpp/wallet-utils-contract"]
token-history-contract = ["dpp/token-history-contract"]
keywords-contract = ["dpp/keywords-contract"]
document-history-contract = ["dpp/document-history-contract"]
app-connect-contract = ["dpp/app-connect-contract"]
moderation-charters-contract = ["dpp/moderation-charters-contract"]
decision-proposals-contract = ["dpp/decision-proposals-contract"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Runs the browser's non-`Send` quorum fetches and timers on the local executor.
wasm-bindgen-futures = { version = "0.4.58" }
gloo-timers = { version = "0.3.0", features = ["futures"] }
# Browser `fetch` for proof requests: unlike reqwest on wasm32 it can refuse
# redirects, abort, and bound a body while streaming it.
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"
wasm-streams = "0.5"
web-sys = { version = "0.3.85", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Waits out the gap between two refreshes of the quorum lists.
tokio = { version = "1.40", features = ["time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
# The `refresh_checkpoints` example asks seed evonodes for Platform's Core height.
dapi-grpc = { path = "../dapi-grpc", default-features = false, features = ["platform"] }
dash-network-seeds = { workspace = true }
rs-dapi-client = { path = "../rs-dapi-client" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Runs the browser transport's tests under Node.js or a browser.
wasm-bindgen-test = "0.3.58"
