[package]
name = "rs-scripts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "decode-document"
path = "src/bin/decode_document.rs"

[[bin]]
name = "check-contract-properties"
path = "src/bin/check_contract_properties.rs"

[[bin]]
name = "register-contract"
path = "src/bin/register_contract.rs"

[[bin]]
name = "load-test"
path = "src/bin/load_test.rs"

[dependencies]
dpp = { path = "../rs-dpp", features = ["system_contracts", "json-conversion", "state-transition-signing", "random-documents"] }
dapi-grpc = { path = "../dapi-grpc", features = ["client"] }
data-contracts = { path = "../data-contracts" }
platform-version = { path = "../rs-platform-version" }
dash-sdk = { path = "../rs-sdk" }
rs-dapi-client = { path = "../rs-dapi-client", default-features = false }
rs-sdk-trusted-context-provider = { path = "../rs-sdk-trusted-context-provider" }
simple-signer = { path = "../simple-signer", features = ["state-transitions"] }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.2", features = ["channel", "transport", "tls-native-roots", "tls-webpki-roots", "tls-ring"], default-features = false }
ureq = "3.3"
rand = "0.8"
