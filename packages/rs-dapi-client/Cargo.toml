[package]
name = "rs-dapi-client"
version.workspace = true
edition = "2021"

[features]

default = ["offline-testing"]

mocks = [
  "dep:sha2",
  "dep:hex",
  "dapi-grpc/mocks",
  "dep:serde",
  "dep:http-serde",
  "dep:serde_json",
]
# dump requests and responses to file
dump = ["mocks"]
# skip tests that require connection to the platform; enabled by default
offline-testing = []

# non-wasm dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
backon = { version = "1.3", default-features = false, features = [
  "tokio-sleep",
] }
tokio = { version = "1.40", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
tonic-web-wasm-client = { version = "0.8.0" }
wasm-bindgen-futures = { version = "0.4.58" }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4.38", features = ["serde", "wasmbind"] }


[dependencies]
backon = { version = "1.3", default-features = false }
dapi-grpc = { path = "../dapi-grpc", features = [
  "core",
  "platform",
  "client",
], default-features = false }
futures = { version = "0.3.28" }
tokio-util = { version = "0.7.12", default-features = false }
http = { version = "1.1.0", default-features = false }
http-serde = { version = "2.1", optional = true }


rand = { version = "0.8.5", features = [
  "small_rng",
  "getrandom",
], default-features = false }
thiserror = "2.0.17"
tracing = "0.1.41"
tokio = { version = "1.40", default-features = false }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4.3", optional = true }
lru = { version = "0.16.3" }
serde = { version = "1.0.219", optional = true, features = ["derive"] }
serde_json = { version = "1.0.140", optional = true }
chrono = { version = "0.4.38", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros"] }

[package.metadata.cargo-machete]

ignored = [
  "getrandom", # we need this to enforce `js` feature
]
