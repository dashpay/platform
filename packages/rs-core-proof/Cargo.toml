[package]
name = "dash-core-proof"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT"
description = "Verifies Dash Core quorum proof chains (DIP 175) from a trusted checkpoint"

[dependencies]
blst = "0.3.17"
hex = "0.4"
rs-x11-hash = "0.1.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
