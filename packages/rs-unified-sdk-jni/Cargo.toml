[package]
name = "rs-unified-sdk-jni"
edition = "2021"
version.workspace = true
rust-version.workspace = true
license = "MIT"
description = "JNI bindings for the Dash Platform SDK — Android/Kotlin shim over rs-sdk-ffi, platform-wallet-ffi and key-wallet-ffi"

[lib]
# Kotlin loads this as System.loadLibrary("dash_sdk_jni").
name = "dash_sdk_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
rs-sdk-ffi = { path = "../rs-sdk-ffi" }
platform-wallet-ffi = { path = "../rs-platform-wallet-ffi" }
key-wallet-ffi = { workspace = true }
dash-network = { workspace = true, features = ["ffi"] }
log = "0.4"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
dashcore = { workspace = true }
# Anchors the cross-language golden-fixture test to the canonical DashPay
# contract id, so the mirrored Kotlin constant can't drift undetected.
dashpay-contract = { path = "../dashpay-contract" }

[features]
default = ["shielded"]
# Forwards to `platform-wallet-ffi/shielded`. Pulls Orchard / ZK shielded
# sync support into the Android library, matching the iOS framework.
shielded = ["platform-wallet-ffi/shielded"]
tokio-metrics = [
    "platform-wallet-ffi/tokio-metrics",
    "rs-sdk-ffi/tokio-metrics",
]
