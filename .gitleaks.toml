regexTarget = "match"
paths = [
  '''^packages/wasm-dpp2/tests/unit/IdentitySigner\.spec\.ts$''',
  '''^packages/wasm-dpp2/tests/unit/PlatformAddressSigner\.spec\.ts$''',
]
regexes = [
  '''^testPrivateKeyHex = '67ad1669d882da256b6fa05e1b0ae384a6ac8aed146ea53602b8ff0e1e9c18e9'$''',
  '''^testPrivateKeyWif = 'cR4EZ2nAvCmn2cFepKn7UgSSQFgFTjkySAchvcoiEVdm48eWjQGn'$''',
]

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/wasm-sdk/tests/unit/conversion-derivation\.spec\.ts$''']
regexes = [
  '''^privateKeyHex: '1234abcd5678ef90'$''',
  '''^privateKeyWif: 'cNYPkC4hGoE11bMkiCbfvb55ygXdBhazLkEhcEndxM8bufmXQ5ZZ'$''',
]

# Regtest operator keys paired with the recorded RPC fixtures and public keys.
[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/dashmate/test/fixtures/platformSetupConfigs\.js$''']
regexes = ['''^OPERATOR_PRIVATE_KEY = '1bbac8e471b80050ea44afb514c87cb1ef03db5c66e643c7d6e0f09b29bedbc0'$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/dashmate/test/unit/config/assertPlatformCanStartFactory\.spec\.js$''']
regexes = ['''^core\.masternode\.operator\.privateKey', '1bbac8e471b80050ea44afb514c87cb1ef03db5c66e643c7d6e0f09b29bedbc0'$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/dashmate/test/unit/core/readPlatformRegistration\.spec\.js$''']
regexes = [
  '''^UNREGISTERED_OPERATOR_PRIVATE_KEY = '66e40ce736c2c0689e0372647d41a8c4cd14e6edf44cccff48068fee1cffe669'$''',
  '''^operatorPrivateKey: '0c9f8076444cabb3f319d3a349603cf5fdbb37ad02afa539083a2e45864a0a6c'$''',
  '''^operatorPrivateKey: '1bbac8e471b80050ea44afb514c87cb1ef03db5c66e643c7d6e0f09b29bedbc0'$''',
  '''^operatorPrivateKey: '72c8650e9a0d6c06b7792dd372f59f8746d88b155f84b16d795f50696c3bbf03'$''',
]

# Tenderdash Ed25519 key-type discriminator.
[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/dashmate/src/tenderdash/parseTenderdashNodeKey\.js$''']
regexes = ['''^ED25519_KEY_TYPE = 'tendermint/PrivKeyEd25519'$''']

[[rules]]
id = "private-key"

# Localhost TLS proxy key fixture.
[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/rs-dapi-client/tests/data/proxy/server\.key$''']
regexes = ['''^-----BEGIN PRIVATE KEY-----\nMIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg47vbuAz42f51KN10\nn9lL4jfsfXJGvQSEKR6x6dYiVwWhRANCAATntdIOlHW3ssiM34HJHOZIE50vG9RX\nBxXPaC34aWiMErifSc700BbDSEUVOPU/FKFLQo/roiVuTFOsMBE6YTBU\n-----END PRIVATE KEY-----$''']

# Dummy PEM blocks used to exercise certificate-chain rejection.
[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''^packages/dashmate/test/unit/ssl/installCertificateFilesTask\.spec\.js$''']
regexes = [
  '''^-----BEGIN ENCRYPTED PRIVATE KEY-----\\nAAAA\\n-----END ENCRYPTED PRIVATE KEY-----\\n'\],\n    \['an indented key', \(\) => '  -----BEGIN PRIVATE KEY-----$''',
  '''^-----BEGIN PRIVATE KEY-----\\nAAAA\\n-----END PRIVATE KEY-----\\n'\],\n    \['an EC key', \(\) => '-----BEGIN EC PRIVATE KEY-----$''',
]
